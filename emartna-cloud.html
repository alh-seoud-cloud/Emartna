<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>عمارتنا — تحويل</title>
<script>
  /* البرنامج اتنقل للرابط الرئيسي. بنحوّل مع الحفاظ على أي
     باراميتر في الرابط (زي كود الدعوة ?invite=...) */
  (function(){
    var base = location.origin + location.pathname.replace(/[^/]*$/, '');
    location.replace(base + location.search + location.hash);
  })();
</script>
<style>
  body{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:#F8FAF9;color:#1b2b28;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}
  a{color:#159A8C;font-weight:700}
</style>
</head>
<body>
  <div>
    <h2>البرنامج اتنقل للرابط الرئيسي</h2>
    <p>لو الصفحة ما اتحوّلتش تلقائيًا، <a href="./">اضغط هنا</a>.</p>
  </div>
</body>
</html>
