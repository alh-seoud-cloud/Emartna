function addSysPaymentMethod(){
  const type=document.getElementById('newSysPayType').value;
  const details=document.getElementById('newSysPayDetails').value.trim();
  if(!details)return showMessage('أدخل تفاصيل طريقة السداد');
  REG.sysOwner.paymentMethods=REG.sysOwner.paymentMethods||[];
  REG.sysOwner.paymentMethods.push({id:uid(),type,details});
  saveRegistry();
  document.getElementById('sysPayMethodsList').innerHTML=paymentMethodsListHTML(REG.sysOwner.paymentMethods,true);
  document.getElementById('newSysPayDetails').value='';
}
function removeSysPaymentMethod(id){
  REG.sysOwner.paymentMethods=(REG.sysOwner.paymentMethods||[]).filter(m=>m.id!==id);
  saveRegistry();
  document.getElementById('sysPayMethodsList').innerHTML=paymentMethodsListHTML(REG.sysOwner.paymentMethods,true);
}
function saveVendorContact(){
  REG.sysOwner.contactPhoneCountry=document.getElementById('soCountry').value;
  REG.sysOwner.contactPhone=document.getElementById('soPhone').value.trim();
  REG.sysOwner.contactEmail=document.getElementById('soEmail').value.trim();
  const payLink=document.getElementById('soPayLink').value.trim();
  if(payLink&&!/^https?:\/\//i.test(payLink))return showMessage('رابط الدفع لازم يبدأ بـ http:// أو https://');
  REG.sysOwner.paymentLink=payLink;
  const siteUrl=document.getElementById('soSiteUrl').value.trim();
  if(siteUrl&&!/^https?:\/\//i.test(siteUrl))return showMessage('رابط الموقع لازم يبدأ بـ http:// أو https://');
  REG.sysOwner.siteUrl=siteUrl;
  saveRegistry(); toast('تم الحفظ');
}
async function saveSysOwner(){
  REG.sysOwner.username=document.getElementById('soUser').value.trim()||REG.sysOwner.username;
  const p=document.getElementById('soPass').value;
  if(p){const pwErr=passwordPolicyError(p); if(pwErr)return showMessage(pwErr); REG.sysOwner.password=await hashPassword(p);}
  const rq=document.getElementById('soRQ').value.trim(); if(rq)REG.sysOwner.recoveryQ=rq;
  const ra=document.getElementById('soRA').value.trim(); if(ra)REG.sysOwner.recoveryA=await hashPassword(ra.toLowerCase());
  saveRegistry();toast('تم الحفظ');
}

/* ---------- كل المستخدمين (عبر كل العمارات) ---------- */
function pageSysUsers(){
  const rows=[];
  REG.buildings.forEach(b=>{
    const d=loadBuildingData(b.id); if(!d)return;
    (d.users||[]).forEach(u=>{
      const ap=u.apartmentId?(d.apartments||[]).find(a=>a.id===u.apartmentId):null;
      let apLabel='';
      if(ap){
        const sameType=(d.apartments||[]).filter(x=>x.type===ap.type).sort((x,y)=>x.number-y.number);
        const idx=sameType.findIndex(x=>x.id===ap.id)+1;
        apLabel=(ap.type==='shop'?'محل ':'شقة ')+idx;
      }
      rows.push({buildingId:b.id,buildingName:b.name,username:u.username,name:u.name,role:u.role,phone:phoneFull(u.phoneCountry,u.phone),email:u.email||'',apLabel,active:u.active!==false});
    });
  });
  const cols=[
    {key:'building',label:'العمارة',value:r=>r.buildingName,cell:r=>esc(r.buildingName)},
    {key:'username',label:'اسم المستخدم',value:r=>r.username,cell:r=>`<code>${esc(r.username)}</code>`},
    {key:'name',label:'الاسم',value:r=>r.name,cell:r=>esc(r.name)},
    {key:'role',label:'الصلاحية',value:r=>r.role,cell:r=>r.role==='admin'?'<span class="badge b">رئيس اتحاد - كل الصلاحيات</span>':r.role==='tenant'?'<span class="badge y">مستأجر</span>':'<span class="badge n">صاحب شقة</span>'},
    {key:'phone',label:'الهاتف',value:r=>r.phone,cell:r=>`<span class="small">${esc(r.phone||'-')}</span>`},
    {key:'email',label:'البريد الإلكتروني',value:r=>r.email,cell:r=>`<span class="small">${esc(r.email||'-')}</span>`},
    {key:'apartment',label:'الوحدة',value:r=>r.apLabel,cell:r=>esc(r.apLabel||'-')},
    {key:'active',label:'الحالة',value:r=>r.active?1:0,cell:r=>r.active?'<span class="badge g">نشط</span>':'<span class="badge r">معطّل</span>'},
    {key:'x',label:'',value:null,cell:r=>`<div class="flexrow"><button class="btn sm" onclick="sysResetUserPassword('${r.buildingId}','${r.username}')">إعادة تعيين كلمة المرور</button><button class="btn sm ghost" onclick="sysToggleUserActive('${r.buildingId}','${r.username}')">${r.active?'تعطيل':'تفعيل'}</button></div>`}
  ];
  return `<p class="small">كل حسابات الدخول على كل العمارات المسجّلة على هذا الجهاز (${rows.length} حساب).</p>
  <div class="mtop">${sortableTable('sysUsersTable',rows,cols,null,{defaultKey:'building',exportName:'كل المستخدمين'})}</div>`;
}
async function sysResetUserPassword(buildingId,username){
  const d=loadBuildingData(buildingId); const u=d.users.find(x=>x.username===username); if(!u)return;
  promptModal('كلمة مرور جديدة','8 حروف على الأقل، حرف ورقم ورمز','',async(newPass)=>{
    if(!newPass)return;
    const pwErr=passwordPolicyError(newPass); if(pwErr)return showMessage(pwErr);
    u.password=await hashPassword(newPass); saveBuildingData(buildingId,d);
    showMessage('تم تغيير كلمة المرور. أبلغ صاحب الحساب بها.');
  },'تعيين كلمة المرور');
}
function sysToggleUserActive(buildingId,username){
  const d=loadBuildingData(buildingId); const u=d.users.find(x=>x.username===username); if(!u)return;
  if(u.role==='admin'&&d.users.filter(x=>x.role==='admin'&&x.active!==false).length<=1&&u.active!==false)
    return showMessage('لا يمكن تعطيل آخر حساب رئيس اتحاد نشط في هذه العمارة');
  u.active=u.active===false?true:false; saveBuildingData(buildingId,d);
  toast('تم الحفظ'); renderSysContent();
}

function ensurePlans(){
  if(!REG.plans||!REG.plans.length)REG.plans=defaultPlansSeed();
  REG.plans.forEach(p=>{if(p.discountPercent===undefined)p.discountPercent=0;if(p.priceBefore===undefined)p.priceBefore=0;if(p.active===undefined)p.active=true;});
  if(!REG.plans.some(p=>p.key==='promo_2months')){
    const idx=REG.plans.findIndex(p=>p.isTrial);
    REG.plans.splice(idx>=0?idx+1:0,0,defaultPlansSeed().find(p=>p.key==='promo_2months'));
  }
  return REG.plans;
}

function saveVersion(id){
  const version=document.getElementById('vsVersion').value.trim();
  if(!version)return showMessage('أدخل رقم الإصدار');
  const date=document.getElementById('vsDate').value||todayISO();
  const notes=window.__versionNotesDraft||[];
  if(id){
    const v=ensureVersionHistory().find(x=>x.id===id); if(!v)return;
    Object.assign(v,{version,date,notes});
  }else{
    ensureVersionHistory().push({id:uid(),version,date,notes});
  }
  saveRegistry();closeModal();toast('تم الحفظ');renderSysContent();
}

  confirmAction('هل تريد حذف سجل الإصدار ده؟',()=>{

function refreshCustomOfferPreview(buildingId){
  const rec=REG.buildings.find(b=>b.id===buildingId); if(!rec)return;
  const type=document.getElementById('coType').value;
  const templates=offerTemplatesForType(type);
  const planKey=document.getElementById('coPlan').value;
  const plan=findPlan(planKey);
  const pickEl=document.getElementById('coTemplatePick');
  const idx=pickEl?Number(pickEl.value)||0:0;
  let vars;
  if(type==='coupon'){
    if(document.getElementById('coCouponPick').options.length&&document.getElementById('coPlan')) refreshCouponPickerOptions(buildingId);
    const couponId=document.getElementById('coCouponPick').value;
    const coupon=ensureCoupons().find(c=>c.id===couponId);
    const originalPrice=plan?planPriceAfter(plan):0;
    const discountedPrice=coupon?Math.round(originalPrice*(1-coupon.discountPercent/100)):originalPrice;

function sendCustomOfferWhatsApp(buildingId){
  const rec=REG.buildings.find(b=>b.id===buildingId); if(!rec)return;
  const admin=(()=>{const d=loadBuildingData(buildingId);return d?(d.users||[]).find(u=>u.role==='admin'):null;})();
  const type=document.getElementById('coType').value;
  const planKey=document.getElementById('coPlan').value;

  const msg=document.getElementById('coMsgText').value;
  let logDetail;
  if(type==='coupon'){
    const couponId=document.getElementById('coCouponPick').value;
    const coupon=ensureCoupons().find(c=>c.id===couponId);
    if(!coupon)return showMessage('اختر كود خصم صالح');

  }else{

  logLicenseEvent(buildingId,'إرسال عرض خاص',logDetail);
  saveRegistry();
  const link=`https://wa.me/${(admin.phoneCountry||'').replace('+','')}${(admin.phone||'').replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`;

}

  const assigneeName=taskAssigneeOptions().find(s=>s.username===assigneeUsername)?.name||assigneeUsername;
  const description=document.getElementById('tsDesc').value.trim();

function submitSupportTicket(){
  const subject=document.getElementById('tkSubject').value.trim();
  const message=document.getElementById('tkMessage').value.trim();
  if(!subject)return showMessage('أدخل موضوع الطلب');
  if(!message)return showMessage('أدخل تفاصيل المشكلة');
  const priority=document.getElementById('tkPriority').value;
  const u=currentUser();
  const finish=(imageDataUrl)=>{
    ensureSupportTickets().push({id:uid(),buildingId:activeBuildingId,buildingName:D.building.name,submittedByUsername:u.username,submittedByName:u.name,subject,priority,status:'open',assignedToLabel:null,
      replies:[{authorType:'customer',authorName:u.name,message,imageDataUrl:imageDataUrl||null,createdAt:new Date().toISOString()}],
      createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
    saveRegistry();closeModal();toast('تم إرسال طلب الدعم');renderContent();
  };

const STAFF_IMPORT_COLUMNS=['الاسم','اسم الدخول','كلمة المرور','عرض العمارات','مراجعة الاشتراكات','إضافة عمارات','التسويق'];
function downloadStaffTemplate(){
  if(typeof XLSX==='undefined')return showMessage('تعذر تحميل مكتبة إكسيل - تأكد من اتصالك بالإنترنت وحاول تاني.');
  const sample=[STAFF_IMPORT_COLUMNS,['محمد أحمد','mohamed_support','Pass@1234','نعم','لا','لا','لا']];
  const ws=XLSX.utils.aoa_to_sheet(sample);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'فريق الدعم');

function openImportStaffModal(){
  openModal(`<h3>📥 استيراد فريق الدعم بالجملة</h3>
    <p class="small mtop">حمّل النموذج، واكتب "نعم" أو "لا" في أعمدة الصلاحيات. الأعمدة المطلوبة: <b>الاسم</b> و<b>اسم الدخول</b> و<b>كلمة المرور</b> فقط.</p>

function handleStaffFileUpload(input){
  const file=input.files[0]; if(!file)return;
  if(typeof XLSX==='undefined')return showMessage('تعذر تحميل مكتبة إكسيل - تأكد من اتصالك بالإنترنت وحاول تاني.');
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      const dataRows=rows.slice(1).filter(r=>r.some(c=>String(c).trim()!==''));
      window.__staffImportRows=dataRows;
      renderStaffImportPreview(dataRows);
    }catch(err){
      document.getElementById('staffImportPreview').innerHTML=`<p class="small" style="color:var(--red)">تعذرت قراءة الملف: ${esc(err.message)}</p>`;
    }
  };
  reader.readAsArrayBuffer(file);
}
function validateStaffImportRow(r){
  const name=String(r[0]||'').trim();
  const username=String(r[1]||'').trim();
  const pass=String(r[2]||'').trim();
  if(!name)return{ok:false,reason:'الاسم مفقود'};
  if(!username)return{ok:false,reason:'اسم الدخول مفقود'};
  if(username===REG.sysOwner.username||ensureSupportStaff().some(s=>s.username===username))return{ok:false,reason:'اسم الدخول محجوز بالفعل'};
  if(!pass||pass.length<8)return{ok:false,reason:'كلمة المرور لازم تكون 8 حروف على الأقل'};
  return{ok:true};
}
function renderStaffImportPreview(rows){
  const results=rows.map(r=>({row:r,check:validateStaffImportRow(r)}));
  const validCount=results.filter(x=>x.check.ok).length;
  const invalidCount=results.length-validCount;
  document.getElementById('staffImportPreview').innerHTML=`
    <div class="mtop2"><b>${rows.length}</b> صف - <span style="color:var(--accent)">${validCount} صالح</span>${invalidCount?` - <span style="color:var(--red)">${invalidCount} فيه خطأ</span>`:''}</div>
    <div class="table-wrap mtop" style="max-height:300px;overflow-y:auto"><table><thead><tr><th></th>${STAFF_IMPORT_COLUMNS.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${results.map(x=>`<tr>${x.check.ok?'<td>✅</td>':`<td title="${esc(x.check.reason)}">❌</td>`}${x.row.slice(0,7).map(c=>`<td class="small">${esc(String(c||''))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="flexrow mtop2"><button class="btn primary" ${validCount?'':'disabled'} onclick="confirmStaffImport()">✅ استيراد ${validCount} عضو صالح</button></div>`;
}
async function confirmStaffImport(){
  const rows=(window.__staffImportRows||[]).filter(r=>validateStaffImportRow(r).ok);
  if(!rows.length)return;
  const isYes=v=>String(v||'').trim()==='نعم';
  let imported=0;
  for(const r of rows){
    const name=String(r[0]).trim();
    const username=String(r[1]).trim();
    const password=String(r[2]).trim();
    if(ensureSupportStaff().some(s=>s.username===username))continue;
    const permissions={buildings:isYes(r[3]),subscriptions:isYes(r[4]),addBuildings:isYes(r[5]),marketing:isYes(r[6])};
    ensureSupportStaff().push({id:uid(),name,username,password:await hashPassword(password),active:true,permissions});
    imported++;
  }
  saveRegistry();closeModal();toast(`تم استيراد ${imported} عضو فريق`);renderSysContent();
}

async function saveStaffAccount(id){
  const name=document.getElementById('stName').value.trim();
  const username=document.getElementById('stUser').value.trim();
  const password=document.getElementById('stPass').value;
  if(!name||!username)return showMessage('أدخل الاسم واسم الدخول');
  if(username===REG.sysOwner.username||ensureSupportStaff().some(s=>s.username===username&&s.id!==id))return showMessage('اسم الدخول ده مستخدم بالفعل');
  if(id){
    const s=ensureSupportStaff().find(x=>x.id===id); if(!s)return;
    s.name=name; s.username=username;
    if(password){
      if(password.length<8)return showMessage('كلمة المرور لازم تكون 8 حروف على الأقل');
      s.password=await hashPassword(password);
    }
    logSysActivity('تعديل عضو فريق',name+' ('+username+')');
    saveRegistry();closeModal();toast('تم حفظ التعديل');renderSysContent();
  }else{
    if(!password||password.length<8)return showMessage('كلمة المرور لازم تكون 8 حروف على الأقل');
    const permissions={};
    SUPPORT_PERMISSION_GROUPS.forEach(g=>{const el=document.getElementById('stPerm_'+g.key);permissions[g.key]=el?el.checked:false;});
    ensureSupportStaff().push({id:uid(),name,username,password:await hashPassword(password),active:true,permissions});
    logSysActivity('إضافة عضو فريق',name+' ('+username+')');
    saveRegistry();closeModal();toast('تم إضافة الحساب');renderSysContent();
  }
}

function addMonths(dateStr,months){const d=new Date(dateStr+'T00:00:00');d.setMonth(d.getMonth()+months);return d.toISOString().slice(0,10)}
function buildLicense(planKey){
  ensurePlans();
  const def=findPlan(planKey)||trialPlan();
  const start=todayISO();
  return{plan:def.key,status:'active',startDate:start,endDate:def.durationMonths?addMonths(start,def.durationMonths):null,maxApartments:def.maxApartments,maxTransactions:def.maxTransactions,notes:''};
}
function ensureLicense(rec){if(!rec)return null;if(!rec.license)rec.license=buildLicense('custom');return rec.license}
function findBuildingRec(key){key=key||activeBuildingId;if(!key||!REG||!REG.buildings)return null;return REG.buildings.find(b=>b.id===key)||REG.buildings.find(b=>b.__uuid===key)||REG.buildings.find(b=>b.code===key)||null}
function licenseRec(){return findBuildingRec(activeBuildingId)}
function licenseInfo(){const rec=licenseRec();return rec?ensureLicense(rec):null}
function usedTransactionsCount(){return(D.ledger||[]).length+(D.expenses||[]).length}
function licenseStatusCheck(){
  const lic=licenseInfo(); if(!lic)return{ok:true};
  if(lic.status==='suspended')return{ok:false,reason:'تم إيقاف اشتراك هذه العمارة من قبل مسؤول البرنامج. تواصل معه لإعادة التفعيل.'};
  if(lic.endDate&&todayISO()>lic.endDate){
    if(lic.status!=='expired'){lic.status='expired';saveRegistry();}
    return{ok:false,reason:`انتهت صلاحية خطة "${planName(lic.plan)}". تواصل مع مسؤول البرنامج للتجديد أو الترقية.`};
  }
  return{ok:true};
}
function checkApartmentLimit(){
  const lic=licenseInfo(); if(!lic||!lic.maxApartments)return{ok:true};
  if(D.apartments.length>=lic.maxApartments)return{ok:false,reason:`الحد الأقصى لعدد الشقق في خطتك الحالية (${planName(lic.plan)}) هو ${lic.maxApartments} شقة. تواصل مع مسؤول البرنامج للترقية.`};
  return{ok:true};
}
function checkTransactionLimit(){
  const lic=licenseInfo(); if(!lic||!lic.maxTransactions)return{ok:true};
  if(usedTransactionsCount()>=lic.maxTransactions)return{ok:false,reason:`وصلت للحد الأقصى لعدد المعاملات (${lic.maxTransactions}) في خطة "${planName(lic.plan)}". تواصل مع مسؤول البرنامج للترقية.`};
  return{ok:true};
}
/**
 * نظام التراخيص (Licensing System) - ملاحظات للمطورين:
 * - enforceLicenseOrAlert(kind) هي نقطة الدخول الوحيدة اللي المفروض تتنادى قبل أي عملية ممكن تتخطى حد الترخيص.
 *   لازم تتنادى قبل: إضافة وحدة جديدة (kind='apartment') وأي حركة مالية جديدة (kind='transaction').
 *   لو أضفت مسار جديد لإنشاء وحدات (زي createBuildingBlock للكمبوند) لازم تتأكد إنها بتنادي الدالة دي الأول.
 * - computeRenewedLicense() هي الطريقة الصح لتجديد اشتراك - بتحافظ على الأيام المتبقية لو نفس الخطة لسه فعالة
 *   (عكس buildLicense() اللي بتبدأ مدة جديدة من الصفر وبتضيّع أي وقت متبقي، تُستخدم بس لأول اشتراك أو تغيير خطة).
 */
function enforceLicenseOrAlert(kind){
  const s=licenseStatusCheck(); if(!s.ok){showMessage(s.reason);openLicensePage();return false;}
  if(kind==='apartment'){const c=checkApartmentLimit(); if(!c.ok){showMessage(c.reason);openLicensePage();return false;}}
  if(kind==='transaction'){const c=checkTransactionLimit(); if(!c.ok){showMessage(c.reason);openLicensePage();return false;}}
  return true;
}

function handleTemplateVarTrigger(evt){
  const ta=evt.target;
  const pos=ta.selectionStart;
  const charBefore=ta.value.slice(pos-1,pos);
  if(charBefore==='{'){
    showVarAutocomplete(ta);
  }else{
    hideVarAutocomplete();
  }
}
function handleTemplateVarKeydown(evt){
  if(evt.key==='Escape')hideVarAutocomplete();
}
function showVarAutocomplete(ta){
  const box=document.getElementById('varAutocomplete'); if(!box)return;
  const cat=window.__templateModalCategory;
  const vars=cat?varsForCategory(cat):ALL_TEMPLATE_VARS;
  box.innerHTML=vars.map(v=>`<div class="var-item" onclick="insertTemplateVar('${v.key}')"><b>{${esc(v.key)}}</b><span class="small" style="color:var(--muted)"> - ${esc(v.desc)}</span></div>`).join('')||'<div class="var-item small" style="color:var(--muted)">لا توجد متغيرات لنوع الرسالة ده</div>';
  box.style.display='block';
}
function hideVarAutocomplete(){
  const box=document.getElementById('varAutocomplete'); if(box)box.style.display='none';
}
function insertTemplateVar(key){
  const ta=document.getElementById('mtBody'); if(!ta)return;
  const pos=ta.selectionStart;
  const before=ta.value.slice(0,pos); // بينتهي بـ { اللي المستخدم كتبها بالفعل
  const after=ta.value.slice(pos);
  ta.value=before+key+'}'+after;
  const newPos=before.length+key.length+1;
  ta.focus();
  ta.setSelectionRange(newPos,newPos);
  hideVarAutocomplete();
}
function saveMessageTemplate(id,category){
  const title=document.getElementById('mtTitle').value.trim();
  const body=document.getElementById('mtBody').value.trim();
  if(!title||!body)return showMessage('أدخل اسم ونص الرسالة');
  if(id){
    const t=ensureMessageTemplates().find(x=>x.id===id);
    if(t)Object.assign(t,{title,body});
  }else{
    ensureMessageTemplates().push({id:uid(),category,title,body});
  }
  saveRegistry();closeModal();toast('تم الحفظ');renderSysContent();
}

    REG.messageTemplates=ensureMessageTemplates().filter(t=>t.id!==id);
    saveRegistry();toast('تم الحذف');renderSysContent();
  });
}
function ensureMarketingLeads(){REG.marketingLeads=REG.marketingLeads||[];return REG.marketingLeads;}
function leadStatusInfo(lead){
  if(lead.linkedBuildingId){
    const b=REG.buildings.find(x=>x.id===lead.linkedBuildingId);
    if(b){
      const lic=ensureLicense(b);
      const planDef=findPlan(lic.plan);
      const isPaidPlan=planDef&&!planDef.isTrial&&planDef.priceBefore>0;
      const renewals=(b.licenseHistory||[]).filter(h=>h.action==='تجديد عبر طلب العميل'||h.action==='تفعيل خطة').length;
      if(isPaidPlan&&renewals>1)return{key:'renewed',label:'جدد الاشتراك',color:'var(--accent)'};
      if(isPaidPlan)return{key:'purchased',label:'اشترى (خطة مدفوعة)',color:'var(--accent)'};
      return{key:'signed_up',label:'سجّل - لسه تجريبي',color:'var(--gold)'};
    }
  }
  if(lead.messages&&lead.messages.length)return{key:'contacted',label:'اتبعتله رسالة',color:'var(--muted)'};
  return{key:'new',label:'جديد - لسه محدش تواصل معاه',color:'var(--muted)'};
}
function linkLeadsToBuilding(phone,buildingId){
  const clean=(phone||'').replace(/\D/g,''); if(!clean)return;
  ensureMarketingLeads().forEach(l=>{
    if(!l.linkedBuildingId&&l.phone&&l.phone.replace(/\D/g,'')===clean){
      l.linkedBuildingId=buildingId;
    }
  });
}

    {key:'x',label:'',value:null,cell:l=>`<div class="flexrow">
      <button class="btn sm gold" onclick="openSendLeadMessageModal('${l.id}')">💬 إرسال</button>

      <button class="btn sm red" onclick="deleteLeadPrompt('${l.id}')">حذف</button>
    </div>`},
  ],null,{defaultKey:'added',emptyText:'لسه معملتش تضيف أي رقم تسويقي',exportName:'أرقام التسويق'})}`;

    <div class="field2 mtop"><label>الاسم (اختياري)</label><input id="leadName" value="${lead?esc(lead.name||''):''}"></div>
    <div class="grid g2">
      <div class="field2"><label>مفتاح الدولة</label><select id="leadPhoneCountry">${countryOptions(lead?lead.phoneCountry:null)}</select></div>
      <div class="field2"><label>رقم الهاتف/واتساب</label><input id="leadPhone" placeholder="01xxxxxxxxx" value="${lead?esc(lead.phone):''}"></div>
    </div>
    <div class="field2"><label>المصدر (اختياري)</label><input id="leadSource" placeholder="مثال: فيسبوك، معرض، توصية" value="${lead?esc(lead.source||''):''}"></div>
    <div class="modal-actions"><button class="btn primary" onclick="saveNewLead(${id?`'${id}'`:'null'})">✅ ${lead?'حفظ التعديل':'إضافة'}</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`);

function saveNewLead(id){
  const phone=document.getElementById('leadPhone').value.trim().replace(/\D/g,'');
  const phoneCountry=document.getElementById('leadPhoneCountry').value;
  if(!phone||phone.length<8)return showMessage('أدخل رقم هاتف صحيح');
  if(ensureMarketingLeads().some(l=>l.phone.replace(/\D/g,'')===phone&&l.id!==id))return showMessage('الرقم ده مسجّل بالفعل');
  const name=document.getElementById('leadName').value.trim();
  const source=document.getElementById('leadSource').value.trim();
  if(id){
    const lead=ensureMarketingLeads().find(l=>l.id===id);
    if(lead)Object.assign(lead,{name,phone,phoneCountry,source});
    saveRegistry();closeModal();toast('تم حفظ التعديل');renderSysContent();
  }else{
    ensureMarketingLeads().push({id:uid(),name,phone,phoneCountry,source,addedDate:todayISO(),messages:[],linkedBuildingId:null});
    saveRegistry();closeModal();toast('تم إضافة الرقم');renderSysContent();
  }
}
function deleteLeadPrompt(id){

function fillTemplateVars(text,vars){
  let out=text;
  Object.keys(vars).forEach(k=>{out=out.split('{'+k+'}').join(vars[k]);});
  return out;
}

function openLeadWhatsApp(id){
  const lead=ensureMarketingLeads().find(l=>l.id===id); if(!lead)return;
  const waNumber=`${(lead.phoneCountry||'+20').replace('+','')}${(lead.phone||'').replace(/\D/g,'')}`;

  window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(text)}`,'_blank');

function logLeadMessage(id,channel){
  const lead=ensureMarketingLeads().find(l=>l.id===id); if(!lead)return;
  const note=document.getElementById('leadMsgText')?document.getElementById('leadMsgText').value.trim():'';
  lead.messages=lead.messages||[];
  lead.messages.push({date:todayISO(),channel,note});
  saveRegistry();
}

  logLeadMessage(id,'sms');

  el.select();
  try{document.execCommand('copy');toast('تم نسخ النص - افتح تطبيق الرسائل في موبايلك والصقه');}catch(e){toast('انسخ النص يدويًا من الصندوق');}

/* ---------- استيراد جماعي لأرقام التسويق ---------- */
const LEADS_IMPORT_COLUMNS=['رقم الهاتف','مفتاح الدولة (اختياري - افتراضي مصر +20)','الاسم','المصدر'];
function downloadLeadsTemplate(){
  if(typeof XLSX==='undefined')return showMessage('تعذر تحميل مكتبة إكسيل - تأكد من اتصالك بالإنترنت وحاول تاني.');
  const sample=[LEADS_IMPORT_COLUMNS,['01012345678','+20','أحمد محمد','معرض العقارات']];
  const ws=XLSX.utils.aoa_to_sheet(sample);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'أرقام التسويق');
  XLSX.writeFile(wb,'نموذج استيراد أرقام التسويق.xlsx');
}
function openImportLeadsModal(){
  openModal(`<h3>📥 استيراد أرقام بالجملة</h3>
    <p class="small mtop">الأعمدة المطلوبة: <b>رقم الهاتف</b> فقط، والباقي اختياري.</p>
    <button class="btn sm gold mtop" onclick="downloadLeadsTemplate()">⬇️ تحميل نموذج فارغ</button>
    <div class="field2 mtop"><label>اختر ملف إكسيل (.xlsx)</label><input type="file" id="leadsImportFile" accept=".xlsx,.xls,.csv" onchange="handleLeadsFileUpload(this)"></div>
    <div id="leadsImportPreview"></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`);
}
function handleLeadsFileUpload(input){
  const file=input.files[0]; if(!file)return;
  if(typeof XLSX==='undefined')return showMessage('تعذر تحميل مكتبة إكسيل - تأكد من اتصالك بالإنترنت وحاول تاني.');
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      const dataRows=rows.slice(1).filter(r=>r.some(c=>String(c).trim()!==''));
      window.__leadsImportRows=dataRows;
      renderLeadsImportPreview(dataRows);
    }catch(err){
      document.getElementById('leadsImportPreview').innerHTML=`<p class="small" style="color:var(--red)">تعذرت قراءة الملف: ${esc(err.message)}</p>`;
    }
  };
  reader.readAsArrayBuffer(file);
}
function validateLeadImportRow(r){
  const phone=String(r[0]||'').trim().replace(/\D/g,'');
  if(!phone||phone.length<8)return{ok:false,reason:'رقم الهاتف مفقود أو غير صحيح'};
  if(ensureMarketingLeads().some(l=>l.phone===phone))return{ok:false,reason:'الرقم ده مسجّل بالفعل'};
  return{ok:true};
}
function renderLeadsImportPreview(rows){
  const results=rows.map(r=>({row:r,check:validateLeadImportRow(r)}));
  const validCount=results.filter(x=>x.check.ok).length;
  const invalidCount=results.length-validCount;
  document.getElementById('leadsImportPreview').innerHTML=`
    <div class="mtop2"><b>${rows.length}</b> صف - <span style="color:var(--accent)">${validCount} صالح</span>${invalidCount?` - <span style="color:var(--red)">${invalidCount} فيه خطأ</span>`:''}</div>
    <div class="table-wrap mtop" style="max-height:300px;overflow-y:auto"><table><thead><tr><th></th>${LEADS_IMPORT_COLUMNS.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${results.map(x=>`<tr>${x.check.ok?'<td>✅</td>':`<td title="${esc(x.check.reason)}">❌</td>`}${x.row.slice(0,4).map(c=>`<td class="small">${esc(String(c||''))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="flexrow mtop2"><button class="btn primary" ${validCount?'':'disabled'} onclick="confirmLeadsImport()">✅ استيراد ${validCount} رقم صالح</button></div>`;
}
function confirmLeadsImport(){
  const rows=(window.__leadsImportRows||[]).filter(r=>validateLeadImportRow(r).ok);
  if(!rows.length)return;
  let imported=0;
  rows.forEach(r=>{
    const phone=String(r[0]).trim().replace(/\D/g,'');
    if(ensureMarketingLeads().some(l=>l.phone===phone))return;
    const phoneCountry=String(r[1]||'').trim()||'+20';
    ensureMarketingLeads().push({id:uid(),name:String(r[2]||'').trim(),phone,phoneCountry,source:String(r[3]||'').trim(),addedDate:todayISO(),messages:[],linkedBuildingId:null});
    imported++;
  });
  saveRegistry();closeModal();toast(`تم استيراد ${imported} رقم بنجاح`);renderSysContent();
}
/* ---------- أكواد الخصم (منفصلة عن الإحالة) ---------- */
function ensureCoupons(){REG.discountCoupons=REG.discountCoupons||[];return REG.discountCoupons;}
function findValidCoupon(code){
  const c=ensureCoupons().find(x=>x.code===code.trim().toUpperCase()&&x.active!==false);
  if(!c)return null;
  if(c.expiryDate&&c.expiryDate<todayISO())return null;
  if(c.maxUses&&c.usedCount>=c.maxUses)return null;
  return c;
}
function pageSysCoupons(){
  const coupons=[...ensureCoupons()].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  return`
  <p class="small">أكواد خصم مستقلة عن نظام الإحالة - تقدر تستخدمها في حملات إعلانية أو عروض موسمية. العميل بيكتب الكود وقت التسجيل، وبيتسجل على حسابه عشان تطبّقه لما يرقّي.</p>
  <div class="flexrow mtop"><button class="btn primary" onclick="openCouponModal(null)">+ كود خصم جديد</button></div>
  <div class="grid g2 mtop2">${coupons.length?coupons.map(c=>`
    <div class="card">
      <div class="flexrow"><b style="flex:1;letter-spacing:2px">${esc(c.code)}</b>${c.active===false?'<span class="badge n">معطّل</span>':(c.expiryDate&&c.expiryDate<todayISO())?'<span class="badge r">منتهي</span>':'<span class="badge g">فعّال</span>'}</div>
      <p class="small mtop">خصم ${c.discountPercent}%${c.expiryDate?' - ينتهي '+esc(c.expiryDate):''}</p>
      <p class="small">${c.restrictToPlan?'مقصور على باقة "'+esc((findPlan(c.restrictToPlan)||{}).name||c.restrictToPlan)+'"':'شغال على كل الباقات'}</p>
      <p class="small">الاستخدام: ${c.usedCount||0}${c.maxUses?' من '+c.maxUses:' (بدون حد أقصى)'}</p>
      <div class="flexrow mtop"><button class="btn sm ghost" onclick="openCouponModal('${c.id}')">تعديل</button><button class="btn sm ghost" onclick="toggleCouponActive('${c.id}')">${c.active===false?'تفعيل':'تعطيل'}</button><button class="btn sm red" onclick="deleteCouponPrompt('${c.id}')">حذف</button></div>
    </div>`).join(''):'<p class="small">لسه معملتش أي كود خصم.</p>'}</div>`;
}
function openCouponModal(id){
  const c=id?ensureCoupons().find(x=>x.id===id):null;
  const plans=activePlans();
  openModal(`<h3>${c?'تعديل كود خصم':'كود خصم جديد'}</h3>
    <div class="field2 mtop"><label>الكود</label><input id="cpCode" value="${c?esc(c.code):''}" placeholder="مثال: RAMADAN25" style="text-transform:uppercase"></div>
    <div class="grid g2">
      <div class="field2"><label>نسبة الخصم %</label><input id="cpDiscount" type="number" min="1" max="100" value="${c?c.discountPercent:'10'}"></div>
      <div class="field2"><label>تاريخ الانتهاء (اختياري)</label><input id="cpExpiry" type="date" value="${c?c.expiryDate||'':''}"></div>
    </div>
    <div class="field2"><label>الحد الأقصى للاستخدام (اختياري)</label><input id="cpMaxUses" type="number" min="1" value="${c?c.maxUses||'':''}"></div>
    <div class="field2"><label>الخطة المشمولة</label><select id="cpPlanRestrict"><option value="">كل الباقات</option>${plans.map(p=>`<option value="${p.key}" ${c&&c.restrictToPlan===p.key?'selected':''}>باقة "${esc(p.name)}" فقط</option>`).join('')}</select></div>
    <div class="modal-actions"><button class="btn primary" onclick="saveCoupon(${id?`'${id}'`:'null'})">💾 حفظ</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`);
}
function saveCoupon(id){
  const code=document.getElementById('cpCode').value.trim().toUpperCase();
  const discountPercent=Number(document.getElementById('cpDiscount').value);
  if(!code)return showMessage('أدخل الكود');
  if(!discountPercent||discountPercent<1||discountPercent>100)return showMessage('نسبة الخصم لازم تكون بين 1 و100');
  if(ensureCoupons().some(c=>c.code===code&&c.id!==id))return showMessage('الكود ده مستخدم بالفعل');
  const expiryDate=document.getElementById('cpExpiry').value||null;
  const maxUses=Number(document.getElementById('cpMaxUses').value)||null;
  const restrictToPlan=document.getElementById('cpPlanRestrict').value||null;
  if(id){const c=ensureCoupons().find(x=>x.id===id); if(c)Object.assign(c,{code,discountPercent,expiryDate,maxUses,restrictToPlan});}
  else ensureCoupons().push({id:uid(),code,discountPercent,expiryDate,maxUses,restrictToPlan,usedCount:0,active:true,createdAt:new Date().toISOString()});
  logSysActivity(id?'تعديل كود خصم':'إضافة كود خصم',code+' - خصم '+discountPercent+'%');
  saveRegistry();closeModal();toast('تم الحفظ');renderSysContent();
}
function toggleCouponActive(id){
  const c=ensureCoupons().find(x=>x.id===id); if(!c)return;
  c.active=c.active===false?true:false;
  saveRegistry();renderSysContent();
}
function deleteCouponPrompt(id){
  confirmAction('هل تريد حذف كود الخصم ده؟',()=>{
    const c=ensureCoupons().find(x=>x.id===id);
    REG.discountCoupons=ensureCoupons().filter(c=>c.id!==id);
    logSysActivity('حذف كود خصم',c?c.code:'');
    saveRegistry();toast('تم الحذف');renderSysContent();
  });
}
function ensureReferralRewards(){REG.referralRewards=REG.referralRewards||[];return REG.referralRewards;}
function checkAndApplyReferralReward(rec,oldPlan,newPlanKey){
  if(oldPlan!=='trial'||newPlanKey==='trial')return; // المكافأة بس عند أول ترقية فعلية من التجربة
  if(!rec.referredBy||rec.referralRewardGiven)return;
  const referrer=REG.buildings.find(b=>b.id===rec.referredBy); if(!referrer)return;
  const refLic=ensureLicense(referrer);
  const base=(refLic.endDate&&refLic.endDate>todayISO())?refLic.endDate:todayISO();
  refLic.endDate=addDaysToDate(base,REFERRAL_REWARD_DAYS);
  refLic.status='active';
  rec.referralRewardGiven=true;
  logLicenseEvent(referrer.id,'مكافأة إحالة',`تمديد ${REFERRAL_REWARD_DAYS} يوم لترقية "${rec.name}" اللي جالك عن طريق إحالتك`);
  ensureReferralRewards().push({id:uid(),referrerBuildingId:referrer.id,referredBuildingId:rec.id,rewardDays:REFERRAL_REWARD_DAYS,date:new Date().toISOString()});
  pushSysNotification('مكافأة إحالة اتضافت',`"${referrer.name}" أخد ${REFERRAL_REWARD_DAYS} يوم مكافأة بسبب ترقية "${rec.name}"`,'sysreferrals');
}
function approveRenewal(id){
  const r=(REG.renewalRequests||[]).find(x=>x.id===id); if(!r)return;
  const rec=REG.buildings.find(b=>b.id===r.buildingId); if(!rec)return showMessage('العمارة لم تعد موجودة');
  const oldPlan=rec.license?rec.license.plan:null;
  rec.license=computeRenewedLicense(rec,r.planKey);
  const period=`من ${rec.license.startDate||todayISO()} إلى ${rec.license.endDate||'بلا انتهاء'}`;
  const detail=oldPlan===r.planKey?`تجديد نفس الخطة عبر طلب العميل - ${period}`:`${oldPlan?planName(oldPlan)+' → ':''}${planName(r.planKey)} - ${period}`;
  logLicenseEvent(r.buildingId,'تجديد عبر طلب العميل',detail);
  checkAndApplyReferralReward(rec,oldPlan,r.planKey);
  r.status='approved'; r.reviewedAt=new Date().toISOString(); r.reviewedBy=currentActorLabel();
  saveRegistry();
  pushNotificationToBuilding(r.buildingId,{title:'تم تفعيل طلب التجديد',message:'تم تفعيل خطة '+planName(r.planKey)+' - سارية حتى '+(rec.license.endDate||'بلا انتهاء'),link:'license'});
  toast('تم تفعيل الاشتراك للعميل'); renderSysContent();
}
function rejectRenewal(id){
  const r=(REG.renewalRequests||[]).find(x=>x.id===id); if(!r)return;
  promptModal('سبب الرفض','هيظهر للعميل - اختياري','',(note)=>{
    r.status='rejected'; r.reviewNote=note||''; r.reviewedAt=new Date().toISOString(); r.reviewedBy=currentActorLabel();
    saveRegistry();
    pushNotificationToBuilding(r.buildingId,{title:'تم رفض طلب التجديد',message:note||'راجع صفحة الرخصة والاشتراك للتفاصيل',link:'license'});
    toast('تم رفض الطلب'); renderSysContent();
  },'رفض الطلب');
}

function renderOfferFeaturesDraft(){
  const list=window.__offerFeaturesDraft||[];
  return list.length?list.map((f,i)=>`<div class="flexrow" style="padding:4px 0"><span class="small" style="flex:1">${esc(f)}</span><button class="btn sm red" onclick="removeOfferFeatureDraft(${i})">🗑️</button></div>`).join(''):'<p class="small">مفيش مميزات مضافة لسه.</p>';
}
function addOfferFeatureDraft(){
  const val=document.getElementById('ofFeatureInput').value.trim(); if(!val)return;
  window.__offerFeaturesDraft.push(val);
  document.getElementById('ofFeatureInput').value='';
  document.getElementById('ofFeaturesList').innerHTML=renderOfferFeaturesDraft();
}
function removeOfferFeatureDraft(i){
  window.__offerFeaturesDraft.splice(i,1);
  document.getElementById('ofFeaturesList').innerHTML=renderOfferFeaturesDraft();
}
function saveOffer(id){
  const title=document.getElementById('ofTitle').value.trim();
  const subtitle=document.getElementById('ofSubtitle').value.trim();
  const ctaText=document.getElementById('ofCta').value.trim()||'جرب الآن مجانًا';
  const trialDays=Number(document.getElementById('ofDays').value)||30;
  const footnote=document.getElementById('ofFootnote').value.trim();
  const targetAudience=document.getElementById('ofAudience').value;
  const planKey=document.getElementById('ofPlan').value;
  const features=window.__offerFeaturesDraft||[];
  if(!title||!subtitle)return showMessage('أدخل العنوان والعنوان الفرعي');
  if(id){
    const o=ensureLandingOffers().find(x=>x.id===id);
    if(o)Object.assign(o,{title,subtitle,ctaText,trialDays,footnote,features,targetAudience,planKey});
  }else{
    ensureLandingOffers().push({id:uid(),title,subtitle,ctaText,trialDays,footnote,features,targetAudience,planKey,active:false,createdAt:new Date().toISOString()});
  }
  saveRegistry();closeModal();toast('تم الحفظ');renderSysContent();
}
function toggleOfferActive(id){
  const offers=ensureLandingOffers();
  const target=offers.find(x=>x.id===id); if(!target)return;
  const activating=!target.active;
  if(activating){
    offers.forEach(o=>{
      if(o.id===id)return;
      const sameAudience=o.targetAudience===target.targetAudience||o.targetAudience==='both'||target.targetAudience==='both';
      if(sameAudience)o.active=false;
    });
  }
  target.active=activating;
  saveRegistry();renderSysContent();
}
function deleteOfferPrompt(id){
  confirmAction('هل تريد حذف هذا العرض؟',()=>{
    REG.landingOffers=ensureLandingOffers().filter(o=>o.id!==id);
    saveRegistry();toast('تم الحذف');renderSysContent();
  });
}
function previewOffer(id){
  const o=ensureLandingOffers().find(x=>x.id===id); if(!o)return;

}
function offerPopupHTML(o,isPreview){
  return`<div class="offer-overlay" id="offerOverlay"><div class="offer-popup">

function closeOfferPopup(isPreview){
  const el=document.getElementById('offerOverlay'); if(el)el.remove();
  if(!isPreview)sessionStorage.setItem('omaretna_offer_seen','1');

function maybeShowOfferPopup(){
  try{
    if(sessionStorage.getItem('omaretna_offer_seen'))return;
    const o=activeLandingOffer(); if(!o)return;
    document.body.insertAdjacentHTML('beforeend',offerPopupHTML(o,false));
    sessionStorage.setItem('omaretna_offer_seen','1');
  }catch(e){}
}

function existingOfferBannerHTML(){
  const rec=findBuildingRec(activeBuildingId); if(!rec)return'';
  if(rec.claimedOfferId)return'';

  return`<div class="card content-narrow mtop2" style="background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff">

function claimExistingOffer(offerId){
  const o=ensureLandingOffers().find(x=>x.id===offerId); if(!o)return;
  const rec=findBuildingRec(activeBuildingId); if(!rec)return;
  if(rec.claimedOfferId)return toast('العرض ده اتفعّل بالفعل على حسابك من قبل');
  confirmAction('هل تريد تفعيل هذا العرض؟ سيتم تحديث اشتراكك مجانًا للمدة المحددة.',()=>{
    const lic=ensureLicense(rec);
    lic.plan=o.planKey;
    lic.status='active';
    lic.startDate=todayISO();
    lic.endDate=addDaysToDate(todayISO(),o.trialDays);
    const plan=findPlan(o.planKey);
    lic.maxApartments=plan?plan.maxApartments:null;
    lic.maxTransactions=plan?plan.maxTransactions:null;
    rec.claimedOfferId=offerId;
    logLicenseEvent(activeBuildingId,'تفعيل عرض ترويجي',o.title+' - '+planLabel(o.planKey)+' لمدة '+o.trialDays+' يوم مجانًا');
    saveRegistry();toast('🎉 تم تفعيل العرض بنجاح!');renderContent();
  },'✅ تفعيل العرض');
}

function renderMarketingQr(){
  const so=REG.sysOwner;
  const host=document.getElementById('marketingQrHost');
  if(!host||!so.siteUrl||typeof QRCode==='undefined')return;
  host.innerHTML='';
  new QRCode(host,{text:so.siteUrl.trim(),width:150,height:150,colorDark:'#000000',colorLight:'#ffffff'});
}
function getQrDataUrl(){
  const host=document.getElementById('marketingQrHost');
  if(!host)return null;
  const canvas=host.querySelector('canvas');
  if(canvas){
    try{const url=canvas.toDataURL('image/png'); if(url&&url.length>100)return url;}catch(e){}
  }
  const img=host.querySelector('img');
  if(img&&img.src&&img.src.indexOf('data:')===0)return img.src;
  return null;
}

function uploadHeroImage(input){
  const file=input.files[0]; if(!file)return;
  if(file.size>5*1024*1024)return showMessage('حجم الصورة كبير جدًا - الحد الأقصى 5 ميجا');
  const reader=new FileReader();
  reader.onload=e=>{
    ensureLandingSettings().heroImage=e.target.result;
    saveRegistry(); toast('تم رفع الصورة'); renderSysContent();
  };
  reader.readAsDataURL(file);
}

  return true;
}

function computeRenewedLicense(rec,planKey){
  const def=findPlan(planKey);
  const cur=rec.license;
  const samePlan=cur&&cur.plan===planKey;
  const stillValid=cur&&cur.endDate&&cur.endDate>todayISO()&&cur.status==='active';
  if(samePlan&&stillValid&&def&&def.durationMonths){
    const newLic={...cur};
    newLic.endDate=addMonths(cur.endDate,def.durationMonths);
    newLic.status='active';
    newLic.maxApartments=def.maxApartments; newLic.maxTransactions=def.maxTransactions;
    return newLic;
  }
  return buildLicense(planKey);
}
function activatePlan(buildingId,planKey){
  const rec=REG.buildings.find(b=>b.id===buildingId);
  const oldPlan=rec.license?rec.license.plan:null;
  rec.license=computeRenewedLicense(rec,planKey);
  const period=`من ${rec.license.startDate||todayISO()} إلى ${rec.license.endDate||'بلا انتهاء'}`;
  const detail=oldPlan===planKey?`تجديد نفس الخطة - ${period}`:`${oldPlan?planName(oldPlan)+' → ':''}${planName(planKey)} - ${period}`;

function wireImageUpload(inputId,previewId,storageKey){
  document.getElementById(inputId).addEventListener('change',e=>{
    const file=e.target.files[0]; if(!file)return;
    if(file.size>8*1024*1024){showMessage('حجم الصورة كبير جدًا (أكبر من 8 ميجا)، اختر صورة أصغر أو قلل جودة الكاميرا.');e.target.value='';return;}
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const maxW=1920;
        const scale=Math.min(1,maxW/img.width);
        const canvas=document.createElement('canvas');
        canvas.width=img.width*scale; canvas.height=img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        const compressed=canvas.toDataURL('image/jpeg',0.85);
        window[storageKey]=compressed;
        document.getElementById(previewId).innerHTML=`<img src="${compressed}" style="max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--line)">`;
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/**
 * نظام الصلاحيات (Permissions System) - ملاحظات للمطورين:
 * - كل مستخدم admin له خاصية u.permissions: إما null/undefined (= صلاحيات كاملة، وهو الأدمن الأساسي لكل عمارة)
 *   أو object زي {building:true, finance:false, engage:true, settings:true} يحدد الوصول لكل مجموعة صفحات (ADMIN_NAV_GROUPS).
 * - الأدمن المقيّد (permissions !== null) مينفعش: يعمل أدمن جديد، يعدّل صلاحيات أدمن تاني، أو يرقّي مالك لأدمن.
 *   ده اتطبق مرتين: مرة في الواجهة (openUserModal) ومرة في منطق الحفظ (saveUser) - دفاع مزدوج ضد أي تلاعب بالواجهة.
 * - أي صفحة جديدة تتضاف لازم تتحط في ADMIN_NAV_GROUPS جوه المجموعة المناسبة، وإلا pageGroupKey() هترجع null
 *   وrenderContent() router هيرفض الوصول للصفحة حتى للأدمن الأساسي.
 */
function hasGroupPermission(u,groupKey){
  if(groupKey==='home')return true;
  if(!u.permissions)return true; // مفيش قيود = صلاحيات كاملة (الأدمن الأساسي)
  return u.permissions[groupKey]!==false;
}
function visibleNavGroups(u){
  if(u.role!=='admin'){
    return OWNER_NAV_GROUPS.filter(g=>hasGroupPermission(u,g.key));
  }
  const isCompound=D&&D.building&&D.building.communityType==='compound';
  return ADMIN_NAV_GROUPS.filter(g=>hasGroupPermission(u,g.key)).map(g=>({...g,items:g.items.filter(it=>it[0]!=='blocks'||isCompound)}));
}
function pageGroupKey(page,isOwnerCtx){
  const groups=isOwnerCtx?OWNER_NAV_GROUPS:ADMIN_NAV_GROUPS;
  for(const g of groups){if(g.items.some(it=>it[0]===page))return g.key;}
  return null;
}
function toggleNavGroup(key){
  window.__navExpandedGroup=window.__navExpandedGroup===key?null:key;

}

function openSysSmartSearch(){
  openModal(`
    <h3>🔍 بحث ذكي - كل العمارات</h3>
    <input id="sysSearchInput" class="search-box" style="width:100%" placeholder="ابحث باسم العمارة، الكود، اسم المستخدم، الهاتف، الإيميل..." autofocus>
    <div id="sysSearchResults" class="mtop"></div>`,true);
  document.getElementById('sysSearchInput').addEventListener('input',e=>runSysSmartSearch(e.target.value));
}
function runSysSmartSearch(q){
  const box=document.getElementById('sysSearchResults');
  q=(q||'').trim().toLowerCase();
  if(q.length<2){box.innerHTML='<p class="small">اكتب حرفين على الأقل...</p>';return}
  const pageMatches=[];
  SYS_NAV_GROUPS.forEach(g=>{
    g.items.forEach(([page,icon,label])=>{
      if(label.toLowerCase().includes(q)||g.label.toLowerCase().includes(q))
        pageMatches.push({page,icon,label,groupLabel:g.label});
    });
  });
  const bMatches=REG.buildings.filter(b=>[b.name,b.code].some(v=>String(v||'').toLowerCase().includes(q)));
  const userMatches=[];
  const apMatches=[];
  REG.buildings.forEach(b=>{
    const d=loadBuildingData(b.id); if(!d)return;
    (d.users||[]).forEach(u=>{
      if([u.username,u.name,u.phone,u.email].some(v=>String(v||'').toLowerCase().includes(q)))
        userMatches.push({buildingName:b.name,buildingId:b.id,username:u.username,name:u.name,role:u.role});
    });
    (d.apartments||[]).forEach(a=>{
      if([a.ownerName,a.tenantName,a.phone,a.number].some(v=>String(v||'').toLowerCase().includes(q)))
        apMatches.push({buildingName:b.name,buildingId:b.id,label:`${a.number?'وحدة '+a.number+' - ':''}${a.ownerName||''}`,sub:a.phone||a.tenantName||''});
    });
  });
  const groups=[];
  if(pageMatches.length)groups.push({title:'📄 شاشات وأدوات',items:pageMatches.map(p=>({label:p.icon+' '+p.label,sub:p.groupLabel,action:`closeModal();goSys('${p.page}')`}))});
  if(bMatches.length)groups.push({title:'🏙️ العمارات',items:bMatches.map(b=>({label:b.name,sub:'كود: '+b.code,action:`openLicenseManage('${b.id}')`}))});
  if(userMatches.length)groups.push({title:'👥 المستخدمون',items:userMatches.slice(0,30).map(u=>({label:`${u.name} (${u.username})`,sub:`عمارة: ${u.buildingName} - ${u.role==='admin'?'رئيس اتحاد':'صاحب شقة'}`,action:`closeModal();goSys('sysusers')`}))});
  if(apMatches.length)groups.push({title:'🚪 شقق وملاك (كل العمارات)',items:apMatches.slice(0,30).map(a=>({label:a.label,sub:`عمارة: ${a.buildingName} - ${a.sub}`,action:`closeModal();openLicenseManage('${a.buildingId}')`}))});
  if(!groups.length){box.innerHTML='<p class="small">لا توجد نتائج - جرب كلمة تانية أو تأكد من التهجئة</p>';return}
  box.innerHTML=groups.map(g=>`<div class="section-title" style="margin:12px 0 6px"><h3 style="font-size:13px">${g.title}</h3></div>
    ${g.items.map(it=>`<div class="comment-item" style="cursor:pointer" onclick="${it.action}">${esc(it.label)}<div class="comment-meta">${esc(it.sub)}</div></div>`).join('')}`).join('');
}

  analytics:{title:'التحليلات والاتجاهات',steps:['رسم بياني بيوضح التحصيل والمصروفات على مدار آخر 12 شهر.','الكروت فوق بتوريك إجمالي المحصّل، إجمالي المصروف، ومتوسط نسبة السداد.']},

  maintenance:{title:'بلاغات الصيانة',targets:(isAdmin)=>isAdmin?[null,null,null]:['[onclick="openMaintenanceModal()"]',null],steps:(isAdmin)=>isAdmin?['بلاغات الصيانة من السكان بتظهر هنا بحالة "مفتوح".','زرار "إسناد لمقاول" لربط البلاغ بمقاول من قائمة المقاولين، والحالة بتتحول "قيد المعالجة" تلقائيًا.','لما تخلّص البلاغ، زرار "تم الحل" مع ملاحظة الحل - والساكن بياخد تنبيه فورًا.']:['زرار "+ إبلاغ عن عطل" لتسجيل مشكلة صيانة في وحدتك أو المرافق العامة.','هتشوف حالة بلاغك (مفتوح/قيد المعالجة/تم الحل) وملاحظة رئيس الاتحاد لما يتحل.']},
  distweights:{title:'نسب توزيع المصروفات',steps:['حدد نسبة/معامل توزيع لكل نوع ووضع وحدة (شقة سكني مفتوحة، مكتب إداري، محل مغلق...إلخ).','النسب دي بتتستخدم لما تعمل "توزيع نسبي لمصروف مشترك" من شاشة التحصيل - الوحدة اللي معاملها أعلى تاخد نصيب أكبر.']},

function openPageHelp(){
  const s=getSession();
  const isSys=s&&s.type==='sysowner';
  const content=(isSys?SYS_HELP_CONTENT:HELP_CONTENT)[curPage];
  if(!content){openModal(`<h3>❓ مساعدة</h3><p class="small mtop">لا توجد إرشادات مفصّلة لهذه الشاشة حاليًا.</p><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">إغلاق</button></div>`);return;}
  const isAdminCtx=!isSys&&currentUser()&&currentUser().role==='admin';
  const steps=typeof content.steps==='function'?content.steps(isAdminCtx):content.steps;
  const targets=typeof content.targets==='function'?content.targets(isAdminCtx):(content.targets||[]);
  window.__tourState={title:content.title,steps,targets,index:0};
  renderTourStep();
}
function renderTourStep(){
  closeModal();
  clearTourHighlight();
  const t=window.__tourState; if(!t)return;
  const old=document.getElementById('tourCard'); if(old)old.remove();
  const total=t.steps.length;
  const target=t.targets[t.index];
  const card=document.createElement('div');
  card.id='tourCard';
  card.className='tour-card';
  card.innerHTML=`
    <div class="flexrow"><b style="flex:1">❓ ${esc(t.title)}</b><span class="small" style="color:var(--muted)">${t.index+1} / ${total}</span></div>
    <p class="small mtop" style="line-height:1.8">${esc(t.steps[t.index])}</p>
    <div class="flexrow mtop">
      <button class="btn sm ghost" onclick="tourClose()">✕ إغلاق</button>
      <div class="spacer"></div>
      <button class="btn sm ghost" onclick="tourPrev()" ${t.index===0?'disabled':''}>◀ السابق</button>
      <button class="btn sm primary" onclick="tourNext()">${t.index===total-1?'✅ تمام، فهمت':'التالي ▶'}</button>
    </div>`;
  document.body.appendChild(card);
  if(target){
    const el=document.querySelector(target);
    if(el){
      if(el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'center'});
      el.classList.add('help-pulse');
      window.__tourHighlighted=el;
      setTimeout(()=>positionTourCard(card,el),350);
      return;
    }
  }
  positionTourCard(card,null);
}
function positionTourCard(card,el){
  const cw=card.offsetWidth||300,ch=card.offsetHeight||140;
  if(el){
    const r=el.getBoundingClientRect();
    let top=r.bottom+window.scrollY+10;
    let left=r.left+window.scrollX+(r.width/2)-(cw/2);
    if(left<10)left=10;
    if(left+cw>window.innerWidth-10)left=window.innerWidth-cw-10;
    if(top+ch>window.innerHeight+window.scrollY-10)top=r.top+window.scrollY-ch-10;
    card.style.top=top+'px'; card.style.left=left+'px';
  }else{
    card.style.top=(window.scrollY+70)+'px';
    card.style.left=((window.innerWidth-cw)/2)+'px';
  }
}
function tourNext(){
  const t=window.__tourState; if(!t)return;
  if(t.index<t.steps.length-1){t.index++;renderTourStep();}
  else tourClose();
}
function tourPrev(){
  const t=window.__tourState; if(!t||t.index===0)return;
  t.index--;renderTourStep();
}
function clearTourHighlight(){
  if(window.__tourHighlighted){window.__tourHighlighted.classList.remove('help-pulse');window.__tourHighlighted=null;}
}
function tourClose(){
  clearTourHighlight();
  const card=document.getElementById('tourCard'); if(card)card.remove();
  window.__tourState=null;
}

function openSmartSearch(){
  openModal(`
    <h3>🔍 بحث ذكي</h3>
    <input id="smartSearchInput" class="search-box" style="width:100%" placeholder="ابحث في الشقق، الحركات، المصروفات، الاستطلاعات، الإعلانات، المقترحات، المستخدمين..." autofocus>
    <div id="smartSearchResults" class="mtop"></div>`,true);
  document.getElementById('smartSearchInput').addEventListener('input',e=>runSmartSearch(e.target.value));
}
function runSmartSearch(q){
  const box=document.getElementById('smartSearchResults');
  q=(q||'').trim().toLowerCase();
  if(q.length<2){box.innerHTML='<p class="small">اكتب حرفين على الأقل...</p>';return}
  const isAdmin=currentUser().role==='admin';
  const groups=[];
  const navGroups=isAdmin?ADMIN_NAV_GROUPS:OWNER_NAV_GROUPS;
  const pageMatches=[];
  if(navGroups)navGroups.forEach(g=>{
    g.items.forEach(([page,icon,label])=>{
      if(label.toLowerCase().includes(q)||g.label.toLowerCase().includes(q))
        pageMatches.push({page,icon,label,groupLabel:g.label});
    });
  });
  if(pageMatches.length)groups.push({title:'📄 شاشات وأدوات',items:pageMatches.map(p=>({label:p.icon+' '+p.label,sub:p.groupLabel,action:`closeModal();go('${p.page}')`}))});
  const apMatches=D.apartments.filter(a=>[a.number,a.ownerName,a.tenantName,a.phone,a.username].some(v=>String(v||'').toLowerCase().includes(q)));
  if(apMatches.length)groups.push({title:'🚪 الشقق والمحلات',items:apMatches.map(a=>({label:`${unitLabel(a)} - ${a.ownerName}`,sub:a.phone||'',action:`openApartmentDetail('${a.id}')`}))});
  if(isAdmin){
    const ledMatches=D.ledger.filter(l=>[l.note,l.project,l.type].some(v=>String(v||'').toLowerCase().includes(q)));
    if(ledMatches.length)groups.push({title:'🧾 الحركات المالية',items:ledMatches.slice(0,20).map(l=>({label:`${l.type} - ${money(l.amount)}`,sub:l.note||l.project||'',action:`openLedgerDetail('${l.id}')`}))});
    const expMatches=D.expenses.filter(e=>[e.category,e.description].some(v=>String(v||'').toLowerCase().includes(q)));
    if(expMatches.length)groups.push({title:'💳 المصروفات',items:expMatches.slice(0,20).map(e=>({label:`${e.category} - ${money(e.amount)}`,sub:e.description||'',action:`openExpenseDetail('${e.id}')`}))});
    const userMatches=D.users.filter(u=>[u.username,u.name,u.phone].some(v=>String(v||'').toLowerCase().includes(q)));
    if(userMatches.length)groups.push({title:'👥 المستخدمون',items:userMatches.map(u=>({label:u.name,sub:u.username,action:`go('users');closeModal()`}))});
    const actMatches=(D.activityLog||[]).filter(a=>[a.action,a.detail,a.name].some(v=>String(v||'').toLowerCase().includes(q)));
    if(actMatches.length)groups.push({title:'📜 سجل النشاط',items:actMatches.slice(0,20).map(a=>({label:a.action,sub:`${a.detail} - ${a.name}`,action:`go('activity');closeModal()`}))});
  }
  const pollMatches=D.polls.filter(p=>(p.title||'').toLowerCase().includes(q));
  if(pollMatches.length)groups.push({title:'🗳️ استطلاعات الرأي',items:pollMatches.map(p=>({label:p.title,sub:p.status==='open'?'مفتوح':'مغلق',action:`go('polls');closeModal()`}))});
  const annMatches=D.announcements.filter(a=>(a.title||'').toLowerCase().includes(q));
  if(annMatches.length)groups.push({title:'📢 الإعلانات',items:annMatches.map(a=>({label:a.title,sub:a.date,action:`go('announcements');closeModal()`}))});
  const sugMatches=(D.suggestions||[]).filter(s=>(s.title||'').toLowerCase().includes(q));
  if(sugMatches.length)groups.push({title:'💡 المقترحات',items:sugMatches.map(s=>({label:s.title,sub:s.status,action:`go('suggestions');closeModal()`}))});

  if(!groups.length){box.innerHTML='<p class="small">لا توجد نتائج - جرب كلمة تانية أو تأكد من التهجئة</p>';return}
  box.innerHTML=groups.map(g=>`<div class="section-title" style="margin:12px 0 6px"><h3 style="font-size:13px">${g.title}</h3></div>
    ${g.items.map(it=>`<div class="comment-item" style="cursor:pointer" onclick="${it.action}">${esc(it.label)}<div class="comment-meta">${esc(it.sub)}</div></div>`).join('')}`).join('');
}
function openLedgerDetail(id,readOnly){
  const l=D.ledger.find(x=>x.id===id); if(!l)return;
  const ap=D.apartments.find(a=>a.id===l.apartmentId);
  const acc=l.accountId?D.accounts.find(a=>a.id===l.accountId):null;
  openModal(`
    <h3>تفاصيل الحركة</h3>
    <div class="small" style="line-height:2.3">
      <div><b>النوع:</b> ${ledgerBadge(l.type)}</div>
      <div><b>الشقة:</b> ${ap?unitLabel(ap)+' - '+esc(ap.ownerName):'-'}</div>
      <div><b>المبلغ:</b> ${money(l.amount)}</div>
      <div><b>التاريخ:</b> ${esc(l.date||'')}</div>
      ${acc?`<div><b>الحساب:</b> ${esc(acc.name)}</div>`:''}
      ${l.month?`<div><b>الشهر:</b> ${monthLabel(l.month)}</div>`:''}
      ${l.project?`<div><b>المشروع:</b> ${esc(l.project)}</div>`:''}
      <div><b>البيان:</b> ${esc(l.note||'-')}</div>
      <div><b>تاريخ الإدخال:</b> ${esc(l.createdAt?new Date(l.createdAt).toLocaleString('ar-EG'):'-')}</div>
      ${l.reversalOf?'<div style="color:var(--gold-dark)"><b>ملاحظة:</b> هذه حركة عكسية لحركة أخرى</div>':''}
    </div>
    <div class="modal-actions">
      ${readOnly?'':`<button class="btn" onclick="openLedgerEdit('${l.id}')">✏️ تعديل</button>`}
      <button class="btn gold" onclick="printLedgerEntry('${l.id}')">🖨️ طباعة</button>
      ${readOnly?'':`<button class="btn ghost" onclick="reverseLedgerEntry('${l.id}')">↩️ عكس الحركة</button>
      <button class="btn red" onclick="deleteLedgerEntry('${l.id}')">🗑️ حذف</button>`}
      <button class="btn ghost" onclick="closeModal()">إغلاق</button>
    </div>`);
}
function openLedgerEdit(id){
  const l=D.ledger.find(x=>x.id===id); if(!l)return;
  openModal(`
    <h3>تعديل الحركة</h3>
    <div class="field2"><label>المبلغ</label><input id="leAmount" type="number" value="${l.amount}"></div>
    <div class="field2"><label>التاريخ</label><input id="leDate" type="date" value="${l.date||''}"></div>
    ${l.accountId?`<div class="field2"><label>الحساب</label><select id="leAccount">${D.accounts.map(a=>`<option value="${a.id}" ${a.id===l.accountId?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>`:''}
    <div class="field2"><label>البيان</label><input id="leNote" value="${esc(l.note||'')}"></div>
    <div class="modal-actions"><button class="btn primary" onclick="saveLedgerEdit('${l.id}')">💾 حفظ التعديل</button><button class="btn ghost" onclick="openLedgerDetail('${l.id}')">رجوع</button></div>`);
}
function saveLedgerEdit(id){
  const l=D.ledger.find(x=>x.id===id); if(!l)return;
  const amount=Number(document.getElementById('leAmount').value||0);
  if(!amount||amount<=0)return showMessage('أدخل مبلغًا صحيحًا');
  l.amount=amount; l.date=document.getElementById('leDate').value||l.date;
  const accSel=document.getElementById('leAccount'); if(accSel)l.accountId=accSel.value;
  l.note=document.getElementById('leNote').value.trim();
  logActivity('تعديل حركة مالية',`${l.type} - ${money(l.amount)}`);
  save();toast('تم حفظ التعديل');closeModal();renderContent();
}
function reverseLedgerEntry(id){
  const l=D.ledger.find(x=>x.id===id); if(!l)return;
  const reverseType={'شهري':'تسوية','مشروع':'تسوية','دفعة':'صرف','صرف':'دفعة','تسوية':'تسوية'}[l.type];
  if(!reverseType)return;
  openModal(`
    <h3>عكس الحركة</h3>
    <p class="small">هيتم إنشاء حركة جديدة تُلغي أثر هذه الحركة (${ledgerBadge(l.type)} بقيمة ${money(l.amount)})، بدون حذف الحركة الأصلية - للحفاظ على سجل مراجعة كامل.</p>
    <div class="field2 mtop"><label>تاريخ الحركة العكسية</label>
      <select id="rvDateMode" onchange="document.getElementById('rvCustomDateWrap').classList.toggle('hidden',this.value!=='custom')">
        <option value="same">نفس تاريخ الحركة الأصلية (${esc(l.date||'')})</option>
        <option value="today" selected>تاريخ اليوم (${todayISO()})</option>
        <option value="custom">تاريخ محدد</option>
      </select>
    </div>
    <div class="field2 hidden" id="rvCustomDateWrap"><label>التاريخ</label><input id="rvCustomDate" type="date" value="${todayISO()}"></div>
    <div class="modal-actions mtop"><button class="btn primary" onclick="doReverseLedger('${l.id}')">✅ تأكيد عكس الحركة</button><button class="btn ghost" onclick="openLedgerDetail('${l.id}')">إلغاء</button></div>`);
}
function doReverseLedger(id){
  const l=D.ledger.find(x=>x.id===id); if(!l)return;
  let amount=l.amount, type=l.type;
  if(type==='شهري'||type==='مشروع')type='تسوية',amount=-Math.abs(l.amount);
  else if(type==='دفعة')type='صرف';
  else if(type==='صرف')type='دفعة';
  else if(type==='تسوية')amount=-l.amount;
  const dateMode=document.getElementById('rvDateMode').value;
  const date=dateMode==='same'?(l.date||todayISO()):dateMode==='custom'?document.getElementById('rvCustomDate').value:todayISO();
  D.ledger.push({id:uid(),apartmentId:l.apartmentId,type,amount,accountId:l.accountId,month:l.month,note:'عكس حركة: '+(l.note||l.type),date,reversalOf:l.id,createdAt:new Date().toISOString()});
  logActivity('عكس حركة مالية',`${l.type} - ${money(l.amount)}`);
  save();toast('تم إنشاء حركة عكسية');closeModal();renderContent();
}
function printLedgerEntry(id){
  const l=D.ledger.find(x=>x.id===id); if(!l)return;
  const ap=D.apartments.find(a=>a.id===l.apartmentId);
  const acc=l.accountId?D.accounts.find(a=>a.id===l.accountId):null;
  printReceipt('إيصال حركة مالية - '+(D.building.name||''),[
    ['النوع',l.type],['الشقة',ap?unitLabel(ap)+' - '+ap.ownerName:'-'],['المبلغ',money(l.amount)],
    ['التاريخ',l.date||''],['الحساب',acc?acc.name:'-'],['البيان',l.note||'-']
  ]);
}
function printReceipt(title,rows){

function buildingIllustration(mode){
  const aps=[...D.apartments].sort((a,b)=>a.number-b.number);
  const month=curMonth();
  const isAdmin=mode==='admin';
  const isOwnerView=mode==='owner';
  const floorOrder=[],floorMap={};
  aps.forEach(a=>{
    const key=a.floor||'';
    if(!floorMap[key]){floorMap[key]=[];floorOrder.push(key);}
    floorMap[key].push(a);
  });
  const floors=floorOrder.map(k=>floorMap[k]).reverse();
  return `<div class="bld-wrap"><div class="bld-roof"></div>
    ${floors.map(fl=>{
      const label=fl[0]?fl[0].floor||'':'';
      return `<div class="bld-floor"><div class="bld-floor-label">${esc(label)}</div><div class="bld-units">
        ${fl.map(a=>{
          let cls='none';
          if(isAdmin){
            const p=apPaidForMonth(a.id,month);
            const bal=apBalance(a.id);
            cls=bal>0?'unpaid':(p===null?'none':'paid');
          }
          else if(isOwnerView)cls=a.type==='shop'?'shop':'neutral';
          let click='';
          if(isAdmin)click=`onclick="openApartmentDetail('${a.id}')"`;
          else if(isOwnerView)click=`onclick="openApartmentContact('${a.id}')"`;
          const shopMark=a.type==='shop'?' is-shop':'';
          return `<div class="bld-unit ${cls}${shopMark}" ${click} title="${unitLabel(a)}">${a.type==='shop'?'<span class="bld-shop-badge">🏪</span>':''}${unitTypeIndex(a)}</div>`;
        }).join('')}
      </div></div>`;
    }).join('')}
    <div class="bld-base"></div></div>`;
}

function renderApDetailLedger(id){
  const a=D.apartments.find(x=>x.id===id); if(!a)return;
  const from=window.__apStmtFrom, to=window.__apStmtTo;
  const all=[...D.ledger.filter(l=>l.apartmentId===id)].sort((x,y)=>(x.date||'').localeCompare(y.date||''));
  let rows=all;
  const openingEl=document.getElementById('apStmtOpeningBal');
  if(from){
    const signed=l=>l.type==='دفعة'?-Number(l.amount):Number(l.amount);
    const before=all.filter(l=>(l.date||'')<from);
    const opening=(Number(a.openingBalance)||0)+before.reduce((s,l)=>s+signed(l),0);
    if(openingEl)openingEl.innerHTML='الرصيد الافتتاحي لأول الفترة المحددة: <b>'+money(opening)+'</b>';

    {key:'type',label:'النوع',value:l=>l.type,cell:l=>ledgerBadge(l.type)},

function saveVendor(id){
  const name=document.getElementById('vName').value.trim(); if(!name)return showMessage('أدخل الاسم');
  const data={name,category:document.getElementById('vCategory').value,phoneCountry:document.getElementById('vPhoneCountry').value,phone:document.getElementById('vPhone').value.trim(),email:document.getElementById('vEmail').value.trim(),contractStart:document.getElementById('vContractStart').value,contractEnd:document.getElementById('vContractEnd').value,notes:document.getElementById('vNotes').value.trim()};

function deleteVendorPrompt(id){
  const v=D.vendors.find(x=>x.id===id); if(!v)return;
  const inUse=(D.maintenanceReports||[]).some(r=>r.vendorId===id);
  confirmDelete(`حذف "${v.name}"؟${inUse?' فيه بلاغات صيانة مرتبطة به هتفضل موجودة بس من غير ربط بمقاول.':''}`,()=>{

function unreadChatCount(u){
  if(!u)return 0;
  const lastRead=u.lastChatRead||'';
  return (D.buildingChat||[]).filter(m=>m.createdAt>lastRead).length;
}
function markChatRead(){
  const u=currentUser(); if(!u)return;
  u.lastChatRead=new Date().toISOString();
  save();
}
function pushChatEvent(eventType,icon,title,message,link){
  D.buildingChat=D.buildingChat||[];
  D.buildingChat.push({id:uid(),kind:'event',eventType,icon,title,message,link,createdAt:new Date().toISOString()});
  if(D.buildingChat.length>500)D.buildingChat=D.buildingChat.slice(-500);
}
function pageBuildingChat(u){
  markChatRead();

function chatItemHTML(m,u){

function sendChatMessage(){
  const inp=document.getElementById('chatInput');
  const text=inp.value.trim(); if(!text)return;

function pageAnalytics(){
  const now=new Date();
  if(window.__anaFrom===undefined){
    const d=new Date(now.getFullYear(),now.getMonth()-11,1);
    window.__anaFrom=d.toISOString().slice(0,10);
  }
  if(window.__anaTo===undefined)window.__anaTo=todayISO();
  const from=window.__anaFrom, to=window.__anaTo;

  const months=[];
  {
    const start=new Date(from+'T00:00:00'), end=new Date(to+'T00:00:00');
    let cur=new Date(start.getFullYear(),start.getMonth(),1);
    while(cur<=end){months.push(cur.toISOString().slice(0,7));cur.setMonth(cur.getMonth()+1);}
  }
  const paymentsInRange=D.ledger.filter(l=>l.type==='دفعة'&&(l.date||'')>=from&&(l.date||'')<=to);
  const expensesInRange=D.expenses.filter(e=>(e.date||'')>=from&&(e.date||'')<=to);
  const collected=months.map(m=>paymentsInRange.filter(l=>(l.date||'').slice(0,7)===m).reduce((s,l)=>s+Number(l.amount),0));
  const expensed=months.map(m=>expensesInRange.filter(e=>(e.date||'').slice(0,7)===m).reduce((s,e)=>s+Number(e.amount),0));
  const totalCollected12=paymentsInRange.reduce((s,l)=>s+Number(l.amount),0);
  const totalExpensed12=expensesInRange.reduce((s,e)=>s+Number(e.amount),0);
  const avgCollectionRate=(()=>{
    let paidCount=0,totalCount=0;
    months.forEach(m=>{D.apartments.forEach(a=>{totalCount++;if(apPaidForMonth(a.id,m)===true)paidCount++;});});
    return totalCount?Math.round(paidCount/totalCount*100):0;
  })();
  const shortLabel=m=>{const names=['ين','فب','مار','أبر','ماي','يون','يول','أغ','سب','أك','نوف','ديس'];return names[parseInt(m.split('-')[1],10)-1];};

  // توزيع المصروفات حسب البند
  const byCategory={};
  expensesInRange.forEach(e=>{const c=e.category||'أخرى';byCategory[c]=(byCategory[c]||0)+Number(e.amount);});
  const categoryRows=Object.keys(byCategory).map(c=>({category:c,amount:byCategory[c]})).sort((a,b)=>b.amount-a.amount);
  const maxCatAmount=Math.max(...categoryRows.map(r=>r.amount),1);

  // أعلى المتأخرين في السداد حاليًا
  const defaulters=[...D.apartments].map(a=>({a,bal:apBalance(a.id)})).filter(x=>x.bal>0).sort((x,y)=>y.bal-x.bal).slice(0,8);

  return `
  <div class="card content-narrow">
    <div class="grid g2">
      <div class="field2"><label>من تاريخ</label><input id="anaFrom" type="date" value="${from}" onchange="applyAnalyticsFilter()"></div>
      <div class="field2"><label>إلى تاريخ</label><input id="anaTo" type="date" value="${to}" onchange="applyAnalyticsFilter()"></div>
    </div>
    <div class="flexrow mtop">
      <button class="btn sm ghost" onclick="setAnalyticsPeriod(3)">آخر 3 شهور</button>
      <button class="btn sm ghost" onclick="setAnalyticsPeriod(6)">آخر 6 شهور</button>
      <button class="btn sm ghost" onclick="setAnalyticsPeriod(12)">آخر 12 شهر</button>
      <button class="btn sm ghost" onclick="setAnalyticsYearToDate()">من بداية السنة</button>
    </div>
  </div>
  <div class="grid g3 mtop2">
    <div class="kpi ok" style="cursor:pointer" onclick="openAnalyticsDrilldown('collected')"><div class="ic">📥</div><div class="lbl">إجمالي التحصيل (الفترة المحددة)</div><div class="val">${money(totalCollected12)}</div><div class="small">دوس للتفاصيل ←</div></div>
    <div class="kpi owe" style="cursor:pointer" onclick="openAnalyticsDrilldown('expensed')"><div class="ic">📤</div><div class="lbl">إجمالي المصروفات (الفترة المحددة)</div><div class="val">${money(totalExpensed12)}</div><div class="small">دوس للتفاصيل ←</div></div>
    <div class="kpi ${avgCollectionRate>=70?'ok':'owe'}" style="cursor:pointer" onclick="openAnalyticsDrilldown('rate')"><div class="ic">📊</div><div class="lbl">متوسط نسبة السداد الشهري</div><div class="val">${avgCollectionRate}%</div><div class="small">دوس للتفاصيل ←</div></div>
  </div>
  <div class="section-title"><h3>اتجاه التحصيل مقابل المصروفات</h3></div>
  <div class="card mtop" style="overflow-x:auto">${months.length?monthlyTrendChartSVG(months,collected,expensed,shortLabel):'<p class="small">حدد فترة أطول من شهر لعرض الرسم البياني</p>'}</div>
  <div class="flexrow mtop" style="justify-content:center;gap:20px">
    <span class="small"><span style="display:inline-block;width:12px;height:12px;background:#159A8C;border-radius:3px;margin-left:5px"></span>تحصيل</span>
    <span class="small"><span style="display:inline-block;width:12px;height:12px;background:#D4A12F;border-radius:3px;margin-left:5px"></span>مصروفات</span>
  </div>

  <div class="section-title"><h3>💳 توزيع المصروفات حسب البند</h3></div>
  <div class="card mtop">${categoryRows.length?categoryRows.map(r=>`
    <div class="flexrow" style="cursor:pointer;padding:6px 0" onclick="openCategoryDrilldown('${esc(r.category).replace(/'/g,"\\'")}')">
      <span class="small" style="width:100px">${esc(r.category)}</span>
      <div style="flex:1;background:var(--line);border-radius:6px;overflow:hidden;height:18px"><div style="width:${(r.amount/maxCatAmount*100).toFixed(0)}%;background:var(--gold);height:100%"></div></div>
      <span class="small" style="width:90px;text-align:left">${money(r.amount)}</span>
    </div>`).join(''):'<p class="small">لا توجد مصروفات في هذه الفترة</p>'}</div>

  <div class="section-title"><h3>⚠️ أعلى المتأخرين في السداد حاليًا</h3></div>
  <div class="card mtop">${defaulters.length?defaulters.map(x=>`
    <div class="flexrow" style="cursor:pointer;padding:6px 0" onclick="openApartmentDetail('${x.a.id}')">
      <span class="small" style="flex:1">${esc(unitLabel(x.a))} - ${esc(x.a.ownerName||'')}</span>
      <span class="badge r">${money(x.bal)}</span>
    </div>`).join(''):'<p class="small">🎉 مفيش متأخرين في السداد حاليًا</p>'}</div>

  ${yearOverYearComparisonHTML()}`;
}
function applyAnalyticsFilter(){
  window.__anaFrom=document.getElementById('anaFrom').value;
  window.__anaTo=document.getElementById('anaTo').value;
  renderContent();
}
function setAnalyticsPeriod(monthsBack){
  const d=new Date(); d.setMonth(d.getMonth()-monthsBack+1); d.setDate(1);
  window.__anaFrom=d.toISOString().slice(0,10);
  window.__anaTo=todayISO();
  renderContent();
}
function setAnalyticsYearToDate(){
  window.__anaFrom=todayISO().slice(0,4)+'-01-01';
  window.__anaTo=todayISO();
  renderContent();
}
function openAnalyticsDrilldown(kind){

    const rows=D.ledger.filter(l=>l.type==='دفعة'&&(l.date||'')>=from&&(l.date||'')<=to).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    openDrilldownModal('تفاصيل التحصيل',rows,[
      {key:'ap',label:'الشقة',cell:l=>{const a=D.apartments.find(x=>x.id===l.apartmentId);return a?unitLabel(a):'-';}},
      {key:'amount',label:'المبلغ',cell:l=>money(l.amount)},
      {key:'date',label:'التاريخ',cell:l=>esc(l.date||'')},
      {key:'note',label:'ملاحظة',cell:l=>esc(l.note||'')},
    ]);
  }else if(kind==='expensed'){
    const rows=D.expenses.filter(e=>(e.date||'')>=from&&(e.date||'')<=to).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    openDrilldownModal('تفاصيل المصروفات',rows,[
      {key:'title',label:'البند',cell:e=>esc(e.title||e.category||'')},
      {key:'category',label:'التصنيف',cell:e=>esc(e.category||'')},
      {key:'amount',label:'المبلغ',cell:e=>money(e.amount)},
      {key:'date',label:'التاريخ',cell:e=>esc(e.date||'')},

    const rows=D.apartments.map(a=>({a,paid:apPaidForMonth(a.id,curMonth())}));

    ]);
  }

function openCategoryDrilldown(category){
  const from=window.__anaFrom, to=window.__anaTo;

function openDrilldownModal(title,rows,cols){
  const body=rows.length?`<div style="max-height:400px;overflow-y:auto"><table style="width:100%;border-collapse:collapse">
    <thead><tr>${cols.map(c=>`<th style="text-align:right;padding:6px;border-bottom:2px solid var(--line);font-size:12px">${esc(c.label)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td style="padding:6px;border-bottom:1px solid var(--line);font-size:12.5px">${c.cell(r)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`:'<p class="small">لا توجد حركات في هذه الفترة</p>';
  openModal(`<h3>${esc(title)}</h3><p class="small mtop">${rows.length} حركة</p>${body}<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">إغلاق</button></div>`);
}
function yearOverYearComparisonHTML(){
  const now=new Date();
  const thisYear=now.getFullYear();
  const lastYear=thisYear-1;
  const sumFor=(arr,year,dateField)=>arr.filter(x=>(x[dateField]||'').slice(0,4)===String(year)).reduce((s,x)=>s+Number(x.amount||0),0);
  const collectedThis=sumFor(D.ledger.filter(l=>l.type==='دفعة'),thisYear,'date');
  const collectedLast=sumFor(D.ledger.filter(l=>l.type==='دفعة'),lastYear,'date');
  const expensedThis=sumFor(D.expenses,thisYear,'date');
  const expensedLast=sumFor(D.expenses,lastYear,'date');
  if(!collectedLast&&!expensedLast)return`<div class="section-title"><h3>مقارنة سنوية</h3></div><p class="small">مفيش بيانات كافية من ${lastYear} للمقارنة - المقارنة هتظهر تلقائيًا بمجرد ما يبقى عندك سنة كاملة من البيانات.</p>`;
  const pctChange=(now2,before)=>before===0?(now2>0?100:0):Math.round(((now2-before)/before)*100);
  const collectedChange=pctChange(collectedThis,collectedLast);
  const expensedChange=pctChange(expensedThis,expensedLast);
  const changeBadge=pct=>pct===0?'<span class="badge n">بلا تغيير</span>':pct>0?`<span class="badge g">▲ ${pct}%</span>`:`<span class="badge r">▼ ${Math.abs(pct)}%</span>`;
  return`
  <div class="section-title"><h3>📅 مقارنة سنوية: ${thisYear} مقابل ${lastYear}</h3></div>
  <div class="grid g2 mtop">
    <div class="card">
      <b>💰 التحصيل</b>
      <div class="flexrow mtop"><span class="small" style="flex:1">${thisYear}: ${money(collectedThis)}</span>${changeBadge(collectedChange)}</div>

function monthlyTrendChartSVG(months,collected,expensed,shortLabel){
  const barW=16,gap=6,groupGap=18,chartH=200,baseY=220;
  const maxVal=Math.max(...collected,...expensed,1);
  const scale=v=>Math.round((v/maxVal)*chartH);
  const groupW=barW*2+gap;
  const svgW=months.length*(groupW+groupGap)+40;
  let bars='';
  months.forEach((m,i)=>{
    const x=20+i*(groupW+groupGap);
    const h1=scale(collected[i]),h2=scale(expensed[i]);
    bars+=`<rect x="${x}" y="${baseY-h1}" width="${barW}" height="${h1}" rx="2" fill="#159A8C"/>`;
    bars+=`<rect x="${x+barW+gap}" y="${baseY-h2}" width="${barW}" height="${h2}" rx="2" fill="#D4A12F"/>`;
    bars+=`<text x="${x+groupW/2}" y="${baseY+18}" text-anchor="middle" font-size="11" fill="#666">${shortLabel(m)}</text>`;
  });
  return `<svg width="${svgW}" height="250" viewBox="0 0 ${svgW} 250" xmlns="http://www.w3.org/2000/svg">
    <line x1="15" y1="${baseY}" x2="${svgW-10}" y2="${baseY}" stroke="#ddd" stroke-width="1"/>
    ${bars}
  </svg>`;
}

async function createBuildingBlock(){
  const blockName=document.getElementById('blkName').value.trim();

  const isVilla=blkType==='villa';
  const groundCount=isVilla?1:Math.max(1,Number(document.getElementById('blkGroundCount').value||4));
  const floors=isVilla?0:Math.max(0,Number(document.getElementById('blkFloors').value||0));
  const perFloor=isVilla?1:Math.max(1,Number(document.getElementById('blkPerFloor').value||4));
  const shopsCount=blkType==='mixed'?Math.min(groundCount,Number(document.getElementById('blkShops').value||0)):0;

    const uname=`${prefix}${safeBlock}${i}`;

    D.apartments.push({id:newId,number:i,blockName,type:isShop?'shop':'apartment',usageType:isShop?'تجاري':'سكني',openingBalance:0,floor:isVilla?'':floorLabel(i,groundCount,perFloor),ownerName:ownerLabel,tenantName:'',phoneCountry:'+20',phone:'',email:'',monthlyFee:fee,username:uname,notes:''});

  }
  D.building.apartmentsCount=D.apartments.length;

function saveBuilding(){
  D.building.name=document.getElementById('bName').value.trim();
  D.building.address=document.getElementById('bAddr').value.trim();
  D.building.city=document.getElementById('bCity').value.trim();
  const bCountrySel=document.getElementById('bNationCountry').value;
  D.building.country=bCountrySel==='أخرى'?document.getElementById('bOtherCountry').value.trim():bCountrySel;
  D.building.governorate=document.getElementById('bGovernorate').value.trim();
  D.building.locationUrl=document.getElementById('bLocation').value.trim();
  D.building.floorsCount=document.getElementById('bFloors').value;
  D.building.groundFloorCount=Number(document.getElementById('bGroundCount').value||4);
  D.building.groundShopsCount=Math.min(D.building.groundFloorCount,Number(document.getElementById('bGroundShops').value||0));
  D.building.apartmentsPerFloor=Number(document.getElementById('bPerFloor').value||4);
  D.building.buildYear=document.getElementById('bYear').value.trim();
  D.building.currency=document.getElementById('bCurrency').value.trim()||'جنيه';
  D.building.notes=document.getElementById('bNotes').value.trim();
  logActivity('تعديل بيانات العمارة','');
  save();toast('تم حفظ بيانات العمارة');renderContent();
}
function applyGroundShopsPrompt(){
  const shopsCount=Math.min(D.building.groundFloorCount||4,Number(document.getElementById('bGroundShops').value||0));
  confirmDelete(`سيتم تحويل أول ${shopsCount} وحدة في الدور الأرضي (حسب رقم الوحدة) لنوع "محل"، والباقي في الدور الأرضي هيفضل "شقة". أي تصنيف يدوي سابق للوحدات هيتغيّر.`,()=>{
    const groundCount=D.building.groundFloorCount||4;
    [...D.apartments].sort((a,b)=>a.number-b.number).forEach((a,idx)=>{
      if(a.number<=groundCount)a.type=(idx<shopsCount)?'shop':'apartment';
    });
    D.building.groundShopsCount=shopsCount;
    save();toast('تم تحديث أنواع وحدات الدور الأرضي');renderContent();
  });
}

function reassignFloors(){
