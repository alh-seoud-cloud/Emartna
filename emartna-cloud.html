<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>عمارتنا - إدارة اتحاد الملاك</title>
<meta name="theme-color" content="#159A8C"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="عمارتنا"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F9FB; --panel:#ffffff; --card:#ffffff; --line:#e2e8ec; --text:#2F3437; --muted:#6B7280;
  --accent:#159A8C; --accent-dark:#0E6E64; --gold:#D4A12F; --gold-dark:#a9812e;
  --red:#c23b3b; --blue:#2563a8; --sidebarbg:#F8FAF9; --sidebar-text:#2F3437; --sidebar-muted:#6B7280; --inputbg:#fffdf8; --radius:12px;
  --illus-buildings:#DDEEEB; --illus-trees:#CFE5DD; --illus-shadows:#EAF4F1;
  --tint-success:#f0f8f5; --tint-warning:#fdf6e8; --tint-danger:#fdecec; --tint-danger-line:#f3c6c6;
  --badge-g-bg:#e3f3ee; --badge-g-text:var(--accent-dark);
  --badge-r-bg:#fbe6e6; --badge-r-text:var(--red);
  --badge-y-bg:#fbf1dc; --badge-y-text:var(--gold-dark);
  --badge-b-bg:#e3edf7; --badge-b-text:var(--blue);
  --badge-n-bg:#eee; --badge-n-text:#666;
}
[data-palette="azure"]{--accent:#2563a8;--accent-dark:#1c4a80;--gold:#0ea5b0;--gold-dark:#0b7d86}
[data-palette="violet"]{--accent:#6d28d9;--accent-dark:#551fae;--gold:#c9962c;--gold-dark:#a67a1e}
[data-palette="rose"]{--accent:#be123c;--accent-dark:#970f30;--gold:#b45309;--gold-dark:#8f4207}
[data-palette="slate"]{--accent:#475569;--accent-dark:#334155;--gold:#b45309;--gold-dark:#8f4207}
[data-palette="amber"]{--accent:#b45309;--accent-dark:#8f4207;--gold:#0f6e5c;--gold-dark:#0b5347}
[data-palette="graphite"]{--bg:#eef1f4;--panel:#ffffff;--card:#ffffff;--line:#dde2e7;--text:#1e2530;--muted:#67707c;--accent:#4f46e5;--accent-dark:#4338ca;--gold:#0ea5b0;--gold-dark:#0b7d86;--inputbg:#ffffff}
[data-mode="dark"]{
  --bg:#20201e; --panel:#2a2a28; --card:#2a2a28; --line:#3a3a37; --text:#e9e9e7; --muted:#a3a39f; --inputbg:#2e2e2b;
  --tint-success:#1e2b22; --tint-warning:#2f2818; --tint-danger:#2f1f1e; --tint-danger-line:#4a2f2d;
  --badge-g-bg:#203830; --badge-g-text:#82d9bb;
  --badge-r-bg:#3d2220; --badge-r-text:#f0a8a3;
  --badge-y-bg:#362d18; --badge-y-text:#e8ca7d;
  --badge-b-bg:#1e2c3a; --badge-b-text:#92b8e0;
  --badge-n-bg:#302f2c; --badge-n-text:#c9c9c4;
  --sidebarbg:#1a1a18; --sidebar-text:#e9e9e7; --sidebar-muted:#a3a39f;
}
[data-mode="dark"] .login-card{background:var(--panel)}
[data-mode="dark"] .table-wrap table thead{background:#2e2e2b}
[data-mode="dark"] tr:hover td{background:#2e2e2b}
[data-mode="dark"] .notif-item:hover{background:#2e2e2b}
[data-mode="dark"] .bld-shop-badge{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.5)}
[data-mode="dark"] .poll-bar-track{background:#3a3a37}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo','Tajawal','Noto Color Emoji','Segoe UI Emoji','Apple Color Emoji',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,b,strong{font-family:'Cairo','Noto Color Emoji','Segoe UI Emoji',sans-serif;font-weight:700}
button,input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--accent)}

/* ===== LOGIN ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:
  radial-gradient(circle at 15% 20%, rgba(212,161,47,.08), transparent 40%),
  radial-gradient(circle at 85% 80%, rgba(21,154,140,.1), transparent 45%),
  var(--sidebarbg);padding:20px}
.login-wrap .skyline-bg{position:absolute;bottom:0;left:0;right:0;pointer-events:none;opacity:.9;z-index:0}
.login-wrap .login-card{position:relative;z-index:1}
.login-card{background:var(--panel);border-radius:20px;padding:34px 30px;width:100%;max-width:410px;box-shadow:0 12px 40px rgba(21,154,140,.12);position:relative;overflow:hidden}
.wizard-steps{display:flex;align-items:center;justify-content:center;margin:14px 0 4px}
.wizard-dot{width:28px;height:28px;border-radius:50%;background:var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;transition:.2s}
.wizard-dot.active{background:var(--accent);color:#fff}
.wizard-dot.done{background:var(--accent-dark);color:#fff}
.wizard-line{width:26px;height:2px;background:var(--line)}
.wizard-step{animation:wizFadeIn .2s ease}
@keyframes wizFadeIn{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:translateX(0)}}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:20px;position:relative}
.login-logo .mark{width:92px;height:92px;display:flex;align-items:center;justify-content:center;border-radius:16px}
.login-logo h1{font-size:21px;color:var(--accent-dark)}
.login-logo p{font-size:12px;color:var(--muted)}
.landing{min-height:100vh;background:var(--bg)}
.landing-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.06);position:sticky;top:0;z-index:5}
.landing-nav b{color:var(--accent-dark)}
.landing-hero{text-align:center;padding:64px 20px 48px;background:linear-gradient(180deg,var(--panel),var(--bg));position:relative;overflow:hidden}
.landing-hero .skyline-bg{position:absolute;top:0;bottom:0;left:0;right:0;pointer-events:none;z-index:0}
.landing-hero>*:not(.skyline-bg){position:relative;z-index:1}
.landing-hero h1{font-size:32px;color:var(--accent-dark);margin-bottom:14px}
.landing-hero p{color:var(--muted);max-width:560px;margin:0 auto 24px;line-height:1.9;font-size:15px}
.landing-features{padding:8px 24px 56px;max-width:1100px;margin:0 auto}
.landing-features .card{text-align:center}
.landing-footer{text-align:center;padding:24px;color:var(--muted);border-top:1px solid var(--line)}
.login-tabs{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.login-tabs button{flex:1;padding:9px;border:0;background:var(--inputbg);color:var(--muted);cursor:pointer;font-weight:700;font-size:12.5px}
.login-tabs button.active{background:var(--accent);color:#fff}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--inputbg);color:var(--text);outline:none;transition:.15s}
.field input:focus,.field select:focus{border-color:var(--accent)}
.pw-wrap{position:relative}
.pw-wrap input{padding-left:38px!important}
.pw-toggle{position:absolute;left:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:15px;padding:4px;line-height:1;color:var(--muted)}
@keyframes helpPulse{0%,100%{box-shadow:0 0 0 0 rgba(15,110,92,.55)}50%{box-shadow:0 0 0 10px rgba(15,110,92,0)}}
.help-pulse{position:relative;z-index:5;animation:helpPulse 1s ease-out 4;border-radius:10px;outline:2px solid var(--accent)!important;outline-offset:2px}
.tour-card{position:absolute;z-index:900;background:var(--panel);border:2px solid var(--accent);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.2);padding:14px 16px;width:300px;max-width:calc(100vw - 20px)}
.offer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:950;display:flex;align-items:center;justify-content:center;padding:16px}
.offer-popup{position:relative;background:linear-gradient(160deg,var(--accent),var(--accent-dark));color:#fff;border-radius:20px;padding:32px 24px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);max-height:90vh;overflow-y:auto}
.offer-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.2);border:0;color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
.offer-popup h2{font-size:22px;margin-bottom:6px}
.offer-popup h3{font-size:18px;font-weight:800;color:var(--gold);margin-bottom:16px}
.offer-features{text-align:right;display:inline-block;margin:0 auto}
.offer-features p{margin:8px 0;font-size:14px}
.offer-cta{margin-top:20px;background:#fff;color:var(--accent-dark);border:0;padding:14px 20px;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer;width:100%}
.offer-footnote{margin-top:16px;font-size:11px;opacity:.85}
.login-btn{width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:4px}
.login-btn:hover{filter:brightness(1.08)}
.login-hint{margin-top:14px;font-size:11px;color:var(--muted);text-align:center;line-height:1.8}
.login-error{background:var(--tint-danger);color:var(--red);border:1px solid #f3c6c6;padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:14px;display:none}

/* ===== APP SHELL ===== */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:250px;background:var(--sidebarbg);color:var(--sidebar-text);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;border-left:1px solid var(--line)}
.sidebar .brand{padding:20px 18px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sidebar .brand .mark{width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar .brand h1{font-size:16px;color:var(--sidebar-text)}
.sidebar .brand p{font-size:10.5px;color:var(--sidebar-muted)}
.nav-sec{padding:14px 10px 2px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 14px;border:0;background:transparent;color:var(--sidebar-text);text-align:right;cursor:pointer;font-size:13.5px;border-radius:9px;margin:2px 8px;width:calc(100% - 16px);transition:.15s}
.nav-btn .ic{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.nav-btn:hover{background:rgba(21,154,140,.08)}
.nav-btn.active{background:var(--accent);color:#fff;font-weight:700}
.sidebar-foot{margin-top:auto;padding:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--sidebar-muted)}
.sidebar-foot b{color:var(--sidebar-text);display:block;font-size:12.5px}

.nav-group{margin:3px 8px}
.nav-group-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;border-radius:8px;font-size:13px;font-weight:700;color:var(--sidebar-text);background:rgba(21,154,140,.05);border-left:3px solid var(--accent);transition:.15s;user-select:none}
.nav-group-header:hover{background:rgba(21,154,140,.1)}
.nav-group.expanded>.nav-group-header{background:rgba(21,154,140,.13);border-left-color:var(--gold)}
.nav-group-header .ghl{display:flex;align-items:center;gap:9px}
.nav-group-arrow{font-size:10px;color:var(--muted);transition:transform .2s}
.nav-group.expanded .nav-group-arrow{transform:rotate(-90deg);color:var(--gold-dark)}
.nav-subitems{max-height:0;overflow:hidden;transition:max-height .22s ease}
.nav-group.expanded .nav-subitems{max-height:600px}
.nav-subitem{display:flex;align-items:center;gap:9px;padding:9px 12px 9px 12px;margin:2px 6px 2px 6px;font-size:12.5px;color:var(--sidebar-text);cursor:pointer;border-radius:7px;transition:.15s}
.nav-subitem:hover{background:rgba(21,154,140,.08)}
.nav-subitem.active{background:var(--accent);color:#fff;font-weight:700}
.nav-subitem .ic{font-size:13px;width:16px;text-align:center;flex-shrink:0}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top{height:58px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0}
.top .tl{font-size:16.5px;font-weight:700}
.top .actions{display:flex;gap:8px;align-items:center}
.content{padding:22px;overflow-y:auto;flex:1}
.content-narrow{max-width:1100px}

.btn{border:0;border-radius:9px;padding:8px 15px;color:var(--text);background:var(--card);border:1.5px solid var(--line);cursor:pointer;font-size:13px;transition:.15s;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.btn:hover{filter:brightness(.97);border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border:0}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#fff;border:0}
.btn.red{background:var(--red);color:#fff;border:0}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.kpi .ic{position:absolute;left:14px;top:14px;font-size:26px;opacity:.18}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.kpi .val{font-size:22px;font-weight:800}
.kpi.owe .val{color:var(--red)} .kpi.ok .val{color:var(--accent)}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.section-title:first-child{margin-top:0}
.section-title h3{font-size:15.5px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#faf7ef;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;padding:9px 10px;text-align:right;border-bottom:1.5px solid var(--line);white-space:nowrap;user-select:none;position:relative}
th:hover{color:var(--accent)}
th .sort-ic{opacity:.5;font-size:10px}
.col-resize-handle{position:absolute;top:0;bottom:0;left:0;width:6px;cursor:col-resize;z-index:2}
.col-resize-handle:hover,.col-resize-handle:active{background:var(--accent);opacity:.4}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#faf8f2}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);-webkit-overflow-scrolling:touch;position:relative}
@media(max-width:860px){
  .table-wrap{background:linear-gradient(to left,var(--panel) 0%,transparent 12px) left/16px 100% no-repeat local,linear-gradient(to right,var(--panel) 0%,transparent 12px) right/16px 100% no-repeat local,linear-gradient(to left,rgba(0,0,0,.12),transparent 16px) left/16px 100% no-repeat scroll,linear-gradient(to right,rgba(0,0,0,.12),transparent 16px) right/16px 100% no-repeat scroll}
  .table-wrap table td,.table-wrap table th{padding:8px 8px;font-size:12.5px;white-space:nowrap}
}
.table-wrap table{border:0}
.table-wrap tr:last-child td{border-bottom:0}
.table-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.col-quick-menu{position:absolute;z-index:600;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:220px;padding:4px;display:flex;flex-direction:column}
.var-autocomplete{position:absolute;z-index:700;top:100%;right:0;left:0;background:var(--panel);border:1px solid var(--accent);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:220px;overflow-y:auto;margin-top:2px}
.var-item{padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.var-item:hover{background:var(--bg)}
.var-item:last-child{border-bottom:0}
.cqm-item{background:none;border:0;text-align:right;padding:8px 10px;font-size:13px;border-radius:8px;cursor:pointer;color:var(--text)}
.cqm-item:hover{background:var(--bg)}
.cqm-sep{height:1px;background:var(--line);margin:4px 2px}
.search-box{padding:8px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--inputbg);min-width:220px}

.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.badge.g{background:var(--badge-g-bg);color:var(--badge-g-text)} .badge.r{background:var(--badge-r-bg);color:var(--badge-r-text)}
.badge.y{background:var(--badge-y-bg);color:var(--badge-y-text)} .badge.b{background:var(--badge-b-bg);color:var(--badge-b-text)} .badge.n{background:var(--badge-n-bg);color:var(--badge-n-text)}

.field2{margin-bottom:14px}
.field2 label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field2 input,.field2 select,.field2 textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--inputbg);color:var(--text);outline:none}
.field2 input:focus,.field2 select:focus,.field2 textarea:focus{border-color:var(--accent)}
.field2 textarea{resize:vertical;min-height:70px}
.checkline{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.checkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 10px;max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:10px}
@media(max-width:640px){.checkgrid{grid-template-columns:repeat(2,1fr)}}

.modal-overlay{position:fixed;inset:0;background:rgba(10,20,17,.55);display:none;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--panel);border-radius:16px;padding:24px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:760px}
.modal h3{margin-bottom:16px;font-size:16.5px}
.modal-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1c2622;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;z-index:1200;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.25s;pointer-events:none}
.toast.err{background:var(--red)}
.modal-err-banner{background:var(--tint-danger);border:1px solid var(--tint-danger-line);color:var(--red);padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:12px;display:none}

.notif-panel{position:fixed;width:320px;max-width:calc(100vw - 20px);max-height:400px;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.2);display:none;z-index:400}
.notif-panel.show{display:block}
.notif-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}
.notif-item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
.notif-item:hover{background:#faf8f2}
.notif-item.unread{background:var(--tint-success)}
.notif-ic{font-size:16px;flex-shrink:0}
.toast.show{opacity:1;bottom:30px}

/* building illustration */
.bld-wrap{background:linear-gradient(180deg,#eef4f0,var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:20px;max-width:520px}
.bld-floor{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bld-floor-label{width:78px;font-size:11px;color:var(--muted);font-weight:700;flex-shrink:0;text-align:left}
.bld-units{display:flex;gap:6px;flex:1}
.bld-unit{flex:1;aspect-ratio:1.3;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;cursor:pointer;border:2px solid transparent;transition:.15s}
.bld-unit:hover{transform:translateY(-2px);border-color:#000}
.bld-unit.paid{background:var(--accent)} .bld-unit.unpaid{background:var(--red)} .bld-unit.none{background:#cfc9b8;color:#7a7460}
.bld-unit.neutral{background:var(--blue)} .bld-unit.shop{background:var(--gold-dark)}
.bld-unit{position:relative}
.bld-unit.is-shop{border:2px dashed rgba(255,255,255,.85)}
.bld-shop-badge{position:absolute;top:-8px;right:-6px;font-size:11px;line-height:1;background:#fff;border-radius:50%;padding:2px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.bld-roof{height:14px;background:var(--gold-dark);border-radius:6px 6px 0 0;margin-bottom:8px}
.bld-base{height:10px;background:var(--sidebarbg);border-radius:0 0 6px 6px;margin-top:4px}

.poll-opt{border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:.15s}
.poll-opt:hover{border-color:var(--accent)}
.poll-bar-row{margin-bottom:10px}
.poll-bar-track{background:#efe9d9;border-radius:6px;height:10px;overflow:hidden;margin-top:4px}
.poll-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-dark));border-radius:6px}
.comment-item{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.comment-item:last-child{border-bottom:0}
.comment-meta{font-size:11px;color:var(--muted);margin-top:2px}

.theme-swatches{display:flex;gap:10px;flex-wrap:wrap}
.theme-sw{width:40px;height:40px;border-radius:10px;cursor:pointer;border:3px solid transparent;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.theme-sw.active{border-color:var(--text)}

.small{font-size:12px;color:var(--muted)}
.mtop{margin-top:14px} .mtop2{margin-top:22px}
.flexrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.hidden{display:none!important}
.hamburger{display:none;background:transparent;border:0;font-size:20px;cursor:pointer;color:var(--text)}
.sidebar-backdrop{display:none}
@media(max-width:860px){
  .sidebar{position:fixed;top:0;bottom:0;right:0;z-index:500;transform:translateX(100%);transition:transform .2s;box-shadow:-10px 0 30px rgba(0,0,0,.3)}
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:block;flex-shrink:0}
  .g4,.g3{grid-template-columns:repeat(2,1fr)}
  .sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:490;opacity:0;pointer-events:none;transition:opacity .2s}
  .sidebar-backdrop.show{opacity:1;pointer-events:auto}
  .top{padding:0 10px;gap:6px}
  .top .flexrow{flex-shrink:0;gap:6px}
  .top .tl,#pageTitle{font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top .actions{gap:2px;overflow-x:auto;scrollbar-width:none}
  .top .actions::-webkit-scrollbar{display:none}
  .top .actions>.small{display:none}
  .top .actions .btn{padding:6px 8px;font-size:12px}
}

/* =========================================================
   عمارتنا - نظام إدارة اتحاد الملاك (متعدد العمارات)
   تخزين محلي بالكامل (localStorage) - لا يوجد سيرفر خارجي
   ========================================================= */
const REG_KEY='omaretna_registry_v2';
const SESSION_KEY='omaretna_session_v2';
var REG=null, D=null, activeBuildingId=null, curPage='dashboard';

function uid(){return Date.now()+'_'+Math.floor(Math.random()*99999)}
function todayISO(){return new Date().toISOString().slice(0,10)}
function curMonth(){return new Date().toISOString().slice(0,7)}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function arabicFormattedDate(d){
  d=d||new Date();
  return d.toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}
function timeBasedGreeting(){
  const h=new Date().getHours();
  if(h<5)return'🌙 مساء الخير';
  if(h<12)return'☀️ صباح الخير';
  if(h<17)return'🌤️ مساء الخير';
  if(h<21)return'🌆 مساء الخير';
  return'🌙 مساء الخير';
}
function upgradeAlertBannerHTML(){
  const lic=ensureLicense(findBuildingRec(activeBuildingId)); if(!lic)return'';
  const today=todayISO();
  const dismissedKey='__upgradeAlertDismissed_'+activeBuildingId;
  if(localStorage.getItem(dismissedKey)===today)return'';
  let banner='';
  // تذكير قرب انتهاء التجربة/الاشتراك
  if(lic.status==='active'&&lic.endDate){
    const daysLeft=Math.ceil((new Date(lic.endDate)-new Date(today))/86400000);
    if(daysLeft>=0&&daysLeft<=3){
      const planDef=findPlan(lic.plan);
      const isTrial=!planDef||planDef.isTrial||planDef.priceBefore===0;
      banner=`<div class="card content-narrow mtop2" style="background:var(--tint-warning);border:1px solid var(--gold)">
        <div class="flexrow"><div style="font-size:24px">⏰</div><div style="flex:1">
          <b>${isTrial?'تجربتك المجانية هتخلص قريب!':'اشتراكك هينتهي قريب!'}</b>
          <p class="small mtop">${daysLeft===0?'هتنتهي النهاردة':daysLeft===1?'باقي يوم واحد بس':'باقي '+daysLeft+' أيام'} - رقّي دلوقتي عشان البيانات متتوقفش.</p>
        </div>
        <button class="btn sm primary" onclick="go('license')">رقّي الآن</button>
        <button class="btn sm ghost" onclick="dismissUpgradeAlert()">تذكير بكرة</button>
        </div></div>`;
    }
  }
  // تنبيه اقتراب حد عدد الوحدات
  if(!banner&&lic.maxApartments&&lic.maxApartments!==Infinity){
    const used=D.apartments.length;
    const pct=used/lic.maxApartments;
    if(pct>=0.8){
      banner=`<div class="card content-narrow mtop2" style="background:var(--tint-warning);border:1px solid var(--gold)">
        <div class="flexrow"><div style="font-size:24px">📈</div><div style="flex:1">
          <b>قربت توصل لحد باقتك</b>
          <p class="small mtop">مستخدم ${used} من ${lic.maxApartments} وحدة (${Math.round(pct*100)}%) - رقّي لخطة أكبر قبل ما توصل للحد.</p>
        </div>
        <button class="btn sm primary" onclick="go('license')">رقّي الآن</button>
        <button class="btn sm ghost" onclick="dismissUpgradeAlert()">تذكير بكرة</button>
        </div></div>`;
    }
  }
  // تذكير النسخة الاحتياطية الدورية (أسبوعي)
  if(!banner){
    const lastBackup=D.lastBackupDate;
    const daysSinceBackup=lastBackup?Math.floor((new Date(today)-new Date(lastBackup))/86400000):9999;
    if(daysSinceBackup>=7){
      banner=`<div class="card content-narrow mtop2" style="background:var(--tint-warning);border:1px solid var(--gold)">
        <div class="flexrow"><div style="font-size:24px">💾</div><div style="flex:1">
          <b>محتاج تاخد نسخة احتياطية</b>
          <p class="small mtop">${lastBackup?'آخر نسخة كانت من '+daysSinceBackup+' يوم':'لسه ما اخدتش نسخة احتياطية خالص'} - بياناتك متخزنة في المتصفح بس، خد نسخة عشان متفقدش حاجة.</p>
        </div>
        <button class="btn sm primary" onclick="exportBackup()">⬇️ تنزيل الآن</button>
        <button class="btn sm ghost" onclick="dismissUpgradeAlert()">تذكير بكرة</button>
        </div></div>`;
    }
  }
  return banner;
}
function dismissUpgradeAlert(){
  localStorage.setItem('__upgradeAlertDismissed_'+activeBuildingId,todayISO());
  renderContent();
}

      <div class="small" style="color:rgba(255,255,255,.92);margin-top:4px">📅 النهاردة ${arabicFormattedDate()}</div>
    </div></div>
  </div>`;
}

function heroIllustrationSVG(){
  return `<div style="max-width:220px;margin:0 auto;position:relative;z-index:1">${appLogoSVG(220)}</div>`;
}
function heroSkylineSVG(dark){
  const bColor='var(--illus-buildings)';
  const winColor='var(--illus-shadows)';
  const treeTrunk='var(--illus-buildings)';
  const treeLeaf='var(--illus-trees)';
  const t=(x,scale)=>`<g transform="translate(${x},0) scale(${scale})" opacity=".85">
    <rect x="-3" y="60" width="6" height="26" fill="${treeTrunk}"/>
    <circle cx="0" cy="46" r="22" fill="${treeLeaf}"/>
  </g>`;
  const b=(x,w,h,windows)=>{
    const y=110-h;
    let wins='';
    for(let r=0;r<Math.floor((h-10)/16);r++){
      for(let c=0;c<Math.floor((w-10)/16);c++){
        wins+=`<rect x="${x+8+c*16}" y="${y+8+r*16}" width="8" height="10" fill="${winColor}" opacity=".9"/>`;
      }
    }
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${bColor}" opacity=".9"/>${wins}`;
  };
  return `<svg viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style="width:100%;height:110px;display:block">
    <rect x="0" y="104" width="900" height="6" fill="${bColor}" opacity=".5"/>
    ${b(20,60,55,true)}${t(105,0.8)}${b(150,45,75,true)}${b(210,70,45,true)}${t(300,1)}${b(340,55,90,true)}
    ${b(410,40,60,true)}${t(470,0.7)}${b(520,65,70,true)}${b(600,50,50,true)}${t(670,0.9)}${b(710,75,85,true)}
    ${b(800,55,60,true)}${t(870,0.75)}
  </svg>`;
}
function pwField(id,placeholder,value,autocomplete){
  return `<div class="pw-wrap"><input id="${id}" name="${id}" type="password" autocomplete="${autocomplete||'new-password'}" placeholder="${esc(placeholder||'')}" value="${esc(value||'')}"><button type="button" class="pw-toggle" onclick="togglePwVisibility('${id}')" tabindex="-1">👁️</button></div>`;
}
function togglePwVisibility(id){
  const inp=document.getElementById(id); if(!inp)return;
  const btn=inp.nextElementSibling;
  if(inp.type==='password'){inp.type='text'; if(btn)btn.textContent='🙈';}
  else{inp.type='password'; if(btn)btn.textContent='👁️';}
}

function passwordPolicyError(pw){
  pw=String(pw||'');
  if(pw.length<8)return'كلمة المرور لازم تكون 8 حروف على الأقل';

/* ---------- كلمات المرور: PBKDF2-SHA256 مملّح، مع ترقية تلقائية للحسابات القديمة ---------- */
function legacyHashPw(pw){let h=5381;pw=String(pw);for(let i=0;i<pw.length;i++){h=((h*33)^pw.charCodeAt(i))>>>0}return h.toString(16)}
function bufToHex(buf){return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function hexToBuf(hex){const b=new Uint8Array(hex.length/2);for(let i=0;i<b.length;i++)b[i]=parseInt(hex.substr(i*2,2),16);return b}
async function hashPassword(password,saltHex){
  const salt=saltHex?hexToBuf(saltHex):crypto.getRandomValues(new Uint8Array(16));
  const enc=new TextEncoder();
  const keyMaterial=await crypto.subtle.importKey('raw',enc.encode(String(password)),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},keyMaterial,256);
  return{v:2,hash:bufToHex(bits),salt:bufToHex(salt)};
}
async function verifyPassword(password,stored){
  if(!stored)return false;
  if(typeof stored==='string')return legacyHashPw(password)===stored; // حساب قديم لسه ما ترقّاش
  const r=await hashPassword(password,stored.salt);
  return r.hash===stored.hash;
}
/** يتحقق من كلمة المرور، ولو صحيحة وكانت بالتنسيق القديم، يرقّيها تلقائيًا لـPBKDF2 ويحفظ mutator(newRecord) */
async function verifyAndUpgrade(password,stored,upgradeFn){
  const ok=await verifyPassword(password,stored);
  if(ok&&typeof stored==='string'&&upgradeFn){
    const newRecord=await hashPassword(password);
    upgradeFn(newRecord);
  }
  return ok;
}

/* ---------- الدخول بالبصمة (WebAuthn - يعمل بالكامل من غير سيرفر) ---------- */
function bioSupported(){return window.isSecureContext&&!!(window.PublicKeyCredential&&navigator.credentials)}
function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
function b64ToBuf(str){return Uint8Array.from(atob(str),c=>c.charCodeAt(0))}
function bioIndex(){try{return JSON.parse(localStorage.getItem('omaretna_bio_index')||'[]')}catch(e){return[]}}

function derToRawEcdsaSig(der){
  let offset=2;
  function readInt(){
    if(der[offset]!==0x02)throw new Error('bad signature format');
    offset++; let len=der[offset++];
    let bytes=der.slice(offset,offset+len); offset+=len;
    while(bytes.length>32&&bytes[0]===0)bytes=bytes.slice(1);
    if(bytes.length<32){const p=new Uint8Array(32);p.set(bytes,32-bytes.length);bytes=p;}
    return bytes;
  }
  const r=readInt(),s=readInt();
  const raw=new Uint8Array(64); raw.set(r,0); raw.set(s,32);
  return raw;
}
function bioSubject(){

async function registerBiometric(){
  if(!bioSupported())return showMessage('الدخول بالبصمة يحتاج اتصال آمن (HTTPS) ومتصفح يدعم WebAuthn.');
  const subj=bioSubject(); if(!subj)return;
  try{
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const userId=crypto.getRandomValues(new Uint8Array(16));
    const cred=await navigator.credentials.create({publicKey:{
      challenge,rp:{name:'عمارتنا'},
      user:{id:userId,name:subj.username,displayName:subj.name},
      pubKeyCredParams:[{type:'public-key',alg:-7}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
      timeout:60000
    }});
    const pubKeyBuf=cred.response.getPublicKey();
    if(!pubKeyBuf)return showMessage('تعذر تفعيل البصمة على هذا المتصفح، جرّب متصفحًا أحدث.');
    const record={credentialId:b64(cred.rawId),publicKeySpki:b64(pubKeyBuf),accountType:subj.session.type,buildingId:subj.session.buildingId||null,username:subj.username,label:subj.name+(subj.session.type==='building'?' - '+(D.building?D.building.name:''):' (مسؤول النظام)')};
    subj.ref.webauthnEnabled=true;
    const idx=bioIndex().filter(r=>!(r.username===subj.username&&r.accountType===subj.session.type&&r.buildingId===record.buildingId));
    idx.push(record); saveBioIndex(idx);
    bioSaveAndRender(subj.session);
    toast('تم تفعيل الدخول بالبصمة على هذا الجهاز');
  }catch(e){
    if(e.name!=='NotAllowedError')showMessage('لم يتم تفعيل البصمة: '+(e.message||'حدث خطأ غير متوقع'));
  }
}

}
async function loginWithBiometric(){
  if(!bioSupported())return showLoginError('الدخول بالبصمة غير مدعوم على هذا الجهاز أو المتصفح');
  const idx=bioIndex();
  if(!idx.length)return showLoginError('لا يوجد حساب مفعّل عليه الدخول بالبصمة على هذا الجهاز بعد');
  try{
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const assertion=await navigator.credentials.get({publicKey:{
      challenge,allowCredentials:idx.map(r=>({type:'public-key',id:b64ToBuf(r.credentialId)})),
      userVerification:'required',timeout:60000
    }});
    const matched=idx.find(r=>r.credentialId===b64(assertion.rawId));
    if(!matched)return showLoginError('البصمة غير مسجّلة على هذا التطبيق');
    const authData=new Uint8Array(assertion.response.authenticatorData);
    const clientDataHash=new Uint8Array(await crypto.subtle.digest('SHA-256',assertion.response.clientDataJSON));
    const signedData=new Uint8Array(authData.length+clientDataHash.length);
    signedData.set(authData,0); signedData.set(clientDataHash,authData.length);
    const pubKey=await crypto.subtle.importKey('spki',b64ToBuf(matched.publicKeySpki),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    const rawSig=derToRawEcdsaSig(new Uint8Array(assertion.response.signature));
    const valid=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},pubKey,rawSig,signedData);
    if(!valid)return showLoginError('تعذر التحقق من البصمة');
    if(matched.accountType==='sysowner'){
      setSession({type:'sysowner'}); D=null; activeBuildingId=null; curPage='sysdash';
      renderRoot(); resetHistoryBase();
    }else{
      const data=loadBuildingData(matched.buildingId);
      if(!data)return showLoginError('تعذر تحميل بيانات هذا الحساب');
      const rec=REG.buildings.find(b=>b.id===matched.buildingId);
      if(!rec)return showLoginError('هذه العمارة لم تعد موجودة');
      if(rec.license&&rec.license.status==='suspended')return showLoginError('تم إيقاف الاشتراك الخاص بهذه العمارة');
      const u=(data.users||[]).find(x=>x.username===matched.username);
      if(!u||u.active===false)return showLoginError('هذا الحساب غير متاح حاليًا');
      window.__cameFromSysOwner=false;
      activeBuildingId=matched.buildingId; D=data; migrateBuildingData();
      setSession({type:'building',buildingId:matched.buildingId,username:u.username});
      curPage=u.role==='admin'?'dashboard':'home';
      renderRoot(); resetHistoryBase();
    }
  }catch(e){
    if(e.name!=='NotAllowedError')showLoginError('تعذر الدخول بالبصمة: '+(e.message||''));
  }
}

function generateBuildingCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code;
  do{
    code='OMR-'+Array.from({length:5},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
  }while(REG.buildings.some(b=>b.code===code));
  return code;
}
function usernamePrefixFromCode(code){return(code||'').replace('OMR-','').toLowerCase()}
function generateReferralCode(name){
  const base=(name||'').replace(/[^a-zA-Z\u0600-\u06FF0-9]/g,'').slice(0,4)||'REF';
  let code;
  do{ code=(base+Math.floor(1000+Math.random()*9000)).toUpperCase(); }
  while(REG.buildings.some(b=>b.referralCode===code));
  return code;
}

function buildChangeSummary(oldObj,newObj,fieldLabels){
  const changes=[];
  for(const key in fieldLabels){
    const oldVal=(oldObj[key]===undefined||oldObj[key]===null)?'':String(oldObj[key]);
    const newVal=(newObj[key]===undefined||newObj[key]===null)?'':String(newObj[key]);
    if(oldVal!==newVal)changes.push(`${fieldLabels[key]}: من "${oldVal||'-'}" إلى "${newVal||'-'}"`);
  }
  return changes;
}

/* ---------- حسابات الشقق (كشف الحساب) ---------- */
function apCharges(apId){return D.ledger.filter(l=>l.apartmentId===apId&&(l.type==='شهري'||l.type==='مشروع')).reduce((s,l)=>s+Number(l.amount),0)}
function apPayments(apId){return D.ledger.filter(l=>l.apartmentId===apId&&l.type==='دفعة').reduce((s,l)=>s+Number(l.amount),0)}
function apRefunds(apId){return D.ledger.filter(l=>l.apartmentId===apId&&l.type==='صرف').reduce((s,l)=>s+Number(l.amount),0)}
function apAdjust(apId){return D.ledger.filter(l=>l.apartmentId===apId&&l.type==='تسوية').reduce((s,l)=>s+Number(l.amount),0)}
function apBalance(apId){const a=D.apartments.find(x=>x.id===apId);return(a?Number(a.openingBalance)||0:0)+apCharges(apId)-apPayments(apId)+apRefunds(apId)+apAdjust(apId)}
function unitTypeIndex(a){
  if(!a||!D||!D.apartments)return 0;
  const list=D.apartments.filter(x=>x.type===a.type&&(a.blockName?x.blockName===a.blockName:!x.blockName)).sort((x,y)=>x.number-y.number);
  const idx=list.findIndex(x=>x.id===a.id);
  return idx>=0?idx+1:0;
}
function unitTypeName(a){return a&&a.type==='shop'?'محل':'شقة'}
function syncUsageTypeDefault(){
  const type=document.getElementById('mType').value;
  const usageEl=document.getElementById('mUsage');
  if(usageEl)usageEl.value=type==='shop'?'تجاري':'سكني';
  const userEl=document.getElementById('mUser');
  if(userEl&&/^(.*?)(shaqa|mahal)\d+$/.test(userEl.value)){
    userEl.value=userEl.value.replace(/(shaqa|mahal)(\d+)$/,(type==='shop'?'mahal':'shaqa')+'$2');
  }
}
function unitLabel(a){if(!a)return'-';return(a.blockName?esc(a.blockName)+' - ':'')+unitTypeName(a)+' '+unitTypeIndex(a)}
function apPaidForMonth(apId,month){
  const charge=D.ledger.find(l=>l.apartmentId===apId&&l.type==='شهري'&&l.month===month);
  if(!charge)return null;
  const paidAfter=D.ledger.filter(l=>l.apartmentId===apId&&l.type==='دفعة'&&l.month===month).reduce((s,l)=>s+Number(l.amount),0);
  return paidAfter>=charge.amount;
}
/* ---------- الخزينة والحسابات البنكية ---------- */
function accName(accId){const acc=D.accounts.find(a=>a.id===accId);return acc?acc.name:'-'}
function accountBalance(accId){
  const acc=D.accounts.find(a=>a.id===accId); if(!acc)return 0;
  let bal=Number(acc.opening||0);
  bal+=D.ledger.filter(l=>l.type==='دفعة'&&l.accountId===accId).reduce((s,l)=>s+Number(l.amount),0);
  bal-=D.ledger.filter(l=>l.type==='صرف'&&l.accountId===accId).reduce((s,l)=>s+Number(l.amount),0);
  bal-=D.expenses.filter(e=>e.accountId===accId).reduce((s,e)=>s+Number(e.amount),0);
  bal+=D.transfers.filter(t=>t.to===accId).reduce((s,t)=>s+Number(t.amount),0);
  bal-=D.transfers.filter(t=>t.from===accId).reduce((s,t)=>s+Number(t.amount),0);
  return bal;
}
function totalTreasury(){return D.accounts.reduce((s,a)=>s+accountBalance(a.id),0)}
function totalCollected(){return D.ledger.filter(l=>l.type==='دفعة').reduce((s,l)=>s+Number(l.amount),0)}
function totalExpenses(){return D.expenses.reduce((s,e)=>s+Number(e.amount),0)}

function highlightMatch(text,q){
  if(!q)return esc(text);
  const s=String(text);
  const idx=s.toLowerCase().indexOf(q.toLowerCase());

  return esc(s.slice(0,idx))+'<mark>'+esc(s.slice(idx,idx+q.length))+'</mark>'+esc(s.slice(idx+q.length));
}
function renderSortableInner(tableId){
  const cfg=window.__tableConfigs[tableId]; if(!cfg)return'';
  const{columns,opts}=cfg;
  const st=window.__sortState[tableId];
  const visible=orderedVisibleCols(tableId+'_order',tableId+'_vis',columns);
  const widths=window[tableId+'_widths']||{};
  const{filtered}=getFilteredSortedRows(tableId);
  const hasCustomWidths=visible.some(c=>typeof widths[c.key]==='number');
  const colgroup=hasCustomWidths?`<colgroup>${visible.map(c=>{
    const w=widths[c.key];
    return `<col${typeof w==='number'?` style="width:${w}px"`:''}>`;
  }).join('')}</colgroup>`:'';
  const colFilters=window[tableId+'_filters']||{};
  const head=visible.map(c=>{
    const w=widths[c.key];
    const pxWidth=typeof w==='number'?w:null;
    const wrapStyle=pxWidth?'white-space:normal;word-break:break-word;':'';
    const hasFilter=!!colFilters[c.key];
    return `<th ${pxWidth?`style="width:${pxWidth}px;min-width:60px;${wrapStyle}"`:''} data-colkey="${esc(c.key)}"><span onclick="openColumnQuickMenu(event,'${tableId}','${c.key}')" style="cursor:pointer">${esc(c.label)}${hasFilter?' 🔍':''}${st.key===c.key?`<span class="sort-ic">${st.dir===1?'▲':'▼'}</span>`:''}</span><span class="col-resize-handle" onmousedown="startColResize(event,'${tableId}','${c.key}')" ontouchstart="startColResize(event,'${tableId}','${c.key}')"></span></th>`;
  }).join('');
  const cellHTML=(c,r)=>{
    if(c.cell)return c.cell(r);

    return st.q?highlightMatch(raw,st.q):esc(String(raw??''));
  };
  const tdStyleFor=key=>{
    const w=widths[key];
    return typeof w==='number'?' style="white-space:normal;word-break:break-word;overflow-wrap:break-word"':'';
  };
  const body=filtered.length?filtered.map(r=>{
    const rowAttr=opts&&opts.rowClick?` style="cursor:pointer" onclick="${opts.rowClick(r)}"`:'';

  return `<div class="table-wrap"><table${hasCustomWidths?' style="table-layout:fixed"':''}>${colgroup}<thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

let __colResizeState=null;
function startColResize(e,tableId,colKey){
  e.preventDefault(); e.stopPropagation();
  const th=e.target.closest('th');
  const startX=(e.touches?e.touches[0].clientX:e.clientX);
  __colResizeState={tableId,colKey,startX,startWidth:th.offsetWidth};
  document.addEventListener('mousemove',onColResizeMove);
  document.addEventListener('mouseup',onColResizeEnd);
  document.addEventListener('touchmove',onColResizeMove,{passive:false});
  document.addEventListener('touchend',onColResizeEnd);
}
function onColResizeMove(e){
  if(!__colResizeState)return;
  e.preventDefault();
  const clientX=(e.touches?e.touches[0].clientX:e.clientX);
  const delta=document.documentElement.dir==='rtl'?-(clientX-__colResizeState.startX):(clientX-__colResizeState.startX);
  const newWidth=Math.max(60,__colResizeState.startWidth+delta);
  const th=document.querySelector(`#${__colResizeState.tableId}_wrap th[data-colkey="${__colResizeState.colKey}"]`);
  if(th){th.style.width=newWidth+'px';th.style.minWidth='60px';}
}
function onColResizeEnd(e){
  if(!__colResizeState)return;
  const th=document.querySelector(`#${__colResizeState.tableId}_wrap th[data-colkey="${__colResizeState.colKey}"]`);
  let tableId=null,colKey=null;
  if(th){

function getFilteredSortedRows(tableId){
  const cfg=window.__tableConfigs[tableId]; if(!cfg)return{rows:[],columns:[],opts:{}};
  const{rows,columns,opts}=cfg;
  const st=window.__sortState[tableId]||{};
  let filtered=rows;
  if(st.q){
    const q=st.q.toLowerCase();
    filtered=rows.filter(r=>columns.some(c=>c.value&&String(c.value(r)||'').toLowerCase().includes(q)));
  }
  const colFilters=window[tableId+'_filters'];
  if(colFilters){
    Object.keys(colFilters).forEach(colKey=>{
      const allowed=colFilters[colKey]; if(!allowed)return;
      const col=columns.find(c=>c.key===colKey); if(!col||!col.value)return;
      filtered=filtered.filter(r=>allowed.has(String(col.value(r)??'')));
    });
  }
  if(st.key){
    const col=columns.find(c=>c.key===st.key);
    const sortFn=col&&(col.sortValue||col.value);
    if(col&&sortFn){
      filtered=[...filtered].sort((a,b)=>{
        let va=sortFn(a),vb=sortFn(b);
        if(typeof va==='number'&&typeof vb==='number')return(va-vb)*st.dir;
        return String(va||'').localeCompare(String(vb||''),'ar')*st.dir;
      });
    }
  }
  return{filtered,columns,opts};
}
function activeFilterCount(tableId){
  const f=window[tableId+'_filters']; if(!f)return 0;
  return Object.keys(f).filter(k=>f[k]).length;
}
function openColumnFilterMenu(tableId,colKey){

    <div class="mtop" style="max-height:320px;overflow-y:auto" id="colFilterList">${distinct.map(v=>`<label class="checkline cf-row" data-label="${esc(v.toLowerCase())}" style="display:block;padding:4px 0"><input type="checkbox" class="cf-check" value="${esc(v)}" ${checked.has(v)?'checked':''}> ${esc(v)||'(فارغ)'}</label>`).join('')}</div>

    <div class="modal-actions"><button class="btn primary" onclick="applyColumnFilter('${tableId}','${colKey}',${distinct.length})">✅ تطبيق</button><button class="btn ghost" onclick="clearColumnFilter('${tableId}','${colKey}')">مسح هذا الفلتر</button></div>`);

function filterColFilterList(q){

function darkenHex(hex,amt){
  hex=hex.replace('#','');
  let r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
  r=Math.max(0,Math.round(r*(1-amt)));g=Math.max(0,Math.round(g*(1-amt)));b=Math.max(0,Math.round(b*(1-amt)));
  return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function applyBrandColors(){
  if(typeof REG==='undefined'||!REG)return;
  const b=ensureBrandSettings();
  let css='';
  if(b.colorAccent)css+=`--accent:${b.colorAccent};--accent-dark:${darkenHex(b.colorAccent,0.25)};`;
  if(b.colorGold)css+=`--gold:${b.colorGold};--gold-dark:${darkenHex(b.colorGold,0.2)};`;
  if(b.colorDark)css+=`--text:${b.colorDark};`;
  if(b.colorSidebarBg)css+=`--sidebarbg:${b.colorSidebarBg};`;
  if(b.colorIllusBuildings)css+=`--illus-buildings:${b.colorIllusBuildings};`;
  if(b.colorIllusTrees)css+=`--illus-trees:${b.colorIllusTrees};`;
  if(b.colorIllusShadows)css+=`--illus-shadows:${b.colorIllusShadows};`;
  let styleTag=document.getElementById('brandOverrideStyle');
  if(!styleTag){styleTag=document.createElement('style');styleTag.id='brandOverrideStyle';document.head.appendChild(styleTag);}
  styleTag.textContent=css?`:root{${css}}`:'';
}

    </div></div>`;

function dismissInstallBanner(){
  localStorage.setItem('__installBannerDismissed',todayISO());
  renderRoot();
}
function showIOSInstallInstructions(){
  openModal(`<h3>📲 تثبيت التطبيق على آيفون</h3>
    <div class="mtop" style="line-height:2">
      <p>1️⃣ دوس على زرار <b>المشاركة</b> (المربع وفيه سهم لفوق ⬆️) في شريط المتصفح تحت.</p>
      <p>2️⃣ مرّر لحد ما تلاقي خيار <b>"إضافة إلى الشاشة الرئيسية"</b> (Add to Home Screen).</p>
      <p>3️⃣ دوس <b>"إضافة"</b> فوق يمين الشاشة.</p>
      <p class="small mtop" style="color:var(--muted)">بعد كده هتلاقي أيقونة "عمارتنا" على شاشتك الرئيسية زي أي تطبيق عادي.</p>
    </div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">تمام</button></div>`);
}

    {id:uid(),title:'5. كلمات المرور',body:'بتتخزن بصيغة مشفّرة (hashed) مش نص صريح، ومحدش - حتى فريق البرنامج - يقدر يشوفها.'},

function ensureLegalSettings(){
  if(!REG.legalSettings)REG.legalSettings={sections:defaultLegalSections()};

  return REG.legalSettings;
}

function landingHTML(){
  const ls=ensureLandingSettings();
  const features=ls.features;
  window.__landingFeatures=features;
  const personas=[
    {icon:'👔',title:'رئيس اتحاد الملاك',desc:'تحكم كامل: التحصيل، المصروفات، المشاريع، الاجتماعات، الاستطلاعات، وتقارير ذكية - كل حاجة في مكان واحد.'},
    {icon:'🏠',title:'صاحب الشقة',desc:'يشوف رصيده، يسجّل دفعاته بإثبات، يصوّت في القرارات، ويتابع كل إعلان واجتماع خاص بعمارته.'},
    {icon:'🔑',title:'المستأجر',desc:'حساب مستقل بالكامل عن المالك - نفس المتابعة والتواصل مع العمارة من غير ما يشوف بيانات المالك الخاصة.'},
  ];
  return `
  <div class="landing">
    ${ls.showBanners?(REG.landingBanners||[]).filter(b=>isBannerScheduledActive(b)).map(b=>`
    <div class="flexrow" style="background:var(--accent);color:#fff;padding:10px 20px;text-align:center;justify-content:center;gap:10px">
      <span><b>${esc(b.title)}</b> — ${esc(b.message)}</span>
      ${b.link?`<a href="${esc(b.link)}" target="_blank" style="color:#fff;text-decoration:underline">اعرف أكتر</a>`:''}
    </div>`).join(''):''}
    <div class="landing-nav">
      <div class="flexrow" style="cursor:pointer" onclick="goToLanding()"><div class="mark">${appLogoSVG(56)}</div><b style="font-size:18px">عمارتنا</b></div>
      <div class="flexrow">
        <input id="landingSearchBox" class="search-box" placeholder="🔍 دوّر في الصفحة..." oninput="filterLandingContent(this.value)" style="width:160px">
        <span class="install-btn-slot">${installButtonHTML()}</span>
        ${modeToggleBtnHTML()}
        <button class="btn ghost sm" onclick="goToLogin()">تسجيل الدخول</button>
        <button class="btn primary sm" onclick="openSignup()">تسجيل جديد</button>
      </div>
    </div>
    <div id="landingNoResults" class="card content-narrow" style="display:none;text-align:center;margin:20px auto">
      <p>😕 مفيش نتايج مطابقة للبحث</p>
      <button class="btn sm ghost mtop" onclick="document.getElementById('landingSearchBox').value='';filterLandingContent('')">مسح البحث</button>
    </div>
    <div class="landing-hero">
      ${ls.showSkyline?(ls.heroImage?`<div class="skyline-bg" style="background-image:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.35)),url(${ls.heroImage});background-size:cover;background-position:center bottom"></div>`:`<div class="skyline-bg">${heroSkylineSVG(true)}</div>`):''}
      <div class="mtop">${heroIllustrationSVG()}</div>
      <h1 class="mtop" style="font-size:38px">${esc(ls.heroTitle)}</h1>
      <h2 style="font-size:20px;color:var(--muted);font-weight:600;margin-bottom:10px">${esc(ls.heroTagline)}</h2>
      <p>${esc(ls.heroDescription)}</p>
      <div class="flexrow" style="justify-content:center">
        <button class="btn primary" onclick="openSignup()">${esc(ls.ctaPrimary)}</button>
        <button class="btn ghost" onclick="goToLogin()">${esc(ls.ctaSecondary)}</button>
      </div>
    </div>
    ${ls.showFeatures?`<div class="section-title" style="text-align:center"><h3>مميزات البرنامج</h3><p class="small">${esc(ls.featuresHint)}</p></div>
    <div class="grid g3 landing-features">
      ${features.map(f=>`<div class="card landing-feature-card landing-search-item" data-search="${esc((f.title+' '+f.desc).toLowerCase())}" style="cursor:pointer" onclick="openFeatureDetail('${f.id}')"><div style="font-size:28px">${f.icon}</div><h3 class="mtop">${esc(f.title)}</h3><p class="small mtop">${esc(f.desc)}</p><p class="small mtop" style="color:var(--accent)">عرض التفاصيل ←</p></div>`).join('')}
    </div>`:''}
    ${ls.showPersonas?`<div class="section-title" style="text-align:center"><h3>يناسب كل الأطراف</h3></div>
    <div class="grid g3 landing-features">
      ${personas.map(p=>`<div class="card landing-search-item" data-search="${esc((p.title+' '+p.desc).toLowerCase())}" style="text-align:center"><div style="font-size:32px">${p.icon}</div><h3 class="mtop">${esc(p.title)}</h3><p class="small mtop">${esc(p.desc)}</p></div>`).join('')}
    </div>`:''}
    <div class="landing-hero" style="padding-top:20px">
      <div class="flexrow" style="justify-content:center">
        <button class="btn primary" onclick="openSignup()">سجّل عمارتك الآن مجانًا</button>
      </div>
    </div>
    <div class="landing-footer">
      <p class="small">عمارتنا - نظام إدارة اتحادات الملاك</p>
      <p class="small mtop">
        <a href="javascript:void(0)" onclick="openPrivacyPolicyModal()">سياسة الخصوصية وشروط الاستخدام</a>
        · <a href="javascript:void(0)" onclick="openHelpContactModal()">المساعدة والتواصل</a>
      </p>
    </div>
  </div>`;
}
function loginHTML(){
  if(window.__viewMode==='landing')return landingHTML();
  if(window.__viewMode==='signup')return signupHTML();
  if(window.__viewMode==='recover')return recoverHTML();
  return `
  <div class="login-wrap">
    <div class="skyline-bg">${heroSkylineSVG(true)}</div>
    <div class="login-card">
      <div class="login-logo"><div class="mark">${appLogoSVG(92)}</div><h1>عمارتنا</h1><p>نظام إدارة اتحاد الملاك</p></div>
      <div style="text-align:center;margin-top:-8px"><a href="javascript:void(0)" onclick="goToLanding()" class="small">← الصفحة الرئيسية</a></div>
      <div class="login-error" id="loginErr"></div>
      <form id="loginForm" autocomplete="on">
      <div class="field"><label>اسم المستخدم</label><input id="lgUser" name="username" autocomplete="username" placeholder="مثال: admin أو shaqa1"></div>
      <div class="field"><label>كلمة المرور</label>${pwField('lgPass','','','current-password')}</div>
      <button class="login-btn" id="lgBtn" type="submit">تسجيل الدخول</button>
      </form>
      ${(bioSupported()&&bioIndex().length)?`<button class="login-btn" style="background:var(--gold);margin-top:8px" onclick="loginWithBiometric()">🔐 دخول بالبصمة</button>`:''}
      <div class="mtop2" style="border-top:1px dashed var(--line);padding-top:14px">
        <p class="small" style="text-align:center;color:var(--muted)">🎬 عايز تجرّب البرنامج قبل ما تسجّل حساب؟</p>
        <div class="flexrow mtop" style="justify-content:center;gap:8px">
          <button class="btn sm gold" onclick="loginAsDemo('admin')">👔 دخول كرئيس اتحاد (تجريبي)</button>
          <button class="btn sm ghost" onclick="loginAsDemo('owner')">🏠 دخول كصاحب شقة (تجريبي)</button>
        </div>
        <p class="small mtop" style="text-align:center;color:var(--muted)">عمارة تجريبية جاهزة بـ24 وحدة وبيانات واقعية - أي تعديل بترجع تلقائي لما تخرج.</p>
      </div>
      <div class="login-hint">
        <a href="javascript:void(0)" onclick="openRecover()">نسيت كلمة المرور؟</a><br>
        <a href="javascript:void(0)" onclick="openSignup()">اتحاد عمارتك مش مسجّل؟ أنشئ حساب رئيس اتحاد جديد</a>
      </div>
      <div class="login-hint" style="color:#b98a2b">⚠️ البيانات تُحفظ داخل هذا المتصفح فقط على هذا الجهاز. لتسجيل دخول أسرع، اختر "حفظ كلمة المرور" لو المتصفح اقترحها عليك.</div>
      <div class="login-hint"><a href="javascript:void(0)" onclick="openPrivacyPolicyModal()">سياسة الخصوصية</a> · <a href="javascript:void(0)" onclick="openHelpContactModal()">المساعدة والتواصل</a></div>
    </div>
  </div>`;
}
function signupHTML(){
  return `
  <div class="login-wrap">
    <div class="skyline-bg">${heroSkylineSVG(true)}</div>
    <div class="login-card" style="max-width:440px">
      <div class="login-logo"><div class="mark">${appLogoSVG(92)}</div><h1>عمارتنا</h1><p>إنشاء حساب رئيس اتحاد جديد</p></div>
      <div style="text-align:center;margin-top:-8px"><a href="javascript:void(0)" onclick="goToLanding()" class="small">← الصفحة الرئيسية</a></div>
      <div class="wizard-steps" id="wizardSteps">
        ${[1,2,3,4].map(n=>`<div class="wizard-dot" id="wizDot${n}" data-step="${n}"><span>${n}</span></div>`).join('<div class="wizard-line"></div>')}

      <p class="small" style="text-align:center;color:var(--muted)" id="wizStepLabel">الخطوة 1 من 4: بيانات العمارة</p>

      <form id="signupForm" autocomplete="on" onsubmit="return false">
      <div class="wizard-step" id="wizStep1">

        <div class="field"><label>عدد المحلات من ضمنها (إن وجدت) <span style="font-weight:400">(اتركها صفر لو مفيش محلات)</span></label><input id="suGroundShops" type="number" value="0" min="0"></div>
        </div>
        <div id="suCompoundNote" class="field hidden"><p class="small">هتقدر تضيف كل مبنى وفيلا في الكمبوند بالتفصيل من شاشة "مباني وفلل الكمبوند" بعد إنشاء الحساب مباشرة.</p></div>
        <div class="field"><label>الدولة</label><select id="suNationCountry" onchange="toggleGovernorateField('su')">${nationOptions('مصر')}</select></div>

        <div class="field" id="suGovernorateFieldWrap"><label>المحافظة</label><select id="suGovernorate">${EGYPT_GOVERNORATES.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div>
        <div class="field"><label>المدينة <span style="color:var(--red)">*</span></label><input id="suCity" placeholder="مثال: مدينة نصر"></div>
        <div class="field"><label>عنوان العمارة التفصيلي <span style="color:var(--red)">*</span></label><input id="suAddress" placeholder="مثال: 12 شارع النيل، المعادي"></div>
        <div class="field"><label>رابط الموقع على خرائط جوجل <span style="font-weight:400">(اختياري)</span></label><input id="suLocation" placeholder="https://maps.google.com/..." type="url"></div>
      </div>

window.__wizardStep=1;
function wizardStepFields(step){
  return{1:['suName','suCity','suAddress'],2:['suUser','suPass','suPassConfirm','suPhone'],3:[],4:[]}[step]||[];
}
function validateWizardStep(step){
  const required=wizardStepFields(step);
  for(const id of required){
    const el=document.getElementById(id);
    if(el&&!el.value.trim()){showLoginError('من فضلك أكمل الحقول المطلوبة (*) قبل ما تكمل');el.focus();return false;}
  }
  if(step===2){
    const pass=document.getElementById('suPass').value;
    const confirm=document.getElementById('suPassConfirm').value;
    if(pass!==confirm){showLoginError('كلمة المرور وتأكيدها مش متطابقين');return false;}
  }
  return true;
}
function showWizardStep(step){
  window.__wizardStep=step;
  for(let i=1;i<=4;i++){
    const el=document.getElementById('wizStep'+i);
    if(el)el.classList.toggle('hidden',i!==step);
    const dot=document.getElementById('wizDot'+i);
    if(dot){dot.classList.toggle('active',i===step);dot.classList.toggle('done',i<step);}
  }
  const labels={1:'بيانات العمارة',2:'حسابك الشخصي',3:'الأمان والاسترداد',4:'أكواد اختيارية والموافقة'};
  const lbl=document.getElementById('wizStepLabel'); if(lbl)lbl.textContent='الخطوة '+step+' من 4: '+labels[step];
  const prevBtn=document.getElementById('wizPrevBtn'); if(prevBtn)prevBtn.style.display=step===1?'none':'';
  const nextBtn=document.getElementById('wizNextBtn'); if(nextBtn)nextBtn.style.display=step===4?'none':'';
  const submitBtn=document.getElementById('suBtn'); if(submitBtn)submitBtn.style.display=step===4?'':'none';
  document.getElementById('loginErr').style.display='none';
}
function wizardNext(){
  if(!validateWizardStep(window.__wizardStep))return;
  if(window.__wizardStep<4)showWizardStep(window.__wizardStep+1);
}
function wizardPrev(){
  if(window.__wizardStep>1)showWizardStep(window.__wizardStep-1);
}
function openSignup(){window.__previewMode=false;window.__viewMode='signup';renderRoot();window.__wizardStep=1;setTimeout(()=>{showWizardStep(1);wireSignupPasswordMatch();},0);try{history.pushState({viewMode:'signup'},'',location.href);}catch(e){}}
function wireSignupPasswordMatch(){
  const pass=document.getElementById('suPass');
  const confirm=document.getElementById('suPassConfirm');
  if(!pass||!confirm)return;
  const check=()=>{
    const msg=document.getElementById('suPassMatchMsg'); if(!msg)return;
    if(!confirm.value){msg.textContent='';return;}
    if(pass.value===confirm.value){msg.textContent='✅ متطابقة';msg.style.color='var(--accent)';}
    else{msg.textContent='❌ مش متطابقة';msg.style.color='var(--red)';}
  };
  pass.oninput=check; confirm.oninput=check;
}
function closeSignup(){window.__viewMode='login';renderRoot();try{history.pushState({viewMode:'login'},'',location.href);}catch(e){}}
function toggleSuCommunityFields(){
  const isCompound=document.getElementById('suCommunityType').value==='compound';
  document.getElementById('suFlatUnitsWrap').classList.toggle('hidden',isCompound);
  document.getElementById('suCompoundNote').classList.toggle('hidden',!isCompound);
}
function findApartmentByPhone(phone){
  const cleanPhone=phone.replace(/\D/g,''); if(!cleanPhone)return null;
  for(const b of REG.buildings){
    const data=loadBuildingData(b.id); if(!data)continue;
    const match=(data.apartments||[]).find(a=>a.phone&&a.phone.replace(/\D/g,'')===cleanPhone);
    if(match)return{building:b,apartment:match};
  }
  return null;
}
function showPhoneMatchWarning(match){
  openModal(`<h3>⚠️ رقم الهاتف ده مسجّل بالفعل</h3>
    <p class="small mtop">لاحظنا إن رقم الهاتف ده مسجّل كـ"${esc(match.apartment.ownerName)}" في وحدة ${esc(unitLabelStatic(match.apartment))} بعمارة "${esc(match.building.name)}".</p>
    <p class="small mtop">لو انت صاحب الوحدة دي، الأفضل تسجّل دخولك بحسابك الموجود بدل ما تنشئ حساب جديد. لو انت فعلًا بتنشئ اتحاد/عمارة جديدة تمامًا (زي لو انت كمان رئيس اتحاد في عمارة تانية)، تقدر تكمل عادي.</p>
    <div class="modal-actions">
      <button class="btn primary" onclick="closeModal();goToLogin()">🔑 تسجيل الدخول بدلًا من ذلك</button>
      <button class="btn gold" onclick="closeModal();window.__signupPhoneConfirmed=true;doSignup()">✅ متابعة إنشاء حساب جديد</button>
    </div>`);
}
function unitLabelStatic(a){return(a.blockName?a.blockName+' - ':'')+(a.type==='shop'?'محل':'شقة')+' '+a.number}
async function doSignup(){
  const name=document.getElementById('suName').value.trim();
  const trialCap=trialPlan().maxApartments||24;
  const communityType=document.getElementById('suCommunityType').value;
  const count=communityType==='compound'?0:Math.min(trialCap,Number(document.getElementById('suCount').value||trialCap));
  const groundCount=Math.max(1,Number(document.getElementById('suGroundCount').value||4));
  const groundShops=Math.min(groundCount,Number(document.getElementById('suGroundShops').value||0));
  const address=document.getElementById('suAddress').value.trim();
  const locationUrl=document.getElementById('suLocation').value.trim();
  const city=document.getElementById('suCity').value.trim();
  const countrySel=document.getElementById('suNationCountry').value;
  const country=countrySel==='أخرى'?document.getElementById('suOtherCountry').value.trim():countrySel;
  const governorate=document.getElementById('suGovernorate').value.trim();
  const username=document.getElementById('suUser').value.trim();
  const password=document.getElementById('suPass').value;
  const passwordConfirm=document.getElementById('suPassConfirm')?document.getElementById('suPassConfirm').value:password;
  if(password!==passwordConfirm)return showLoginError('كلمة المرور وتأكيدها مش متطابقين');
  const phoneCountry=document.getElementById('suCountry').value;
  const phone=document.getElementById('suPhone').value.trim();
  const email=document.getElementById('suEmail').value.trim();
  const rq=document.getElementById('suRQ').value.trim();
  const ra=document.getElementById('suRA').value.trim();
  if(!name)return showLoginError('اسم العمارة / الاتحاد مطلوب');
  if(!username)return showLoginError('اسم المستخدم مطلوب');
  if(!password)return showLoginError('كلمة المرور مطلوبة');
  if(!document.getElementById('suAgree').checked)return showLoginError('لازم توافق على سياسة الخصوصية وشروط الاستخدام للمتابعة');
  if(!phone)return showLoginError('رقم الهاتف مطلوب');
  if(!city)return showLoginError('المدينة مطلوبة');
  if(!address)return showLoginError('عنوان العمارة مطلوب');
  if(!window.__signupPhoneConfirmed){
    const match=findApartmentByPhone(phone);
    if(match)return showPhoneMatchWarning(match);
  }
  window.__signupPhoneConfirmed=false;
  const pwErr=passwordPolicyError(password); if(pwErr)return showLoginError(pwErr);
  if(isUsernameTaken(username))return showLoginError('اسم المستخدم ده محجوز، اختر اسمًا آخر');
  const referralCodeUsed=document.getElementById('suReferral').value.trim();
  const couponCodeUsed=document.getElementById('suCoupon').value.trim();
  const signupSource=getCampaignSource();
  const{code,id:newBuildingId}=await createBuildingRecord(name,count,4,username,password,rq,ra,phoneCountry,phone,email,trialPlan().key,{groundShopsCount:groundShops,groundFloorCount:groundCount,address,locationUrl,city,country,governorate,communityType,referralCodeUsed,couponCodeUsed,signupSource});
  pushSysNotification('عمارة جديدة سجّلت بنفسها',`"${name}" - خطة تجريبية - يوزر الأدمن: ${username}`,'sysdash');
  window.__viewMode='login';
  try{history.pushState({viewMode:'login'},'',location.href);}catch(e){}
  showCodeConfirmModal(name,code,username,true);
  renderRoot();
}

/* ---------- استرداد كلمة المرور ---------- */
function openRecover(){window.__viewMode='recover';window.__recoveryStep=1;window.__recoveryMatches=[];window.__recoveryTarget=null;renderRoot();try{history.pushState({viewMode:'recover'},'',location.href);}catch(e){}}
function closeRecover(){window.__viewMode='login';renderRoot();try{history.pushState({viewMode:'login'},'',location.href);}catch(e){}}
function findUserMatches(username){
  const matches=[];
  if(username===REG.sysOwner.username)matches.push({type:'sysowner'});
  REG.buildings.forEach(b=>{
    const d=loadBuildingData(b.id); if(!d)return;
    const u=(d.users||[]).find(x=>x.username===username);
    if(u)matches.push({type:'building',buildingId:b.id,buildingName:b.name,code:b.code,role:u.role,userId:u.id,hasRecovery:!!(u.recoveryQ&&u.recoveryA)});
  });
  return matches;
}
function recoverHTML(){
  const step=window.__recoveryStep;
  return `
  <div class="login-wrap">
    <div class="skyline-bg">${heroSkylineSVG(true)}</div>
    <div class="login-card">
    <div class="login-logo"><div class="mark">${appLogoSVG(92)}</div><h1>استرداد الدخول</h1><p>ابحث بحساب اسم المستخدم بتاعك</p></div>
    <div class="login-error" id="loginErr"></div>
    ${step===1?`
      <div class="field"><label>اسم المستخدم</label><input id="rcUser" placeholder="اسم المستخدم اللي بتدخل بيه"></div>
      <button class="login-btn" id="rcSearchBtn">بحث</button>
      <div class="login-hint"><a href="javascript:void(0)" onclick="closeRecover()">العودة لتسجيل الدخول</a></div>
    `:step===2?recoverResultsHTML():step===4?recoverVerifyHTML():step===5?recoverContactResetHTML():recoverContactFailHTML()}
  </div></div>`;
}
function recoverResultsHTML(){
  const matches=window.__recoveryMatches;
  if(!matches.length)return `<p class="small">مفيش أي حساب بالاسم ده على هذا الجهاز.</p><div class="login-hint mtop"><a href="javascript:void(0)" onclick="window.__recoveryStep=1;renderRoot()">بحث تاني</a> · <a href="javascript:void(0)" onclick="closeRecover()">العودة لتسجيل الدخول</a></div>`;
  return `<div style="text-align:right">
    ${matches.map((m,i)=>{
      if(m.type==='sysowner')return `<div class="card mtop"><b>حساب مسؤول النظام</b>
        <button class="btn sm primary mtop" onclick="startContactVerify(${i})">استرداد الحساب</button>
      </div>`;
      const roleLabel=m.role==='admin'?'رئيس اتحاد':'صاحب شقة';
      return `<div class="card mtop"><b>${roleLabel} - عمارة "${esc(m.buildingName)}"</b>
        <button class="btn sm primary mtop" onclick="startContactVerify(${i})">استرداد الحساب</button>
      </div>`;
    }).join('')}
    <div class="login-hint mtop"><a href="javascript:void(0)" onclick="window.__recoveryStep=1;renderRoot()">بحث تاني</a> · <a href="javascript:void(0)" onclick="closeRecover()">العودة لتسجيل الدخول</a></div>
  </div>`;
}
function startContactVerify(matchIndex){window.__recoveryTarget=window.__recoveryMatches[matchIndex];window.__recoveryStep=4;renderRoot()}
function accountRecoveryQ(t){
  if(t.type==='sysowner')return REG.sysOwner.recoveryQ||null;
  const d=loadBuildingData(t.buildingId); const u=d.users.find(x=>x.id===t.userId);
  return u.recoveryQ||null;
}
function recoverVerifyHTML(){
  const t=window.__recoveryTarget;
  const q=accountRecoveryQ(t);
  return `
  <p class="small">للتأكد من هويتك، هنحتاج التحقق من أكتر من بيانة${q?' - وده حساب عليه سؤال أمان إضافي، فهيتم طلبه كمان':''}.</p>
  <div class="field mtop"><label>البريد الإلكتروني أو رقم الهاتف المسجّل</label><input id="rcContact" placeholder="مثال: 01012345678 أو name@email.com"></div>
  ${q?`<div class="field"><label><b>سؤال الأمان:</b> ${esc(q)}</label><input id="rcAnswer" placeholder="الإجابة"></div>`:''}
  <button class="login-btn" id="rcVerifyBtn">تحقق</button>
  <div class="login-hint"><a href="javascript:void(0)" onclick="window.__recoveryStep=2;renderRoot()">رجوع</a></div>`;
}
function accountContactInfo(t){
  if(t.type==='sysowner')return{phone:'',email:''};
  const d=loadBuildingData(t.buildingId); const u=d.users.find(x=>x.id===t.userId);
  return{phone:(u.phone||'').replace(/\D/g,''),email:(u.email||'').trim().toLowerCase()};
}
async function doContactVerify(){
  const t=window.__recoveryTarget;
  const input=document.getElementById('rcContact').value.trim().toLowerCase();
  const inputDigits=input.replace(/\D/g,'');
  const info=accountContactInfo(t);
  const contactOk=(info.email&&input===info.email)||(info.phone&&inputDigits&&info.phone.slice(-9)===inputDigits.slice(-9));
  const q=accountRecoveryQ(t);
  let questionOk=true;
  if(q){
    const answer=document.getElementById('rcAnswer').value.trim().toLowerCase();
    const storedAnswer=t.type==='sysowner'?REG.sysOwner.recoveryA:loadBuildingData(t.buildingId).users.find(u=>u.id===t.userId).recoveryA;
    questionOk=answer&&await verifyPassword(answer,storedAnswer);
  }
  if(contactOk&&questionOk){window.__recoveryStep=5;renderRoot();}
  else{window.__recoveryStep=6;renderRoot();}
}
function recoverContactResetHTML(){
  return `
  <p class="small" style="color:var(--accent-dark)">✅ تم التحقق من هويتك بنجاح.</p>
  <div class="field mtop"><label>كلمة المرور الجديدة</label>${pwField('rcNewPass')}</div>
  <button class="login-btn" id="rcContactResetBtn">تعيين كلمة المرور الجديدة</button>`;
}
function recoverContactFailHTML(){
  const t=window.__recoveryTarget;
  let contactHTML;
  if(t.type==='sysowner'||t.role==='admin'){
    const vp=REG.sysOwner;
    contactHTML=(vp.contactPhone||vp.contactEmail)?`<div class="mtop small">${vp.contactPhone?`📱 ${esc(vp.contactPhoneCountry||'')} ${esc(vp.contactPhone)}`:''}${vp.contactEmail?`<br>✉️ ${esc(vp.contactEmail)}`:''}</div>`:'<p class="small mtop">لا توجد بيانات تواصل مسجّلة لمسؤول البرنامج حاليًا.</p>';
    contactHTML=`<p class="small mtop">البيانات المدخلة مش مطابقة للمسجّل. بما إن ده حساب رئيس اتحاد، تواصل مع <b>صاحب البرنامج</b> لاسترداد حسابك:</p>${contactHTML}`;
  }else{
    const d=loadBuildingData(t.buildingId);
    const admin=d.users.find(u=>u.role==='admin');
    contactHTML=admin?`<div class="mtop small">📱 ${esc(phoneFull(admin.phoneCountry,admin.phone))}</div>`:'<p class="small mtop">لا يوجد بيانات تواصل لرئيس الاتحاد حاليًا.</p>';
    contactHTML=`<p class="small mtop">البيانات المدخلة مش مطابقة للمسجّل. تواصل مع <b>رئيس اتحاد عمارتك</b> لاسترداد حسابك:</p>${contactHTML}`;
  }
  return `${contactHTML}<div class="login-hint mtop"><a href="javascript:void(0)" onclick="window.__recoveryStep=4;renderRoot()">حاول تاني</a> · <a href="javascript:void(0)" onclick="closeRecover()">العودة لتسجيل الدخول</a></div>`;
}
async function doContactPasswordReset(){
  const t=window.__recoveryTarget;
  const newPass=document.getElementById('rcNewPass').value;
  const pwErr=passwordPolicyError(newPass); if(pwErr)return showLoginError(pwErr);
  if(t.type==='sysowner'){REG.sysOwner.password=await hashPassword(newPass); saveRegistry();}
  else{const d=loadBuildingData(t.buildingId); const u=d.users.find(x=>x.id===t.userId); u.password=await hashPassword(newPass); saveBuildingData(t.buildingId,d);}
  window.__viewMode='login'; renderRoot(); try{history.pushState({viewMode:'login'},'',location.href);}catch(e){} toast('تم تغيير كلمة المرور، سجّل الدخول بالبيانات الجديدة');
}

function bindLogin(){
  if(window.__viewMode==='signup'){
    const form=document.getElementById('signupForm');
    if(form)form.addEventListener('submit',e=>{e.preventDefault();doSignup();});
    return;
  }
  if(window.__viewMode==='recover'){
    if(window.__recoveryStep===1){
      const go=()=>{
        const username=document.getElementById('rcUser').value.trim();
        if(!username)return showLoginError('أدخل اسم المستخدم');
        window.__recoveryMatches=findUserMatches(username);
        window.__recoveryStep=2; renderRoot();
      };
      document.getElementById('rcSearchBtn').onclick=go;
      document.getElementById('rcUser').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
    }else if(window.__recoveryStep===4){
      document.getElementById('rcVerifyBtn').onclick=doContactVerify;
    }else if(window.__recoveryStep===5){
      document.getElementById('rcContactResetBtn').onclick=doContactPasswordReset;
    }
    return;
  }
  const go=()=>{
    const username=document.getElementById('lgUser').value.trim();
    const password=document.getElementById('lgPass').value;
    if(!username||!password)return showLoginError('أدخل اسم المستخدم وكلمة المرور');
    const matches=findUserMatches(username);
    if(!matches.length)return showLoginError('اسم المستخدم أو كلمة المرور غير صحيحة');
    const sysMatch=matches.find(m=>m.type==='sysowner');
    if(sysMatch){loginSysOwner(username,password);return;}
    loginBuilding(matches[0].buildingId,username,password);
  };
  const form=document.getElementById('loginForm');
  if(form)form.addEventListener('submit',e=>{e.preventDefault();go();});
}

function pipelineStageFor(b){
  const lic=ensureLicense(b);
  const planDef=findPlan(lic.plan);
  const isFreePlan=!planDef||planDef.isTrial||planDef.priceBefore===0;
  const data=loadBuildingData(b.id);
  const hasUsage=data&&((data.ledger||[]).length>0||(data.expenses||[]).length>0);
  const daysLeft=lic.endDate?Math.ceil((new Date(lic.endDate)-new Date(todayISO()))/86400000):Infinity;
  if(lic.status==='suspended')return'suspended';
  if(lic.status==='expired'||(lic.endDate&&daysLeft<0))return'expired';
  if(isFreePlan){
    if(daysLeft<=3)return'trial_urgent';
    if(!hasUsage)return'trial_cold';
    return'trial_active';
  }
  if(lic.endDate&&daysLeft<=7)return'paid_renewal_due';
  return'paid_active';
}

function handleBuildingsFileUpload(input){

function validateBldImportRow(r){
  const name=String(r[0]||'').trim();
  const username=String(r[1]||'').trim();
  const pass=String(r[2]||'').trim();
  if(!name)return{ok:false,reason:'اسم العمارة مفقود'};
  if(!username)return{ok:false,reason:'اسم دخول الأدمن مفقود'};
  if(isUsernameTaken(username))return{ok:false,reason:'اسم الدخول ده محجوز بالفعل'};
  if(!pass||pass.length<8)return{ok:false,reason:'كلمة المرور لازم تكون 8 حروف على الأقل'};
  return{ok:true};

function ensureColState(orderKey,visKey,allCols){

function renderColumnCustomizerModal(){

  openModal(`<h3>ترتيب وإظهار الأعمدة</h3>

    <div class="mtop" style="max-height:360px;overflow-y:auto">${order.map((key,i)=>{
      const c=allCols.find(x=>x.key===key); if(!c)return'';
      const checked=window[visKey].includes(key);
      const w=widths?widths[key]:null;
      const wPx=typeof w==='number'?w:'';
      return `<div class="flexrow" style="padding:6px 0;border-bottom:1px solid var(--line)">
        <label class="checkline" style="flex:1"><input type="checkbox" onchange="toggleColVis('${key}',this.checked)" ${checked?'checked':''}> ${esc(c.label)}</label>
        ${widths?`<input type="number" min="40" max="800" step="5" placeholder="عرض تلقائي" value="${wPx}" onchange="setColWidth('${key}',this.value)" style="width:100px;padding:4px 8px;font-size:12px" title="عرض العمود بالبكسل">`:''}
        <button class="btn sm ghost" onclick="moveColOrder(${i},-1)" ${i===0?'disabled':''} title="لأعلى">⬆️</button>
        <button class="btn sm ghost" onclick="moveColOrder(${i},1)" ${i===order.length-1?'disabled':''} title="لأسفل">⬇️</button>
      </div>`;
    }).join('')}</div>
    <div class="modal-actions"><button class="btn primary" onclick="applyColCustomizer()">💾 حفظ</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`);

function setColWidth(key,val){
  const widthsKey=window.__colCtx.widthsKey; if(!widthsKey)return;
  if(!window[widthsKey])window[widthsKey]={};
  const n=Number(val);
  if(val&&n>0)window[widthsKey][key]=n; else delete window[widthsKey][key];
}
function moveColOrder(index,dir){
  const arr=window[window.__colCtx.orderKey];
  const ni=index+dir; if(ni<0||ni>=arr.length)return;
  [arr[index],arr[ni]]=[arr[ni],arr[index]];
  renderColumnCustomizerModal();
}
function toggleColVis(key,checked){
  const visKey=window.__colCtx.visKey;
  if(checked){if(!window[visKey].includes(key))window[visKey].push(key);}
  else{window[visKey]=window[visKey].filter(k=>k!==key);}
}
function applyColCustomizer(){
  if(!window[window.__colCtx.visKey].length)window[window.__colCtx.visKey]=[window.__colCtx.allCols[0].key];
  const onSave=window.__colCtx.onSave;
  closeModal();
  if(onSave)onSave(); else renderContent();
}

async function createBuilding(){
  const name=document.getElementById('nbName').value.trim();
  if(!name)return showMessage('أدخل اسم العمارة');
  const communityType=document.getElementById('nbCommunityType').value;
  const count=communityType==='compound'?0:Number(document.getElementById('nbCount').value||24);
  const perFloor=Number(document.getElementById('nbPerFloor').value||4);
  const groundCount=Math.max(1,Number(document.getElementById('nbGroundCount').value||4));
  const groundShops=Math.min(groundCount,Number(document.getElementById('nbGroundShops').value||0));
  const address=document.getElementById('nbAddress').value.trim();
  const locationUrl=document.getElementById('nbLocation').value.trim();
  const city=document.getElementById('nbCity').value.trim();
  const countrySel=document.getElementById('nbNationCountry').value;
  const country=countrySel==='أخرى'?document.getElementById('nbOtherCountry').value.trim():countrySel;
  const governorate=document.getElementById('nbGovernorate').value.trim();
  const au=document.getElementById('nbAdminUser').value.trim()||'admin';
  const ap=document.getElementById('nbAdminPass').value||'Admin@1234';
  const phoneCountry=document.getElementById('nbCountry').value;
  const phone=document.getElementById('nbPhone').value.trim();
  const email=document.getElementById('nbEmail').value.trim();
  const plan=document.getElementById('nbPlan').value;
  const rq=document.getElementById('nbRQ').value.trim();
  const ra=document.getElementById('nbRA').value.trim();
  if(!phone)return showMessage('رقم الهاتف مطلوب');
  if(!city)return showMessage('المدينة مطلوبة');
  if(!address)return showMessage('عنوان العمارة مطلوب');
  const pwErr=passwordPolicyError(ap); if(pwErr)return showMessage(pwErr);
  if(isUsernameTaken(au))return showMessage('اسم المستخدم ده مستخدم بالفعل، اختر اسمًا آخر');

  showCodeConfirmModal(name,code,au);
}

function deleteBuildingPrompt(id){
  const rec=REG.buildings.find(b=>b.id===id);
  confirmDelete(`سيتم نقل عمارة "${rec?rec.name:''}" إلى سلة المحذوفات. الحسابات هتتوقف عن الدخول فورًا، لكن تقدر تسترجعها من سلة المحذوفات في أي وقت، أو تحذفها نهائيًا من هناك.`,()=>{
    rec.deletedAt=new Date().toISOString();
    REG.deletedBuildings=REG.deletedBuildings||[];
    REG.deletedBuildings.push(rec);
    REG.buildings=REG.buildings.filter(b=>b.id!==id);
    saveRegistry();toast('تم نقل العمارة لسلة المحذوفات');renderSysContent();
  });

function restoreBuildingFromTrash(id){
  const rec=(REG.deletedBuildings||[]).find(b=>b.id===id); if(!rec)return;
  delete rec.deletedAt;
  REG.buildings.push(rec);
  REG.deletedBuildings=(REG.deletedBuildings||[]).filter(b=>b.id!==id);
  saveRegistry();toast('تم استعادة العمارة');renderSysContent();
}
function permanentlyDeleteBuildingPrompt(id){
  const rec=(REG.deletedBuildings||[]).find(b=>b.id===id); if(!rec)return;
  confirmDelete(`سيتم حذف عمارة "${rec.name}" وكل بياناتها (الشقق، الحركات، المستخدمين) نهائيًا من هذا الجهاز. لا يمكن التراجع عن هذا الإجراء إطلاقًا.`,()=>{
    REG.deletedBuildings=(REG.deletedBuildings||[]).filter(b=>b.id!==id);

  });
}
