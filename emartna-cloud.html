const APARTMENTS_IMPORT_COLUMNS=['رقم الوحدة','النوع (شقة/محل)','اسم المبنى أو الفيلا','الدور','المالك','المستأجر','الهاتف','البريد الإلكتروني','الاشتراك الشهري','الرصيد الافتتاحي'];
function downloadApartmentsTemplate(){
  if(typeof XLSX==='undefined')return showMessage('تعذر تحميل مكتبة إكسيل - تأكد من اتصالك بالإنترنت وحاول تاني.');
  const sample=[APARTMENTS_IMPORT_COLUMNS,['1','شقة',D.building.communityType==='compound'?'عمارة 1':'','الدور الأول','أحمد محمد','','01000000000','','500','0']];
  const ws=XLSX.utils.aoa_to_sheet(sample);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'الوحدات');
  XLSX.writeFile(wb,'نموذج استيراد الوحدات.xlsx');
}
function openImportApartmentsModal(){
  openModal(`<h3>📥 استيراد الوحدات من إكسيل</h3>
    <p class="small mtop">حمّل النموذج الفارغ، املأه ببيانات الوحدات، وارفعه هنا. الأعمدة المطلوبة: <b>رقم الوحدة</b> و<b>النوع</b> فقط، والباقي اختياري.</p>
    <button class="btn sm gold mtop" onclick="downloadApartmentsTemplate()">⬇️ تحميل نموذج فارغ</button>
    <div class="field2 mtop"><label>اختر ملف إكسيل (.xlsx)</label><input type="file" id="apImportFile" accept=".xlsx,.xls,.csv" onchange="handleApartmentsFileUpload(this)"></div>
    <div id="apImportPreview"></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`);
}
function handleApartmentsFileUpload(input){
  const file=input.files[0]; if(!file)return;
  if(typeof XLSX==='undefined')return showMessage('تعذر تحميل مكتبة إكسيل - تأكد من اتصالك بالإنترنت وحاول تاني.');
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      const dataRows=rows.slice(1).filter(r=>r.some(c=>String(c).trim()!==''));
      window.__apImportRows=dataRows;
      renderApImportPreview(dataRows);
    }catch(err){
      document.getElementById('apImportPreview').innerHTML=`<p class="small" style="color:var(--red)">تعذرت قراءة الملف: ${esc(err.message)}</p>`;
    }
  };
  reader.readAsArrayBuffer(file);
}
function validateApImportRow(r){
  const number=String(r[0]||'').trim();
  const typeRaw=String(r[1]||'').trim();
  if(!number)return{ok:false,reason:'رقم الوحدة مفقود'};
  if(!typeRaw||(!typeRaw.includes('شقة')&&!typeRaw.includes('محل')))return{ok:false,reason:'النوع لازم يكون "شقة" أو "محل"'};
  return{ok:true};
}
function renderApImportPreview(rows){
  const results=rows.map(r=>({row:r,check:validateApImportRow(r)}));
  const validCount=results.filter(x=>x.check.ok).length;
  const invalidCount=results.length-validCount;
  document.getElementById('apImportPreview').innerHTML=`
    <div class="mtop2"><b>${rows.length}</b> صف - <span style="color:var(--accent)">${validCount} صالح</span>${invalidCount?` - <span style="color:var(--red)">${invalidCount} فيه خطأ</span>`:''}</div>
    <div class="table-wrap mtop" style="max-height:300px;overflow-y:auto"><table><thead><tr><th></th>${APARTMENTS_IMPORT_COLUMNS.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${results.map(x=>`<tr>${x.check.ok?'<td>✅</td>':`<td title="${esc(x.check.reason)}">❌</td>`}${x.row.slice(0,10).map(c=>`<td class="small">${esc(String(c||''))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="flexrow mtop2"><button class="btn primary" ${validCount?'':'disabled'} onclick="confirmApartmentsImport()">✅ استيراد ${validCount} وحدة صالحة</button></div>`;
}
async function confirmApartmentsImport(){
  const rows=(window.__apImportRows||[]).filter(r=>validateApImportRow(r).ok);
  if(!rows.length)return;
  if(!enforceLicenseOrAlert('apartment'))return;
  const remaining=D.building?.license?.maxApartments?(D.building.license.maxApartments-D.apartments.length):Infinity;
  if(remaining!==Infinity&&rows.length>remaining){
    confirmAction(`عدد الوحدات في الملف (${rows.length}) أكبر من المتاح في باقة اشتراكك (${remaining} وحدة متبقية). هل تريد استيراد أول ${remaining} وحدة فقط؟`,()=>{
      rows.length=remaining;
      runApartmentsImport(rows);
    },'استيراد المسموح فقط');
    return;
  }
  await runApartmentsImport(rows);
}
async function runApartmentsImport(rows){
  const prefix=usernamePrefixFromCode((findBuildingRec(activeBuildingId)||{}).code||'');
  const existingUsernames=new Set(D.users.map(u=>u.username));
  const uniqueUsername=(base)=>{let u=base,n=1;while(existingUsernames.has(u)){u=base+n;n++;}existingUsernames.add(u);return u;};
  let imported=0;
  for(const r of rows){
    const number=String(r[0]).trim();
    const isShop=String(r[1]).includes('محل');
    const blockName=String(r[2]||'').trim();
    const floor=String(r[3]||'').trim()||floorLabel(Number(number)||1,D.building.groundFloorCount||4,D.building.apartmentsPerFloor||4);
    const ownerName=String(r[4]||'').trim()||(isShop?'صاحب محل ':'مالك شقة ')+number;
    const tenantName=String(r[5]||'').trim();
    const phone=String(r[6]||'').trim().replace(/\D/g,'');
    const email=String(r[7]||'').trim();
    const monthlyFee=Number(r[8])||0;
    const openingBalance=Number(r[9])||0;
    const newId=uid();
    const uname=uniqueUsername(prefix+(isShop?'mahal':'shaqa')+number.replace(/[^a-zA-Z0-9]/g,''));
    D.apartments.push({id:newId,number:Number(number)||imported+1,blockName,type:isShop?'shop':'apartment',usageType:isShop?'تجاري':'سكني',openingBalance,floor,ownerName,tenantName,phoneCountry:'+20',phone,email,monthlyFee,username:uname,notes:'مستوردة من إكسيل'});
    D.users.push({id:uid(),username:uname,password:await hashPassword('Shaqa@1234'),role:'owner',name:ownerName,phoneCountry:'+20',phone,email,apartmentId:newId,active:true});
    imported++;
  }
  D.building.apartmentsCount=D.apartments.length;
  logActivity('استيراد وحدات من إكسيل',imported+' وحدة');
  save();closeModal();toast(`تم استيراد ${imported} وحدة بنجاح`);renderContent();
}

async function addTenantAccount(apartmentId){

  D.users.push({id:uid(),username,password:await hashPassword(password),role:'tenant',name:a.tenantName,phoneCountry:a.phoneCountry,phone:a.phone,email:'',apartmentId,active:true});
  logActivity('إنشاء حساب مستأجر',a.tenantName+' - '+unitLabel(a));

async function saveApartment(id){
  const number=Number(document.getElementById('mNumber').value);
  const username=document.getElementById('mUser').value.trim();
  const ownerName=document.getElementById('mOwner').value.trim();
  const phone=document.getElementById('mPhone').value.trim();
  const fee=Number(document.getElementById('mFee').value||0);
  if(!number||!username||!ownerName)return showMessage('برجاء ملء رقم الوحدة واسم المالك واسم المستخدم');
  if(!phone)return showMessage('رقم الهاتف مطلوب');
  if(!id&&fee<=0)return showMessage('أدخل قيمة الاشتراك الشهري لهذه الوحدة');
  if(!id&&!enforceLicenseOrAlert('apartment'))return;
  const ownerUserId=id?(D.users.find(u=>u.apartmentId===id)||{}).id:null;
  if(isUsernameTaken(username,activeBuildingId,ownerUserId))return showMessage('اسم المستخدم هذا مستخدم بالفعل، اختر اسمًا آخر');
  const blockNameEl=document.getElementById('mBlockName');
  const data={number,blockName:blockNameEl?blockNameEl.value.trim():'',type:document.getElementById('mType').value,usageType:document.getElementById('mUsage').value,closed:document.getElementById('mClosed').checked,openingBalance:Number(document.getElementById('mOpeningBalance').value||0),floor:document.getElementById('mFloor').value.trim(),ownerName,tenantName:document.getElementById('mTenant').value.trim(),phoneCountry:document.getElementById('mCountry').value,phone,email:document.getElementById('mEmail').value.trim(),monthlyFee:fee,username,notes:document.getElementById('mNotes').value.trim()};
  const pass=document.getElementById('mPass').value;
  if(pass){const pwErr=passwordPolicyError(pass); if(pwErr)return showMessage(pwErr);}
  if(id){
    const a=D.apartments.find(x=>x.id===id);Object.assign(a,data);
    const user=D.users.find(u=>u.apartmentId===id);
    if(user){user.username=username;user.name=ownerName;user.phoneCountry=data.phoneCountry;user.phone=phone;user.email=data.email;if(pass)user.password=await hashPassword(pass);}
  }else{
    const newId='ap_'+uid();
    D.apartments.push({id:newId,...data});
    D.users.push({id:uid(),username,password:await hashPassword(pass||'Shaqa@1234'),role:'owner',name:ownerName,phoneCountry:data.phoneCountry,phone,email:data.email,apartmentId:newId,active:true});
    D.building.apartmentsCount=D.apartments.length;
  }
  save();closeModal();toast('تم الحفظ');renderContent();
}

/* ---------- نسب توزيع المصروفات المشتركة (حسب نوع/حالة الوحدة) ---------- */
function unitDistributionSignature(a){
  return`${a.type}|${a.usageType||'سكني'}|${a.closed?'closed':'open'}`;
}
function unitDistributionLabel(a){
  const typeLabel=a.type==='shop'?'محل':'شقة';
  const statusLabel=a.closed?'مقفولة':'مفتوحة';
  return`${typeLabel} ${esc(a.usageType||'سكني')} - ${statusLabel}`;
}
function ensureDistributionWeights(){
  D.building.distributionWeights=D.building.distributionWeights||{};
  return D.building.distributionWeights;
}
function distributionWeightFor(a){
  const weights=ensureDistributionWeights();
  const sig=unitDistributionSignature(a);
  return weights[sig]!==undefined?weights[sig]:1;
}
function pageDistributionWeights(){
  const weights=ensureDistributionWeights();
  const signatures={};
  D.apartments.forEach(a=>{
    const sig=unitDistributionSignature(a);
    if(!signatures[sig])signatures[sig]={label:unitDistributionLabel(a),count:0,sig};
    signatures[sig].count++;
  });
  const rows=Object.values(signatures).sort((a,b)=>a.label.localeCompare(b.label,'ar'));
  return`
  <p class="small">حدد نسبة/معامل كل نوع ووضع وحدة، تُستخدم عند إنشاء "توزيع نسبي" لمصروف مشترك. الوحدة اللي معاملها أعلى تاخد نصيب أكبر من المبلغ الإجمالي.</p>
  <div class="card content-narrow mtop2">
    ${rows.map(r=>`<div class="grid g2 mtop" style="align-items:center">
      <div>${esc(r.label)} <span class="small" style="color:var(--muted)">(${r.count} وحدة)</span></div>
      <input type="number" step="0.05" min="0" id="dw_${esc(r.sig)}" value="${weights[r.sig]!==undefined?weights[r.sig]:1}">
    </div>`).join('')}
    <button class="btn primary mtop2" onclick="saveDistributionWeights()">💾 حفظ النسب</button>
  </div>`;
}
function saveDistributionWeights(){
  const weights=ensureDistributionWeights();
  const signatures=new Set(D.apartments.map(a=>unitDistributionSignature(a)));
  signatures.forEach(sig=>{
    const el=document.getElementById('dw_'+sig);
    if(el)weights[sig]=Math.max(0,Number(el.value)||0);
  });
  save();toast('تم حفظ نسب التوزيع');
}
function openProportionalChargeModal(){
  openModal(`<h3>💰 توزيع نسبي لمصروف مشترك</h3>
    <p class="small">اكتب المبلغ الإجمالي، والنظام هيوزّعه على الوحدات حسب النسب اللي حددتها في "نسب توزيع المصروفات".</p>
    <div class="field2 mtop"><label>إجمالي المبلغ</label><input id="pdAmount" type="number" min="0" oninput="previewProportionalDistribution()"></div>
    <div class="field2"><label>البيان</label><input id="pdNote" placeholder="مثال: صيانة سنوية للواجهة"></div>
    <label class="checkline mtop"><input type="checkbox" id="pdExcludeClosed" onchange="previewProportionalDistribution()"> استبعاد الوحدات المقفولة تمامًا من التوزيع (بدل ما تاخد نسبة أقل، ماتاخدش نصيب خالص)</label>
    <div id="pdPreview" class="mtop"></div>
    <div class="modal-actions"><button class="btn primary" onclick="applyProportionalDistribution()">✅ تطبيق وتسجيل التحصيل</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`);
  previewProportionalDistribution();
}
function computeProportionalShares(totalAmount,excludeClosed){
  const units=D.apartments.filter(a=>!excludeClosed||!a.closed);
  const weighted=units.map(a=>({a,weight:distributionWeightFor(a)})).filter(x=>x.weight>0);
  const sumWeights=weighted.reduce((s,x)=>s+x.weight,0);
  if(sumWeights<=0)return[];
  let shares=weighted.map(x=>({a:x.a,weight:x.weight,amount:Math.round((x.weight/sumWeights)*totalAmount)}));
  // تصحيح فرق التقريب عشان مجموع الأنصبة يساوي المبلغ الإجمالي بالظبط
  const roundedSum=shares.reduce((s,x)=>s+x.amount,0);
  const diff=Math.round(totalAmount)-roundedSum;
  if(diff!==0&&shares.length){
    shares.sort((a,b)=>b.weight-a.weight);
    shares[0].amount+=diff;
  }
  return shares;
}
function previewProportionalDistribution(){
  const total=Number(document.getElementById('pdAmount').value||0);
  const excludeClosed=document.getElementById('pdExcludeClosed').checked;
  const shares=computeProportionalShares(total,excludeClosed);
  const el=document.getElementById('pdPreview');
  if(!total||!shares.length){el.innerHTML='<p class="small">أدخل مبلغ عشان تشوف معاينة التوزيع.</p>';return;}
  const sumCheck=shares.reduce((s,x)=>s+x.amount,0);
  const cols=[
    {key:'unit',label:'الوحدة',value:s=>s.a.number,cell:s=>unitLabel(s.a)},
    {key:'type',label:'النوع',value:s=>s.a.type==='shop'?1:0,cell:s=>s.a.type==='shop'?'<span class="badge y">🏪 محل</span>':'<span class="badge n">🏠 شقة</span>'},
    {key:'owner',label:'اسم صاحب الوحدة',value:s=>s.a.ownerName,cell:s=>esc(s.a.ownerName)},
    {key:'usage',label:'استخدام الوحدة',value:s=>s.a.usageType,cell:s=>esc(s.a.usageType||'-')},
    {key:'status',label:'الحالة',value:s=>s.a.closed?1:0,cell:s=>s.a.closed?'<span class="badge r">مقفولة</span>':'<span class="badge g">مفتوحة</span>'},
    {key:'weight',label:'المعامل',value:s=>s.weight,cell:s=>String(s.weight)},
    {key:'amount',label:'النصيب',value:s=>s.amount,cell:s=>money(s.amount)},
  ];
  el.innerHTML=`<p class="small">معاينة (${shares.length} وحدة، إجمالي الأنصبة: ${money(sumCheck)})</p>
  <div id="pdPreviewTableHost">${sortableTable('pdPreviewTable',shares,cols,null,{defaultKey:'unit',exportName:'معاينة التوزيع النسبي'})}</div>`;
}
function applyProportionalDistribution(){
  const total=Number(document.getElementById('pdAmount').value||0);
  if(!total||total<=0)return showMessage('أدخل مبلغ إجمالي صحيح');
  const note=document.getElementById('pdNote').value.trim()||'توزيع نسبي';
  const excludeClosed=document.getElementById('pdExcludeClosed').checked;
  const shares=computeProportionalShares(total,excludeClosed);
  if(!shares.length)return showMessage('مفيش وحدات لها نسبة توزيع أكبر من صفر');
  if(!enforceLicenseOrAlert('transaction'))return;
  shares.forEach(s=>{
    if(s.amount<=0)return;
    D.ledger.push({id:uid(),apartmentId:s.a.id,type:'مشروع',amount:s.amount,project:note,date:todayISO(),note:note+' (توزيع نسبي)',createdAt:new Date().toISOString()});
  });
  logActivity('توزيع نسبي لمصروف مشترك',note+' - إجمالي '+money(total)+' على '+shares.length+' وحدة');
  save();closeModal();toast('تم تسجيل التوزيع على '+shares.length+' وحدة');renderContent();
}

function toggleChargeType(){
  const t=document.getElementById('gType').value;
  document.getElementById('gMonthWrap').classList.toggle('hidden',t!=='شهري');
  document.getElementById('gProjectWrap').classList.toggle('hidden',t!=='مشروع');
}
function toggleAllApChecks(v){document.querySelectorAll('.apCheck').forEach(c=>c.checked=v)}
function applyDefaultAmountToAll(){
  const v=Number(document.getElementById('gDefaultAmount').value||0);
  document.querySelectorAll('.apAmount').forEach(inp=>{const cb=document.querySelector(`.apCheck[value="${inp.dataset.ap}"]`);if(cb&&cb.checked)inp.value=v;});
}
function notifyApartmentOwner(apId,title,message){
  const owner=D.users.find(u=>u.apartmentId===apId);
  if(owner)pushNotification({type:'ledger',title,message,audience:owner.username,link:'home'});
}
function generateCharges(){
  const type=document.getElementById('gType').value;
  const selected=[...document.querySelectorAll('.apCheck:checked')].map(c=>c.value);
  if(!selected.length)return showMessage('اختر شقة واحدة على الأقل');
  if(!enforceLicenseOrAlert('transaction'))return;
  let created=0,skipped=0;
  const amountFor=apId=>Number((document.querySelector(`.apAmount[data-ap="${apId}"]`)||{}).value||0);
  if(type==='شهري'){
    const month=document.getElementById('gMonth').value; if(!month)return showMessage('اختر الشهر');
    selected.forEach(apId=>{
      if(D.ledger.find(l=>l.apartmentId===apId&&l.type==='شهري'&&l.month===month)){skipped++;return}
      const amount=amountFor(apId); if(!amount)return;
      D.ledger.push({id:uid(),apartmentId:apId,type:'شهري',amount,month,date:todayISO(),note:'اشتراك شهر '+monthLabel(month),createdAt:new Date().toISOString()});
      notifyApartmentOwner(apId,'تحصيل جديد على شقتك','اشتراك شهر '+monthLabel(month)+' - '+money(amount));
      created++;
    });
  }else{
    const name=document.getElementById('gProjectName').value.trim();
    const date=document.getElementById('gProjectDate').value||todayISO();
    if(!name)return showMessage('أدخل اسم المشروع');
    const projectId=window.__chargeProjectId||null;
    selected.forEach(apId=>{
      const amount=amountFor(apId); if(!amount)return;
      D.ledger.push({id:uid(),apartmentId:apId,type:'مشروع',amount,project:name,projectId,date,note:name,createdAt:new Date().toISOString()});
      notifyApartmentOwner(apId,'تحصيل جديد على شقتك',name+' - '+money(amount));
      created++;
    });
  }
  save();closeModal();toast(`تم توليد ${created} سجل تحصيل${skipped?` (تم تخطي ${skipped} لوجودها مسبقًا)`:''}`);
  if(created){
    if(type==='شهري')logActivity('توليد تحصيل شهري','شهر '+monthLabel(document.getElementById('gMonth').value)+' - '+created+' شقة');
    else logActivity('توليد تحصيل مشروع',document.getElementById('gProjectName').value.trim()+' - '+created+' شقة');
  }
  renderContent();
}
function openPaymentModal(apId){

    <div class="field2"><label>المبلغ المدفوع</label><input id="pAmount" type="number" value="${apId?Math.max(0,apBalance(apId)):''}"></div>

function refreshPaymentProjectOptions(){
  const apId=document.getElementById('pAp').value;

function savePayment(){
  const apId=document.getElementById('pAp').value;
  const amount=Number(document.getElementById('pAmount').value||0);
  if(!amount||amount<=0)return showMessage('أدخل مبلغًا صحيحًا');
  if(!enforceLicenseOrAlert('transaction'))return;
  const projectId=document.getElementById('pProject').value||null;
  D.ledger.push({id:uid(),apartmentId:apId,type:'دفعة',amount,accountId:document.getElementById('pAccount').value,month:document.getElementById('pMonth').value||null,date:document.getElementById('pDate').value||todayISO(),note:document.getElementById('pNote').value.trim()||'دفعة',projectId,createdAt:new Date().toISOString()});

function deleteLedgerEntry(id){confirmDelete('حذف هذه الحركة المالية نهائيًا؟ يفضّل استخدام "عكس الحركة" بدلًا من الحذف للحفاظ على سجل مراجعة كامل.',()=>{logActivity('حذف حركة مالية',id);D.ledger=D.ledger.filter(l=>l.id!==id);save();toast('تم الحذف');renderContent();})}

/* ---------- المشاريع ---------- */
function projectCharges(pId,apId){return D.ledger.filter(l=>l.type==='مشروع'&&l.projectId===pId&&(!apId||l.apartmentId===apId)).reduce((s,l)=>s+Number(l.amount),0)}
function projectPayments(pId,apId){return D.ledger.filter(l=>l.type==='دفعة'&&l.projectId===pId&&(!apId||l.apartmentId===apId)).reduce((s,l)=>s+Number(l.amount),0)}
function projectBalance(pId,apId){return projectCharges(pId,apId)-projectPayments(pId,apId)}
function projectApartmentIds(pId){return[...new Set(D.ledger.filter(l=>l.type==='مشروع'&&l.projectId===pId).map(l=>l.apartmentId))]}
function projectExpenses(pId){return D.expenses.filter(e=>e.projectId===pId)}
function projectSpent(pId){return projectExpenses(pId).reduce((s,e)=>s+Number(e.amount),0)}
function projectStats(pId){
  const apIds=projectApartmentIds(pId);
  const totalRequired=projectCharges(pId);
  const totalCollected=projectPayments(pId);
  const paidCount=apIds.filter(id=>projectBalance(pId,id)<=0).length;
  const spent=projectSpent(pId);
  return{unitsCount:apIds.length,paidCount,remainingCount:apIds.length-paidCount,totalRequired,totalCollected,totalRemaining:totalRequired-totalCollected,spent,net:totalCollected-spent};
}

  const shown=window.__projectFilter==='all'?projects:projects.filter(p=>(p.status||'ongoing')===window.__projectFilter);

    {key:'x',label:'',value:null,cell:p=>`<button class="btn sm primary" onclick="viewProject('${p.id}')">عرض التفاصيل</button>`},

function openProjectModal(id){
  const p=id?D.projects.find(x=>x.id===id):null;

function saveProject(id){
  const name=document.getElementById('prjName').value.trim();
  if(!name)return showMessage('أدخل اسم المشروع');
  const description=document.getElementById('prjDesc').value.trim();
  if(id){
    const p=D.projects.find(x=>x.id===id); Object.assign(p,{name,description});
    save();closeModal();toast('تم الحفظ');renderContent();
  }else{
    D.projects.push({id:uid(),name,description,status:'active',createdAt:new Date().toISOString(),attachments:[]});
    save();closeModal();toast('تم إنشاء المشروع');

function setProjectStatus(id,status){const p=D.projects.find(x=>x.id===id);if(!p)return;p.status=status;save();toast('تم التحديث');renderContent()}
function deleteProject(id){
  confirmDelete('حذف هذا المشروع؟ الحركات المالية المرتبطة به هتفضل موجودة في السجل، بس هتفقد ربطها بالمشروع.',()=>{
    D.ledger.forEach(l=>{if(l.projectId===id)delete l.projectId});
    D.projects=D.projects.filter(x=>x.id!==id);
    window.__viewingProjectId=null;
    save();toast('تم الحذف');renderContent();
  });
}
function openGenerateChargeModalForProject(projectId){
  const p=D.projects.find(x=>x.id===projectId); if(!p)return;
  openGenerateChargeModal(p.name);
  window.__chargeProjectId=projectId;
}
function addProjectAttachment(projectId){
  const fileInput=document.getElementById('prjFile');
  const file=fileInput.files[0]; if(!file)return showMessage('اختر صورة أولًا');
  if(file.size>8*1024*1024)return showMessage('حجم الصورة كبير جدًا (أكبر من 8 ميجا)');
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const maxW=1920;
      const scale=Math.min(1,maxW/img.width);
      const canvas=document.createElement('canvas');
      canvas.width=img.width*scale; canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      const compressed=canvas.toDataURL('image/jpeg',0.85);
      const p=D.projects.find(x=>x.id===projectId);
      p.attachments=p.attachments||[];
      p.attachments.push({id:uid(),name:file.name,dataUrl:compressed,uploadedAt:new Date().toISOString()});
      save();toast('تم إضافة المرفق');renderContent();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function addExpenseAttachment(expenseId){
  const fileInput=document.getElementById('eAddFile');
  const file=fileInput.files[0]; if(!file)return showMessage('اختر صورة أولًا');

  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const maxW=1920;
      const scale=Math.min(1,maxW/img.width);
      const canvas=document.createElement('canvas');
      canvas.width=img.width*scale; canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      const compressed=canvas.toDataURL('image/jpeg',0.85);
      const e=D.expenses.find(x=>x.id===expenseId);
      e.attachments=e.attachments||[];
      e.attachments.push({id:uid(),name:file.name,dataUrl:compressed,uploadedAt:new Date().toISOString()});

function openAccountStatement(accountId){
  const acc=D.accounts.find(a=>a.id===accountId); if(!acc)return;
  const moves=[
    ...D.ledger.filter(l=>l.type==='دفعة'&&l.accountId===accountId).map(l=>{const ap=D.apartments.find(a=>a.id===l.apartmentId);return{date:l.date,type:'تحصيل من '+(ap?unitLabel(ap):'-'),amount:l.amount,note:l.note,dir:1};}),
    ...D.ledger.filter(l=>l.type==='صرف'&&l.accountId===accountId).map(l=>{const ap=D.apartments.find(a=>a.id===l.apartmentId);return{date:l.date,type:'صرف/استرداد لـ'+(ap?unitLabel(ap):'-'),amount:l.amount,note:l.note,dir:-1};}),
    ...D.expenses.filter(e=>e.accountId===accountId).map(e=>({date:e.date,type:'مصروف: '+e.category,amount:e.amount,note:e.description,dir:-1})),
    ...D.transfers.filter(t=>t.from===accountId).map(t=>({date:t.date,type:'تحويل صادر',amount:t.amount,note:t.note,dir:-1})),
    ...D.transfers.filter(t=>t.to===accountId).map(t=>({date:t.date,type:'تحويل وارد',amount:t.amount,note:t.note,dir:1})),
  ].sort((a,b)=>(a.date||'').localeCompare(b.date||'')); // ترتيب تصاعدي عشان نحسب الرصيد المتراكم صح
  let running=acc.opening||0;
  const withBalance=moves.map(m=>{running+=m.dir*m.amount;return{...m,balance:running};}).reverse(); // نعرضهم من الأحدث للأقدم
  window.__acctStatementId=accountId;
  openModal(`<h3>كشف حساب: ${esc(acc.name)}</h3>
    <p class="small">الرصيد الحالي: <b>${money(accountBalance(accountId))}</b> - عدد الحركات: ${moves.length}</p>
    <div class="mtop">${sortableTable('acctStatementTable',withBalance,[
      {key:'date',label:'التاريخ',value:m=>m.date||'',cell:m=>esc(m.date||'')},
      {key:'type',label:'النوع',value:m=>m.type,cell:m=>esc(m.type)},
      {key:'note',label:'البيان',value:m=>m.note||'',cell:m=>esc(m.note||'')},
      {key:'amount',label:'المبلغ',value:m=>m.dir*m.amount,cell:m=>`<span style="color:${m.dir>0?'var(--accent)':'var(--red)'}">${m.dir>0?'+':'-'}${money(m.amount)}</span>`},
      {key:'balance',label:'الرصيد بعدها',value:m=>m.balance,cell:m=>money(m.balance)},
    ],null,{emptyText:'لا توجد حركات على هذا الحساب بعد',exportName:'كشف حساب '+acc.name})}</div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">إغلاق</button></div>`);
}

function saveAccount(id){
  const name=document.getElementById('acName').value.trim(); if(!name)return showMessage('أدخل اسم الحساب');

function saveTransfer(){
  const from=document.getElementById('tFrom').value, to=document.getElementById('tTo').value;
  const amount=Number(document.getElementById('tAmount').value||0);
  if(from===to)return showMessage('اختر حسابين مختلفين');
  if(!amount||amount<=0)return showMessage('أدخل مبلغًا صحيحًا');
  D.transfers.push({id:uid(),from,to,amount,date:document.getElementById('tDate').value||todayISO(),note:document.getElementById('tNote').value.trim()});
  logActivity('تحويل بين الحسابات',accName(from)+' ← '+accName(to)+' - '+money(amount));
  save();closeModal();toast('تم التحويل');renderContent();
}

function saveRefund(){
  const apId=document.getElementById('rAp').value;

  D.ledger.push({id:uid(),apartmentId:apId,type:'صرف',amount,accountId:document.getElementById('rAccount').value,date:document.getElementById('rDate').value||todayISO(),note:document.getElementById('rNote').value.trim()||'استرداد',createdAt:new Date().toISOString()});

  logActivity('صرف/استرداد',(ap?unitLabel(ap):'')+' - '+money(amount));
  save();closeModal();toast('تم تسجيل الصرف');renderContent();
}

function saveExpense(){
  const amount=Number(document.getElementById('eAmount').value||0); if(!amount)return showMessage('أدخل قيمة المصروف');
  if(!enforceLicenseOrAlert('transaction'))return;
  const category=document.getElementById('eCat').value;
  const fixedProjectEl=document.getElementById('eProjectFixed');
  const projectSelectEl=document.getElementById('eProject');
  const projectId=fixedProjectEl?fixedProjectEl.value:(projectSelectEl?projectSelectEl.value||null:null);
  const attachments=window.__expImageData?[{id:uid(),name:'مرفق 1',dataUrl:window.__expImageData,uploadedAt:new Date().toISOString()}]:[];
  D.expenses.push({id:uid(),date:document.getElementById('eDate').value||todayISO(),category,amount,accountId:document.getElementById('eAccount').value,description:document.getElementById('eDesc').value.trim(),projectId,attachments});
  window.__expImageData=null;
  logActivity('إضافة مصروف',category+' - '+money(amount));
  save();closeModal();toast('تم إضافة المصروف');
  pushNotification({type:'expense',title:'مصروف جديد',message:category+' - '+money(amount),audience:'all',link:'expenses'});
  if(projectId){curPage='projects';window.__viewingProjectId=projectId;}
  renderContent();
}

function saveExpenseEdit(id){
  const e=D.expenses.find(x=>x.id===id); if(!e)return;
  const amount=Number(document.getElementById('eeAmount').value||0); if(!amount)return showMessage('أدخل مبلغًا صحيحًا');
  e.category=document.getElementById('eeCat').value; e.amount=amount; e.date=document.getElementById('eeDate').value||e.date;
  e.accountId=document.getElementById('eeAccount').value; e.description=document.getElementById('eeDesc').value.trim();
  e.projectId=document.getElementById('eeProject').value||null;
  logActivity('تعديل مصروف',`${e.category} - ${money(e.amount)}`);
  save();toast('تم حفظ التعديل');closeModal();renderContent();
}
function reverseExpense(id){
  const e=D.expenses.find(x=>x.id===id); if(!e)return;
  openModal(`
    <h3>عكس المصروف</h3>
    <p class="small">هيتم إنشاء مصروف عكسي بقيمة سالبة (${money(e.amount)}-) يُلغي أثر هذا المصروف على رصيد الخزينة، بدون حذف السجل الأصلي.</p>
    <div class="field2 mtop"><label>تاريخ الحركة العكسية</label>
      <select id="rvExpDateMode" onchange="document.getElementById('rvExpCustomDateWrap').classList.toggle('hidden',this.value!=='custom')">
        <option value="same">نفس تاريخ المصروف الأصلي (${esc(e.date||'')})</option>
        <option value="today" selected>تاريخ اليوم (${todayISO()})</option>
        <option value="custom">تاريخ محدد</option>
      </select>
    </div>
    <div class="field2 hidden" id="rvExpCustomDateWrap"><label>التاريخ</label><input id="rvExpCustomDate" type="date" value="${todayISO()}"></div>
    <div class="modal-actions mtop"><button class="btn primary" onclick="doReverseExpense('${e.id}')">✅ تأكيد عكس المصروف</button><button class="btn ghost" onclick="openExpenseDetail('${e.id}')">إلغاء</button></div>`);
}
function doReverseExpense(id){
  const e=D.expenses.find(x=>x.id===id); if(!e)return;
  const dateMode=document.getElementById('rvExpDateMode').value;
  const date=dateMode==='same'?(e.date||todayISO()):dateMode==='custom'?document.getElementById('rvExpCustomDate').value:todayISO();
  D.expenses.push({id:uid(),date,category:e.category,amount:-Math.abs(e.amount),accountId:e.accountId,description:'عكس مصروف: '+(e.description||e.category),reversalOf:e.id});
  logActivity('عكس مصروف',`${e.category} - ${money(e.amount)}`);
  save();toast('تم إنشاء مصروف عكسي');closeModal();renderContent();
}
function printExpenseEntry(id){
  const e=D.expenses.find(x=>x.id===id); if(!e)return;
  const acc=e.accountId?D.accounts.find(a=>a.id===e.accountId):null;
  printReceipt('إيصال مصروف - '+(D.building.name||''),[
    ['البند',e.category],['المبلغ',money(e.amount)],['التاريخ',e.date||''],['الحساب',acc?acc.name:'-'],['الوصف',e.description||'-']
  ]);
}

/* ---------- استطلاعات الرأي (مع تعليقات) ---------- */
function pagePolls(u){
  const isAdmin=u.role==='admin';
  const polls=[...D.polls].sort((x,y)=>(y.createdAt||'').localeCompare(x.createdAt||''));
  if(window.__pollFilter===undefined)window.__pollFilter='open';
  const counts={all:polls.length,open:polls.filter(p=>p.status==='open').length,closed:polls.filter(p=>p.status==='closed').length};
  const shown=window.__pollFilter==='all'?polls:polls.filter(p=>p.status===window.__pollFilter);
  const filterBtn=(key,label)=>`<button class="btn sm ${window.__pollFilter===key?'primary':'ghost'}" onclick="setPollFilter('${key}')">${label} (${counts[key]})</button>`;
  return `
  ${isAdmin?`<div class="flexrow"><button class="btn primary" onclick="openPollModal()">+ إنشاء استطلاع رأي جديد</button></div>`:''}
  <div class="flexrow mtop">
    ${filterBtn('open','🟢 مفتوحة')}
    ${filterBtn('closed','مغلقة')}
    ${filterBtn('all','الكل')}
  </div>
  <div class="grid g2 mtop">${shown.length?shown.map(p=>pollCardHTML(p,u,isAdmin)).join(''):`<p class="small">${window.__pollFilter==='open'?'لا توجد استطلاعات مفتوحة حاليًا':window.__pollFilter==='closed'?'لا توجد استطلاعات مغلقة':'لا توجد استطلاعات رأي حتى الآن'}</p>`}</div>`;
}
function setPollFilter(key){window.__pollFilter=key;renderContent()}
function pollTotalVotes(p){return Object.keys(p.votes||{}).length}
function visibleComments(comments,u,isAdmin){return (comments||[]).filter(c=>isAdmin||c.visibility!=='private'||c.username===u.username)}
function pollCardHTML(p,u,isAdmin){
  const myVote=p.votes&&p.votes[u.username];
  const total=pollTotalVotes(p);
  const showResults=isAdmin||p.status==='closed'||myVote!==undefined||p.showResultsBeforeClose;
  const counts=p.options.map((_,i)=>Object.values(p.votes||{}).filter(v=>v===i).length);
  const comments=visibleComments(p.comments,u,isAdmin);
  return `<div class="card">
    <div class="flexrow"><h3 style="flex:1">${esc(p.title)}</h3>${p.status==='open'?'<span class="badge g">مفتوح</span>':'<span class="badge n">مغلق</span>'}</div>
    ${p.proposedAmount?`<p class="small mtop"><span class="badge y">💰 استطلاع دفع - المبلغ المقترح لكل وحدة: ${money(p.proposedAmount)}</span></p>`:''}
    <p class="small mtop">${esc(p.description||'')}</p>
    <div class="mtop">
    ${p.status==='open'&&!isAdmin&&myVote===undefined?
      p.options.map((op,i)=>`<div class="poll-opt" onclick="votePoll('${p.id}',${i})">${esc(op)}</div>`).join('')
      : showResults ? p.options.map((op,i)=>{const pct=total?Math.round(counts[i]/total*100):0;return `<div class="poll-bar-row"><div class="flexrow"><span>${esc(op)}${myVote===i?' ✅':''}</span><span class="spacer"></span><b>${pct}% (${counts[i]})</b></div><div class="poll-bar-track"><div class="poll-bar-fill" style="width:${pct}%"></div></div></div>`;}).join('')+`<p class="small mtop">إجمالي المصوّتين: ${total} شقة</p>`
      : `<p class="small">صوّت أولاً لرؤية النتائج، أو انتظر إغلاق الاستطلاع.</p>`}
    </div>
    ${isAdmin?`<div class="flexrow mtop"><button class="btn sm" onclick="openPollModal(null,null,null,'${p.id}')">✏️ تعديل</button><button class="btn sm ${p.status==='open'?'red':'primary'}" onclick="togglePollStatus('${p.id}')">${p.status==='open'?'إغلاق الاستطلاع':'إعادة فتح'}</button>${p.status==='closed'?`<button class="btn sm gold" onclick="openGenerateChargeModal('${esc(p.title).replace(/'/g,"\\'")}'${p.proposedAmount?','+p.proposedAmount:''})">🧾 ${p.proposedAmount?'توزيع المبلغ على الشقق':'إنشاء تحصيل مشروع لهذا القرار'}</button>`:''}<button class="btn sm ghost" onclick="deletePoll('${p.id}')">حذف</button></div>`:''}
    <div class="section-title" style="margin:16px 0 6px"><h3 style="font-size:13px">التعليقات (${comments.length})</h3></div>
    <div>${comments.length?comments.map(c=>`<div class="comment-item">${esc(c.text)}<div class="comment-meta">${c.visibility==='private'?'🔒 خاص بالإدارة - ':''}${esc(c.authorLabel||'')} • ${esc(c.date)} ${(isAdmin||c.username===u.username)?`<span style="cursor:pointer;color:var(--red)" onclick="deletePollComment('${p.id}','${c.id}')"> · حذف</span>`:''}</div></div>`).join(''):'<p class="small">لا توجد تعليقات</p>'}</div>
    <div class="flexrow mtop"><input id="pc_${p.id}" class="search-box" style="flex:1" placeholder="أضف تعليقًا...">
      ${!isAdmin?`<select id="pcv_${p.id}" style="padding:8px;border:1.5px solid var(--line);border-radius:9px"><option value="public">عام (يراه الجميع)</option><option value="private">خاص (للإدارة فقط)</option></select>`:''}
      <button class="btn sm primary" onclick="addPollComment('${p.id}')">إرسال</button></div>
  </div>`;
}
function openPollModal(prefillTitle,prefillDesc,fromSuggestionId,editId){
  const p=editId?D.polls.find(x=>x.id===editId):null;
  openModal(`
    <h3>${p?'تعديل استطلاع رأي':'إنشاء استطلاع رأي'}</h3>
    ${fromSuggestionId?`<input type="hidden" id="poFromSuggestion" value="${fromSuggestionId}">`:''}
    ${p?`<input type="hidden" id="poEditId" value="${p.id}">`:''}
    <div class="field2"><label>عنوان الاستطلاع</label><input id="poTitle" placeholder="مثال: هل نوافق على تركيب كاميرات مراقبة؟" value="${esc(p?p.title:(prefillTitle||''))}"></div>
    <div class="field2"><label>وصف مختصر (اختياري)</label><textarea id="poDesc">${esc(p?(p.description||''):(prefillDesc||''))}</textarea></div>
    <div class="field2"><label>خيارات التصويت</label>
      <div id="poOptions">${p?p.options.map((o,i)=>`<input class="poOpt ${i?'mtop':''}" placeholder="خيار ${i+1}" value="${esc(o)}">`).join(''):`<input class="poOpt mtop" placeholder="خيار 1" value="نعم"><input class="poOpt mtop" placeholder="خيار 2" value="لا">`}</div>
      <button class="btn sm ghost mtop" onclick="addPollOption()">+ إضافة خيار</button>
    </div>
    <label class="checkline"><input type="checkbox" id="poShow" ${(!p||p.showResultsBeforeClose)?'checked':''}> إظهار النتائج الحية لكل الملاك قبل إغلاق الاستطلاع</label>
    <label class="checkline"><input type="checkbox" id="poIsPayment" ${p&&p.proposedAmount?'checked':''} onchange="document.getElementById('poAmountWrap').classList.toggle('hidden',!this.checked)"> ده استطلاع على دفع مبلغ معيّن (زي إصلاح أو مشروع)</label>
    <div class="field2 ${p&&p.proposedAmount?'':'hidden'}" id="poAmountWrap"><label>المبلغ المطلوب من كل وحدة</label><input id="poAmount" type="number" min="0" placeholder="مثال: 500" value="${p&&p.proposedAmount?p.proposedAmount:''}"></div>
    ${p?`<p class="small mtop" style="color:var(--gold-dark)">⚠️ أي تعديل جوهري (زي المبلغ أو العنوان) هيتبعت تنبيه فوري لكل السكان يوضح القيمة القديمة والجديدة.</p>`:''}
    <div class="modal-actions"><button class="btn primary" onclick="savePoll()">✅ ${p?'حفظ التعديلات':'نشر الاستطلاع'}</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`);
}
function addPollOption(){const d=document.getElementById('poOptions');const i=document.createElement('input');i.className='poOpt mtop';i.placeholder='خيار جديد';d.appendChild(i)}
function savePoll(){
  const title=document.getElementById('poTitle').value.trim();
  const options=[...document.querySelectorAll('.poOpt')].map(i=>i.value.trim()).filter(Boolean);
  if(!title||options.length<2)return showMessage('أدخل عنوانًا وخيارين على الأقل');
  const isPayment=document.getElementById('poIsPayment').checked;
  const proposedAmount=isPayment?Number(document.getElementById('poAmount').value||0):null;
  if(isPayment&&!proposedAmount)return showMessage('أدخل المبلغ المطلوب من كل وحدة');
  const editEl=document.getElementById('poEditId');
  const description=document.getElementById('poDesc').value.trim();
  if(editEl){
    const p=D.polls.find(x=>x.id===editEl.value); if(!p)return;
    const oldSnapshot={title:p.title,description:p.description,proposedAmount:p.proposedAmount,options:p.options.join('، ')};
    const newSnapshot={title,description,proposedAmount,options:options.join('، ')};
    Object.assign(p,{title,description,options,proposedAmount,showResultsBeforeClose:document.getElementById('poShow').checked});
    save();closeModal();toast('تم حفظ التعديلات');
    const changes=buildChangeSummary(oldSnapshot,newSnapshot,{title:'العنوان',description:'الوصف',proposedAmount:'المبلغ',options:'الخيارات'});
    if(changes.length)pushNotification({type:'poll',title:'⚠️ تم تعديل استطلاع الرأي',message:title+' - '+changes.join(' | '),audience:'all',link:'polls'});
    logActivity('تعديل استطلاع رأي',title);
    renderContent();
    return;
  }
  const fromSuggestionEl=document.getElementById('poFromSuggestion');
  D.polls.push({id:uid(),title,description,options,votes:{},status:'open',showResultsBeforeClose:document.getElementById('poShow').checked,createdAt:new Date().toISOString(),comments:[],fromSuggestionId:fromSuggestionEl?fromSuggestionEl.value:null,proposedAmount});
  pushChatEvent('poll','🗳️','استطلاع رأي جديد',title+(proposedAmount?' - المبلغ المقترح: '+money(proposedAmount):''),'polls');
  save();closeModal();toast('تم نشر الاستطلاع');
  pushNotification({type:'poll',title:'استطلاع رأي جديد',message:title+(proposedAmount?' - المبلغ المقترح: '+money(proposedAmount):''),audience:'all',link:'polls'});
  renderContent();
}
function votePoll(pollId,optIdx){
  const u=currentUser(); const p=D.polls.find(x=>x.id===pollId); if(!p||p.status!=='open')return;
  confirmAction('تأكيد التصويت لهذا الخيار؟ لا يمكن التغيير بعد ذلك.',()=>{
    p.votes=p.votes||{}; p.votes[u.username]=optIdx; save();toast('تم تسجيل صوتك');renderContent();
  },'تأكيد التصويت');
}
function togglePollStatus(id){const p=D.polls.find(x=>x.id===id);p.status=p.status==='open'?'closed':'open';save();renderContent()}
function deletePoll(id){confirmDelete('حذف هذا الاستطلاع وكل الأصوات والتعليقات عليه نهائيًا؟',()=>{D.polls=D.polls.filter(p=>p.id!==id);save();toast('تم الحذف');renderContent();})}
function addPollComment(pollId){
  const u=currentUser(); const p=D.polls.find(x=>x.id===pollId);
  const input=document.getElementById('pc_'+pollId); const text=input.value.trim(); if(!text)return;
  const visSel=document.getElementById('pcv_'+pollId);
  const visibility=u.role==='admin'?'public':(visSel?visSel.value:'public');
  const ap=myApartment();
  const authorLabel=u.role==='admin'?'رئيس الاتحاد':(ap?unitLabel(ap):u.name);
  p.comments=p.comments||[]; p.comments.push({id:uid(),username:u.username,text,visibility,authorLabel,date:todayISO()});
  save();toast('تم إضافة التعليق');renderContent();
}
function deletePollComment(pollId,cId){const p=D.polls.find(x=>x.id===pollId);p.comments=p.comments.filter(c=>c.id!==cId);save();renderContent()}

/* ---------- الإعلانات (مع تعليقات عامة) ---------- */
function pageAnnouncements(u){
  const isAdmin=u.role==='admin';
  const items=[...D.announcements].sort((x,y)=>(y.date||'').localeCompare(x.date||''));
  return `
  ${isAdmin?`<div class="flexrow"><button class="btn primary" onclick="openAnnModal()">+ إعلان جديد</button></div>`:''}
  <div class="grid g2 mtop">${items.length?items.map(a=>announcementCardHTML(a,u,isAdmin)).join(''):'<p class="small">لا توجد إعلانات حاليًا</p>'}</div>`;
}
function announcementCardHTML(a,u,isAdmin){
  const comments=a.comments||[];
  return `<div class="card">
    <div class="flexrow"><h3 style="flex:1">${esc(a.title)}</h3><span class="small">${esc(a.date)}</span></div>
    <p class="small mtop" style="white-space:pre-wrap">${esc(a.body)}</p>
    ${isAdmin?`<div class="flexrow mtop"><button class="btn sm" onclick="openAnnModal('${a.id}')">✏️ تعديل</button><button class="btn sm red" onclick="deleteAnn('${a.id}')">حذف الإعلان</button></div>`:''}
    <div class="section-title" style="margin:14px 0 6px"><h3 style="font-size:13px">التعليقات (${comments.length})</h3></div>
    <div>${comments.length?comments.map(c=>`<div class="comment-item">${esc(c.text)}<div class="comment-meta">${esc(c.authorLabel||'')} • ${esc(c.date)} ${(isAdmin||c.username===u.username)?`<span style="cursor:pointer;color:var(--red)" onclick="deleteAnnComment('${a.id}','${c.id}')"> · حذف</span>`:''}</div></div>`).join(''):'<p class="small">لا توجد تعليقات</p>'}</div>
    <div class="flexrow mtop"><input id="ac_${a.id}" class="search-box" style="flex:1" placeholder="أضف تعليقًا..."><button class="btn sm primary" onclick="addAnnComment('${a.id}')">إرسال</button></div>
  </div>`;
}
function openAnnModal(id){
  const a=id?D.announcements.find(x=>x.id===id):null;
  openModal(`<h3>${a?'تعديل إعلان':'إعلان جديد'}</h3>
    ${a?`<input type="hidden" id="anEditId" value="${a.id}">`:''}
    <div class="field2"><label>العنوان</label><input id="anTitle" value="${a?esc(a.title):''}"></div>
    <div class="field2"><label>التاريخ</label><input id="anDate" type="date" value="${a?a.date:todayISO()}"></div>
    <div class="field2"><label>النص</label><textarea id="anBody" style="min-height:100px">${a?esc(a.body):''}</textarea></div>
    ${a?`<p class="small mtop" style="color:var(--gold-dark)">⚠️ أي تعديل هيتبعت تنبيه فوري لكل السكان يوضح التغيير.</p>`:''}
    <div class="modal-actions"><button class="btn primary" onclick="saveAnn()">${a?'حفظ التعديلات':'نشر'}</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`);
}
function saveAnn(){
  const title=document.getElementById('anTitle').value.trim(); const body=document.getElementById('anBody').value.trim();
  if(!title||!body)return showMessage('أدخل العنوان والنص');
  const date=document.getElementById('anDate').value||todayISO();
  const editEl=document.getElementById('anEditId');
  if(editEl){
    const a=D.announcements.find(x=>x.id===editEl.value); if(!a)return;
    const oldSnapshot={title:a.title,body:a.body};
    Object.assign(a,{title,body,date});
    save();closeModal();toast('تم حفظ التعديلات');
    const changes=buildChangeSummary(oldSnapshot,{title,body},{title:'العنوان',body:'النص'});
    if(changes.length)pushNotification({type:'announcement',title:'⚠️ تم تعديل إعلان',message:title+' - '+changes.join(' | '),audience:'all',link:'announcements'});
    logActivity('تعديل إعلان',title);
    renderContent();
    return;
  }
  D.announcements.push({id:uid(),title,body,date,comments:[]});
  pushChatEvent('announcement','📢','إعلان جديد',title,'announcements');
  save();closeModal();toast('تم النشر');
  pushNotification({type:'announcement',title:'إعلان جديد',message:title,audience:'all',link:'announcements'});
  renderContent();
}
function deleteAnn(id){confirmDelete('حذف هذا الإعلان وكل التعليقات عليه نهائيًا؟',()=>{D.announcements=D.announcements.filter(a=>a.id!==id);save();renderContent();})}
function addAnnComment(annId){
  const u=currentUser(); const a=D.announcements.find(x=>x.id===annId);
  const input=document.getElementById('ac_'+annId); const text=input.value.trim(); if(!text)return;
  const ap=myApartment(); const authorLabel=u.role==='admin'?'رئيس الاتحاد':(ap?unitLabel(ap):u.name);
  a.comments=a.comments||[]; a.comments.push({id:uid(),username:u.username,text,authorLabel,date:todayISO()});
  save();toast('تم إضافة التعليق');renderContent();
}
function deleteAnnComment(annId,cId){const a=D.announcements.find(x=>x.id===annId);a.comments=a.comments.filter(c=>c.id!==cId);save();renderContent()}

/* ---------- المقترحات (تحتاج موافقة رئيس الاتحاد قبل النشر العام) ---------- */
function pageSuggestions(u){
  const isAdmin=u.role==='admin';
  const all=[...D.suggestions].sort((x,y)=>(y.date||'').localeCompare(x.date||''));
  if(isAdmin){
    if(window.__suggFilter===undefined)window.__suggFilter='pending';
    const counts={all:all.length,pending:all.filter(s=>s.status==='pending').length,approved:all.filter(s=>s.status==='approved').length,rejected:all.filter(s=>s.status==='rejected').length};
    const shown=window.__suggFilter==='all'?all:all.filter(s=>s.status===window.__suggFilter);
    const filterBtn=(key,label)=>`<button class="btn sm ${window.__suggFilter===key?'primary':'ghost'}" onclick="setSuggFilter('${key}')">${label} (${counts[key]})</button>`;
    const statusBadge=s=>s.status==='pending'?'<span class="badge y">بانتظار المراجعة</span>':s.status==='approved'?'<span class="badge g">معتمد</span>':'<span class="badge r">مرفوض</span>';
    const cols=[
      {key:'title',label:'العنوان',value:s=>s.title,cell:s=>`<b>${esc(s.title)}</b>`},
      {key:'text',label:'النص',value:s=>s.text,cell:s=>esc((s.text||'').slice(0,60))+((s.text||'').length>60?'…':'')},
      {key:'author',label:'من',value:s=>s.authorLabel,cell:s=>esc(s.authorLabel||'')},
      {key:'date',label:'التاريخ',value:s=>s.date,cell:s=>esc(s.date||'')},
      {key:'status',label:'الحالة',value:s=>s.status,cell:statusBadge},
      {key:'x',label:'',value:null,cell:s=>{
        const linkedPoll=(D.polls||[]).find(p=>p.fromSuggestionId===s.id);
        return `<div class="flexrow">
          ${s.status==='pending'?`<button class="btn sm primary" onclick="approveSuggestion('${s.id}')">✅ موافقة</button><button class="btn sm ghost" onclick="rejectSuggestion('${s.id}')">رفض</button>`:''}
          ${s.status==='approved'&&!linkedPoll?`<button class="btn sm gold" onclick="openPollModal('${esc(s.title).replace(/'/g,"\\'")}','${esc(s.text).replace(/'/g,"\\'")}','${s.id}')">🗳️ استطلاع</button>`:''}
          <button class="btn sm red" onclick="confirmDelete('حذف هذا المقترح نهائيًا؟',()=>{D.suggestions=D.suggestions.filter(x=>x.id!=='${s.id}');save();toast('تم الحذف');renderContent();})">حذف</button>
        </div>`;
      }},
    ];
    return `
    <div class="flexrow">
      ${filterBtn('pending','⏳ بانتظار المراجعة')}
      ${filterBtn('approved','معتمد')}
      ${filterBtn('rejected','مرفوض')}
      ${filterBtn('all','الكل')}

  }
  const approved=all.filter(s=>s.status==='approved');
  const mine=all.filter(s=>s.username===u.username&&s.status!=='approved');

}
function setSuggFilter(key){window.__suggFilter=key;renderContent()}
function suggestionCardHTML(s,u,isAdmin){
  const statusBadge=s.status==='pending'?'<span class="badge y">بانتظار المراجعة</span>':s.status==='approved'?'<span class="badge g">معتمد</span>':'<span class="badge r">مرفوض</span>';

  return `<div class="card">
    <div class="flexrow"><h3 style="flex:1">${esc(s.title)}</h3>${statusBadge}</div>

    <p class="small" style="color:var(--muted)">من: ${esc(s.authorLabel)} • ${esc(s.date)}</p>
    ${s.adminNote?`<p class="small" style="color:var(--gold-dark)"><b>ملاحظة الإدارة:</b> ${esc(s.adminNote)}</p>`:''}
    ${linkedPoll?`<p class="small" style="color:var(--accent-dark)">🗳️ فيه استطلاع رأي منشور على المقترح ده بالفعل</p>`:''}
    ${isAdmin?`<div class="flexrow mtop">
      ${s.status==='pending'?`<button class="btn sm primary" onclick="approveSuggestion('${s.id}')">✅ موافقة ونشر</button><button class="btn sm ghost" onclick="rejectSuggestion('${s.id}')">رفض</button>`:''}
      ${s.status==='approved'&&!linkedPoll?`<button class="btn sm gold" onclick="openPollModal('${esc(s.title).replace(/'/g,"\\'")}','${esc(s.text).replace(/'/g,"\\'")}','${s.id}')">🗳️ إنشاء استطلاع رأي على المقترح</button>`:''}
      <button class="btn sm red" onclick="confirmDelete('حذف هذا المقترح نهائيًا؟',()=>{D.suggestions=D.suggestions.filter(x=>x.id!=='${s.id}');save();toast('تم الحذف');renderContent();})">حذف</button>
    </div>`:''}
  </div>`;
}
function openSuggestionModal(){
  openModal(`
    <h3>إضافة مقترح جديد</h3>
    <div class="field2"><label>عنوان المقترح</label><input id="sgTitle" placeholder="مثال: تخصيص مكان لانتظار الدراجات"></div>
    <div class="field2"><label>التفاصيل</label><textarea id="sgText" style="min-height:100px"></textarea></div>
    <p class="small">هيتم إرسال المقترح لرئيس الاتحاد للمراجعة، وبعد الموافقة هيظهر لكل الملاك في شاشة المقترحات.</p>
    <div class="modal-actions"><button class="btn primary" onclick="submitSuggestion()">إرسال للمراجعة</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`);
}
function submitSuggestion(){
  const title=document.getElementById('sgTitle').value.trim();
  const text=document.getElementById('sgText').value.trim();
  if(!title||!text)return showMessage('أدخل العنوان والتفاصيل');
  const u=currentUser(); const ap=myApartment();
  const authorLabel=ap?unitLabel(ap)+' - '+u.name:u.name;
  D.suggestions.push({id:uid(),title,text,username:u.username,authorLabel,status:'pending',date:todayISO(),adminNote:''});
  save();closeModal();toast('تم إرسال المقترح للمراجعة');
  pushNotification({type:'suggestion',title:'مقترح جديد بانتظار المراجعة',message:title,audience:'admins',link:'suggestions'});
  renderContent();
}
function approveSuggestion(id){
  const s=D.suggestions.find(x=>x.id===id); if(!s)return;
  s.status='approved'; logActivity('اعتماد مقترح',s.title); save(); toast('تم اعتماد المقترح ونشره');
  pushNotification({type:'suggestion',title:'تمت الموافقة على مقترحك',message:s.title,audience:s.username,link:'suggestions'});
  renderContent();
}
function rejectSuggestion(id){
  const s=D.suggestions.find(x=>x.id===id); if(!s)return;
  promptModal('سبب الرفض','اختياري','',(note)=>{
    s.status='rejected'; s.adminNote=note||''; logActivity('رفض مقترح',s.title); save(); toast('تم رفض المقترح');
    pushNotification({type:'suggestion',title:'تم رفض مقترحك',message:s.title,audience:s.username,link:'suggestions'});
    renderContent();
  },'رفض المقترح');
}

/* ---------- الاجتماعات مع أصحاب الشقق ---------- */
function pageMeetings(u){
  const isAdmin=u.role==='admin';
  const meetings=[...(D.meetings||[])].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const upcoming=meetings.filter(m=>m.status==='scheduled');
  const past=meetings.filter(m=>m.status!=='scheduled');

  ${isAdmin?`<div class="flexrow"><button class="btn primary" onclick="openMeetingModal()">+ تحديد اجتماع جديد</button></div>`:''}

  <div class="grid g2 mtop">${upcoming.length?upcoming.map(m=>meetingCardHTML(m,u,isAdmin)).join(''):'<p class="small">لا توجد اجتماعات مجدولة حاليًا</p>'}</div>
  <div class="section-title"><h3>الاجتماعات السابقة</h3></div>
  <div class="grid g2 mtop">${past.length?past.map(m=>meetingCardHTML(m,u,isAdmin)).join(''):'<p class="small">لا توجد اجتماعات سابقة</p>'}</div>`;

function meetingCardHTML(m,u,isAdmin){
  const statusBadge=m.status==='scheduled'?'<span class="badge g">قادم</span>':m.status==='completed'?'<span class="badge n">تم الانعقاد</span>':'<span class="badge r">ملغى</span>';
  const comments=visibleComments(m.comments,u,isAdmin);
  return `<div class="card">
    <div class="flexrow"><h3 style="flex:1">${esc(m.title)}</h3>${statusBadge}</div>
    <p class="small mtop">📅 ${esc(m.date)} - ⏰ ${esc(m.time)}</p>
    <p class="small">📍 ${esc(m.location)}</p>
    ${m.agenda?`<p class="small mtop">${esc(m.agenda)}</p>`:''}
    ${m.outcomes?`<div class="card mtop" style="background:var(--tint-success)"><b class="small">✅ ما تم الاتفاق عليه:</b><p class="small mtop" style="white-space:pre-wrap">${esc(m.outcomes)}</p></div>`:''}
    ${isAdmin?`<div class="flexrow mtop">
      ${m.status==='scheduled'?`<button class="btn sm" onclick="openMeetingModal('${m.id}')">تعديل</button><button class="btn sm primary" onclick="openMeetingOutcomeModal('${m.id}')">✅ تسجيل ما تم الاتفاق عليه</button><button class="btn sm ghost" onclick="cancelMeeting('${m.id}')">إلغاء الاجتماع</button>`:''}
      <button class="btn sm red" onclick="confirmDelete('حذف هذا الاجتماع نهائيًا؟',()=>{D.meetings=D.meetings.filter(x=>x.id!=='${m.id}');save();toast('تم الحذف');renderContent();})">حذف</button>
    </div>`:''}
    <div class="section-title" style="margin:16px 0 6px"><h3 style="font-size:13px">التعليقات (${comments.length})</h3></div>
    <div>${comments.length?comments.map(c=>`<div class="comment-item">${esc(c.text)}<div class="comment-meta">${esc(c.authorLabel||'')} • ${esc(c.date)} ${(isAdmin||c.username===u.username)?`<span style="cursor:pointer;color:var(--red)" onclick="deleteMeetingComment('${m.id}','${c.id}')"> · حذف</span>`:''}</div></div>`).join(''):'<p class="small">لا توجد تعليقات</p>'}</div>
    <div class="flexrow mtop"><input id="mc_${m.id}" class="search-box" style="flex:1" placeholder="أضف تعليقًا أو سؤالًا...">
      <button class="btn sm primary" onclick="addMeetingComment('${m.id}')">إرسال</button></div>
  </div>`;
}
function openMeetingModal(id){
  const m=id?D.meetings.find(x=>x.id===id):null;
  openModal(`
    <h3>${m?'تعديل اجتماع':'تحديد اجتماع جديد'}</h3>
    <div class="field2"><label>موضوع المناقشة</label><input id="mtTitle" placeholder="مثال: مناقشة صيانة المصعد" value="${m?esc(m.title):''}"></div>
    <div class="grid g2">
      <div class="field2"><label>التاريخ</label><input id="mtDate" type="date" value="${m?m.date:todayISO()}"></div>
      <div class="field2"><label>الوقت</label><input id="mtTime" type="time" value="${m?m.time:'19:00'}"></div>
    </div>
    <div class="field2"><label>المكان بالضبط</label><input id="mtLocation" placeholder="مثال: مدخل العمارة / سطح العمارة" value="${m?esc(m.location):''}"></div>
    <div class="field2"><label>تفاصيل إضافية عن جدول الأعمال (اختياري)</label><textarea id="mtAgenda">${m?esc(m.agenda||''):''}</textarea></div>
    <div class="modal-actions"><button class="btn primary" onclick="saveMeeting(${m?`'${m.id}'`:'null'})">✅ ${m?'حفظ التعديلات':'نشر الاجتماع'}</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`);
}
function saveMeeting(id){
  const title=document.getElementById('mtTitle').value.trim();
  const date=document.getElementById('mtDate').value;
  const time=document.getElementById('mtTime').value;
  const location=document.getElementById('mtLocation').value.trim();
  const agenda=document.getElementById('mtAgenda').value.trim();
  if(!title||!date||!time||!location)return showMessage('برجاء ملء موضوع المناقشة والتاريخ والوقت والمكان');
  if(id){
    const m=D.meetings.find(x=>x.id===id);
    const oldSnapshot={title:m.title,date:m.date,time:m.time,location:m.location,agenda:m.agenda};
    Object.assign(m,{title,date,time,location,agenda});
    save();closeModal();toast('تم حفظ التعديلات');
    const changes=buildChangeSummary(oldSnapshot,{title,date,time,location,agenda},{title:'الموضوع',date:'التاريخ',time:'الوقت',location:'المكان',agenda:'التفاصيل'});
    if(changes.length)pushNotification({type:'meeting',title:'⚠️ تم تعديل موعد اجتماع',message:title+' - '+changes.join(' | '),audience:'all',link:'meetings'});
    logActivity('تعديل اجتماع',title);
  }else{
    D.meetings.push({id:uid(),title,date,time,location,agenda,status:'scheduled',outcomes:'',createdAt:new Date().toISOString(),comments:[],remindedAt:null});
    pushChatEvent('meeting','🗓️','اجتماع جديد',title+' - '+date+' الساعة '+time+' في '+location,'meetings');
    save();closeModal();toast('تم نشر الاجتماع');
    pushNotification({type:'meeting',title:'اجتماع جديد مع رئيس الاتحاد',message:title+' - '+date+' الساعة '+time+' في '+location,audience:'all',link:'meetings'});
    logActivity('تحديد اجتماع',title);
  }
  renderContent();
}
function openMeetingOutcomeModal(id){
  const m=D.meetings.find(x=>x.id===id); if(!m)return;
  openModal(`
    <h3>تسجيل ما تم الاتفاق عليه</h3>
    <p class="small">اجتماع: ${esc(m.title)} - ${esc(m.date)}</p>
    <div class="field2 mtop"><label>ملخص ما تم مناقشته والاتفاق عليه</label><textarea id="mtOutcomes" style="min-height:120px">${esc(m.outcomes||'')}</textarea></div>
    <div class="modal-actions"><button class="btn primary" onclick="saveMeetingOutcome('${m.id}')">✅ حفظ ونشر للسكان</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`);
}
function saveMeetingOutcome(id){
  const m=D.meetings.find(x=>x.id===id); if(!m)return;
  const outcomes=document.getElementById('mtOutcomes').value.trim();
  if(!outcomes)return showMessage('اكتب ملخص ما تم الاتفاق عليه');
  m.outcomes=outcomes; m.status='completed';
  logActivity('تسجيل نتيجة اجتماع',m.title);
  save();closeModal();toast('تم الحفظ والنشر');
  pushNotification({type:'meeting',title:'نتيجة اجتماع: '+m.title,message:outcomes.slice(0,100),audience:'all',link:'meetings'});
  renderContent();
}
function cancelMeeting(id){
  const m=D.meetings.find(x=>x.id===id); if(!m)return;
  confirmDelete(`سيتم إلغاء اجتماع "${m.title}" وإبلاغ كل السكان بالإلغاء.`,()=>{
    m.status='cancelled';
    save();toast('تم إلغاء الاجتماع');
    pushNotification({type:'meeting',title:'تم إلغاء اجتماع',message:m.title+' - '+m.date,audience:'all',link:'meetings'});
    renderContent();
  });
}
function addMeetingComment(meetingId){
  const inp=document.getElementById('mc_'+meetingId);
  const text=inp.value.trim(); if(!text)return;
  const u=currentUser(); const ap=myApartment();
  const authorLabel=u.role==='admin'?'رئيس الاتحاد':(ap?unitLabel(ap):u.name);
  const m=D.meetings.find(x=>x.id===meetingId);
  m.comments=m.comments||[];
  m.comments.push({id:uid(),text,username:u.username,authorLabel,date:todayISO()});
  save();inp.value='';renderContent();
  if(u.role!=='admin')pushNotification({type:'meeting',title:'تعليق جديد على اجتماع',message:m.title,audience:'admins',link:'meetings'});
}
function deleteMeetingComment(meetingId,cId){const m=D.meetings.find(x=>x.id===meetingId);m.comments=m.comments.filter(c=>c.id!==cId);save();renderContent()}
/* ---------- طلبات دفع من أصحاب الشقق (بإثبات صورة) ---------- */
function pagePaymentRequests(u){
  const isAdmin=u.role==='admin';
  if(isAdmin){
    const all=[...(D.paymentRequests||[])].sort((a,b)=>(b.requestedAt||'').localeCompare(a.requestedAt||''));
    if(window.__payReqFilter===undefined)window.__payReqFilter='pending';
    const pendingCount=all.filter(r=>r.status==='pending').length;
    const approvedCount=all.filter(r=>r.status==='approved').length;
    const rejectedCount=all.filter(r=>r.status==='rejected').length;
    const shown=window.__payReqFilter==='all'?all:all.filter(r=>r.status===window.__payReqFilter);
    const filterBtn=(key,label,count)=>`<button class="btn sm ${window.__payReqFilter===key?'primary':'ghost'}" onclick="setPayReqFilter('${key}')">${label} (${count})</button>`;
    const cols=[
      {key:'who',label:'مقدّم الطلب',value:r=>{const ap=D.apartments.find(a=>a.id===r.apartmentId);return ap?unitLabel(ap)+' - '+(ap.ownerName||''):r.username;},cell:r=>{const ap=D.apartments.find(a=>a.id===r.apartmentId);return esc(ap?unitLabel(ap)+' - '+(ap.ownerName||''):r.username);}},
      {key:'for',label:'نوع الدفعة',value:r=>paymentForLabel(r),cell:r=>esc(paymentForLabel(r))},
      {key:'amount',label:'المبلغ',value:r=>r.amount,cell:r=>money(r.amount)},
      {key:'date',label:'تاريخ الطلب',value:r=>r.requestedAt,cell:r=>esc(new Date(r.requestedAt).toLocaleString('ar-EG'))},
      {key:'status',label:'الحالة',value:r=>r.status,cell:r=>r.status==='pending'?'<span class="badge y">بانتظار المراجعة</span>':r.status==='approved'?'<span class="badge g">تم القبول</span>':'<span class="badge r">مرفوض</span>'},
      {key:'proof',label:'الإثبات',value:null,cell:r=>r.imageDataUrl?`<img src="${r.imageDataUrl}" style="width:50px;height:50px;object-fit:cover;border-radius:6px;cursor:pointer" onclick="viewPaymentRequestImage('${r.id}')">`:'-'},
      {key:'x',label:'',value:null,cell:r=>r.status==='pending'?`<div class="flexrow"><button class="btn sm primary" onclick="approvePaymentRequest('${r.id}')">✅ قبول</button><button class="btn sm ghost" onclick="rejectPaymentRequest('${r.id}')">رفض</button></div>`:(r.reviewNote?`<span class="small">${esc(r.reviewNote)}</span>`:'')},
    ];
    return `
    <div class="flexrow">
      ${filterBtn('pending','⏳ بانتظار المراجعة',pendingCount)}
      ${filterBtn('approved','✅ مقبولة',approvedCount)}
      ${filterBtn('rejected','❌ مرفوضة',rejectedCount)}
      ${filterBtn('all','الكل',all.length)}
    </div>
    <div class="mtop">${sortableTable('payReqTable',shown,cols,null,{defaultKey:'date',emptyText:'لا توجد طلبات مطابقة',exportName:'طلبات الدفع'})}</div>`;
  }
  const ap=myApartment();
  if(!ap)return'<p class="small">لا يوجد وحدة مرتبطة بحسابك</p>';
  const mine=[...(D.paymentRequests||[])].filter(r=>r.apartmentId===ap.id).sort((a,b)=>(b.requestedAt||'').localeCompare(a.requestedAt||''));
  const pendingReq=mine.find(r=>r.status==='pending');
  return `
  <div class="card content-narrow">
    <h3>تسجيل دفعة</h3>
    <p class="small mtop">رصيدك الحالي: ${(()=>{const bal=apBalance(ap.id);return bal>0?`<span class="badge r">مستحق عليك ${money(bal)}</span>`:bal<0?`<span class="badge g">رصيدك دائن ${money(-bal)}</span>`:'<span class="badge n">صفر</span>';})()}</p>
    ${pendingReq?`<p class="small mtop" style="color:var(--gold-dark)">⏳ عندك طلب دفعة بانتظار المراجعة (${money(pendingReq.amount)} - ${esc(new Date(pendingReq.requestedAt).toLocaleString('ar-EG'))})</p>`
    :`<button class="btn primary mtop" onclick="openSubmitPaymentModal()">💸 تسجيل دفعة جديدة</button>`}
  </div>
  ${mine.length?`<div class="section-title"><h3 style="font-size:13.5px">دفعاتي السابقة</h3></div>
  <div>${mine.map(r=>paymentRequestCardHTML(r,false)).join('')}</div>`:''}`;
}
function setPayReqFilter(key){window.__payReqFilter=key;renderContent()}

function viewPaymentRequestImage(id){

    </select></div>
    <div class="field2 hidden" id="prProjectWrap"><label>اسم المشروع</label><input id="prProjectName" placeholder="مثال: تجديد المصعد"></div>

function syncPaymentAmountDefault(){

  document.getElementById('prProjectWrap').classList.toggle('hidden',forVal!=='project');

function submitPaymentRequest(){
  const ap=myApartment(); if(!ap)return;
  const paymentFor=document.getElementById('prFor').value;
  const projectName=paymentFor==='project'?document.getElementById('prProjectName').value.trim():'';
  const amount=Number(document.getElementById('prAmount').value||0);
  const note=document.getElementById('prNote').value.trim();
  if(!amount||amount<=0)return showMessage('أدخل المبلغ');
  if(paymentFor==='project'&&!projectName)return showMessage('أدخل اسم المشروع');
  if(!window.__prImageData)return showMessage('أرفق صورة إثبات التحويل أولًا');
  const u=currentUser();
  D.paymentRequests=D.paymentRequests||[];
  D.paymentRequests.push({id:uid(),apartmentId:ap.id,username:u.username,paymentFor,projectName,amount,imageDataUrl:window.__prImageData,note,status:'pending',requestedAt:new Date().toISOString()});
  window.__prImageData=null;
  save();closeModal();toast('تم إرسال الدفعة للمراجعة');
  pushNotification({type:'payment',title:'طلب دفعة جديد',message:`${unitLabel(ap)} - ${money(amount)} - ${paymentForLabel({paymentFor,projectName})}`,audience:'admins',link:'paymentRequests'});
  renderContent();
}
function approvePaymentRequest(id){
  const r=(D.paymentRequests||[]).find(x=>x.id===id); if(!r)return;
  if(!enforceLicenseOrAlert('transaction'))return;
  const ap=D.apartments.find(a=>a.id===r.apartmentId);
  openModal(`<h3>تأكيد قبول الدفعة</h3>
    <p class="small">${ap?unitLabel(ap)+' - '+esc(ap.ownerName):''} - المبلغ: <b>${money(r.amount)}</b></p>
    <div class="field2 mtop"><label>الحساب المستلم للمبلغ</label><select id="prAccount">${D.accounts.map(a=>`<option value="${a.id}">${esc(a.name)} (${a.type})</option>`).join('')}</select></div>
    <div class="modal-actions"><button class="btn primary" onclick="doApprovePaymentRequest('${r.id}')">✅ تأكيد وتسجيل الدفعة</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`);
}
function doApprovePaymentRequest(id){
  const r=(D.paymentRequests||[]).find(x=>x.id===id); if(!r)return;
  const ap=D.apartments.find(a=>a.id===r.apartmentId);
  const noteText=(r.paymentFor==='project'?'دفعة مشروع: '+r.projectName:r.paymentFor==='balance'?'سداد رصيد مستحق':'دفعة عامة')+(r.note?' - '+r.note:'');
  D.ledger.push({id:uid(),apartmentId:r.apartmentId,type:'دفعة',amount:r.amount,accountId:document.getElementById('prAccount').value,note:noteText,date:todayISO(),fromPaymentRequestId:r.id,createdAt:new Date().toISOString()});
  r.status='approved'; r.reviewedAt=new Date().toISOString();
  logActivity('قبول طلب دفعة',(ap?unitLabel(ap):'')+' - '+money(r.amount));
  save();closeModal();toast('تم قبول الدفعة وتسجيلها');
  pushNotification({type:'payment',title:'تم قبول دفعتك',message:money(r.amount)+' - '+paymentForLabel(r),audience:r.username,link:'paymentRequests'});
  renderContent();
}
function rejectPaymentRequest(id){
  const r=(D.paymentRequests||[]).find(x=>x.id===id); if(!r)return;
  promptModal('سبب الرفض','هيظهر لصاحب الشقة','',(note)=>{
    r.status='rejected'; r.reviewNote=note||''; r.reviewedAt=new Date().toISOString();
    save();toast('تم رفض الطلب');
    pushNotification({type:'payment',title:'تم رفض طلب الدفعة',message:note||'راجع صفحة تسجيل دفعة للتفاصيل',audience:r.username,link:'paymentRequests'});
    renderContent();
  },'رفض الطلب');
}

function checkMeetingReminders(){
  const today=todayISO();
  let changed=false;
  (D.meetings||[]).forEach(m=>{
    if(m.status!=='scheduled')return;
    if(m.date!==today)return;
    if(m.remindedAt===today)return;
    pushNotification({type:'meeting',title:'تذكير: اجتماع اليوم',message:m.title+' الساعة '+m.time+' في '+m.location,audience:'all',link:'meetings'});
    m.remindedAt=today; changed=true;
  });
  if(changed)saveActive();
}

function renderPermCheckboxesFor(role,perms){
  const groups=role==='admin'?ADMIN_PERMISSION_GROUPS:OWNER_PERMISSION_GROUPS;
  return groups.map(g=>`<label class="checkline"><input type="checkbox" class="uPermCheck" data-key="${g.key}" ${perms[g.key]!==false?'checked':''}> ${esc(g.label)}</label>`).join('');
}
function refreshPermCheckboxes(){
  const list=document.getElementById('uPermsCheckList'); if(!list)return;
  const roleSel=document.getElementById('uRole');
  const role=roleSel?roleSel.value:'admin';
  list.innerHTML=renderPermCheckboxesFor(role,{});
}
function applyPermTemplate(){
  const key=document.getElementById('uPermTemplate').value; if(!key)return;
  const t=PERMISSION_ROLE_TEMPLATES.find(x=>x.key===key); if(!t)return;
  const roleSel=document.getElementById('uRole');
  if(roleSel&&!roleSel.disabled)roleSel.value=t.role;
  const list=document.getElementById('uPermsCheckList');
  if(list){
    const perms=t.groups===null?{}:{};
    const groups=t.role==='admin'?ADMIN_PERMISSION_GROUPS:OWNER_PERMISSION_GROUPS;
    if(t.groups!==null)groups.forEach(g=>{perms[g.key]=t.groups.includes(g.key);});
    list.innerHTML=renderPermCheckboxesFor(t.role,perms);
  }
}
async function saveUser(id){
  const editorUnrestricted=!currentUser().permissions;
  const existingTarget=id?D.users.find(x=>x.id===id):null;
  const isSelfSave=existingTarget&&existingTarget.id===currentUser().id;
  if(!editorUnrestricted&&!existingTarget)return showMessage('بس رئيس الاتحاد الأساسي يقدر يضيف مستخدم مسؤول جديد');
  if(!editorUnrestricted&&existingTarget&&existingTarget.role==='admin'&&!isSelfSave)return showMessage('بس رئيس الاتحاد الأساسي يقدر يعدّل حساب مسؤول تاني');
  const name=document.getElementById('uName').value.trim(); if(!name)return showMessage('أدخل الاسم');
  const phone=document.getElementById('uPhone').value.trim();
  if(!phone)return showMessage('رقم الهاتف مطلوب');
  const pass=document.getElementById('uPass').value;
  if(pass){const pwErr=passwordPolicyError(pass); if(pwErr)return showMessage(pwErr);}
  const active=document.getElementById('uActive').checked;
  const phoneCountry=document.getElementById('uCountry').value;
  const email=document.getElementById('uEmail').value.trim();
  const permsBox=document.getElementById('uPermsBox');
  let newPerms=null;
  if(permsBox){
    const checks=[...document.querySelectorAll('.uPermCheck')];
    const allChecked=checks.every(c=>c.checked);
    newPerms=allChecked?null:Object.fromEntries(checks.map(c=>[c.dataset.key,c.checked]));
  }
  if(id){
    const u=D.users.find(x=>x.id===id);
    const roleSel=document.getElementById('uRole');
    if(roleSel){
      const newRole=roleSel.value;
      if(u.role!=='admin'&&newRole==='admin'&&!editorUnrestricted)return showMessage('بس رئيس الاتحاد الأساسي يقدر يرقّي مستخدم لرئيس اتحاد إضافي');
      if(u.role==='admin'&&newRole==='owner'){
        const activeAdmins=D.users.filter(x=>x.role==='admin'&&x.active!==false);
        if(activeAdmins.length<=1)return showMessage('لا يمكن تحويل آخر حساب رئيس اتحاد نشط إلى مالك شقة عادي');
      }
      if(u.role!==newRole)logActivity('تغيير صلاحية',`${u.username}: ${u.role} → ${newRole}`);
      u.role=newRole;
    }
    u.name=name;u.phoneCountry=phoneCountry;u.phone=phone;u.email=email;u.active=active;
    if(permsBox)u.permissions=newPerms;
    if(pass)u.password=await hashPassword(pass);
  }else{
    const username=document.getElementById('uUser').value.trim();
    if(!username)return showMessage('أدخل اسم المستخدم');
    if(isUsernameTaken(username))return showMessage('اسم المستخدم مستخدم بالفعل');
    D.users.push({id:uid(),username,password:await hashPassword(pass||'Admin@1234'),role:'admin',name,phoneCountry,phone,email,apartmentId:null,active,permissions:newPerms});
    logActivity('إضافة مستخدم مسؤول',username);
  }
  save();closeModal();toast('تم الحفظ');renderContent();
}
function deleteUser(id){
  const admins=D.users.filter(u=>u.role==='admin');
  const u=D.users.find(x=>x.id===id);
  if(u.role==='admin'&&admins.length<=1)return showMessage('لا يمكن حذف آخر حساب رئيس اتحاد');
  confirmDelete(`حذف حساب "${u.username}" نهائيًا؟`,()=>{
    logActivity('حذف مستخدم',u.username);
    D.users=D.users.filter(x=>x.id!==id);save();toast('تم الحذف');renderContent();
  });
}

async function testAIConnection(scope){
  const provider=document.getElementById('aiProvider').value;
  const key=document.getElementById(provider==='gemini'?'aiGeminiKey':provider==='openai'?'aiOpenaiKey':'aiClaudeKey').value.trim();
  const box=document.getElementById('aiTestResult');
  if(!key){box.innerHTML='<p class="small" style="color:var(--red)">أدخل مفتاح API الخاص بـ'+providerLabel(provider)+' أولًا</p>';return;}
  box.innerHTML='<p class="small">⏳ جارِ اختبار الاتصال بـ'+providerLabel(provider)+'...</p>';
  try{
    const result=await callAIProvider(provider,key,'من فضلك رد بكلمة واحدة فقط: تم');
    box.innerHTML='<p class="small" style="color:var(--accent-dark)">✅ الاتصال ناجح! رد '+providerLabel(provider)+': "'+esc(result.trim().slice(0,80))+'"</p>';
  }catch(e){

  }

async function callAIProvider(provider,key,prompt){
  if(provider==='gemini'){
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(key)}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})
    });
    const j=await res.json();
    if(!res.ok)throw new Error((j.error&&j.error.message)||'خطأ من Gemini');
    return(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts[0]&&j.candidates[0].content.parts[0].text)||'لا يوجد رد';
  }
  if(provider==='openai'){
    const res=await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'user',content:prompt}]})
    });
    const j=await res.json();
    if(!res.ok)throw new Error((j.error&&j.error.message)||'خطأ من ChatGPT');
    return(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'لا يوجد رد';
  }
  if(provider==='claude'){
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:2000,messages:[{role:'user',content:prompt}]})
    });
    const j=await res.json();
    if(!res.ok)throw new Error((j.error&&j.error.message)||'خطأ من Claude');
    return(j.content&&j.content[0]&&j.content[0].text)||'لا يوجد رد';
  }
  throw new Error('مزود غير معروف');
}

function buildAIReportData(fromDate,toDate){
  const inRange=d=>!d||((!fromDate||d>=fromDate)&&(!toDate||d<=toDate));
  const ledgerInRange=D.ledger.filter(l=>inRange(l.date));
  const expensesInRange=D.expenses.filter(e=>inRange(e.date));
  const collected=ledgerInRange.filter(l=>l.type==='دفعة').reduce((s,l)=>s+Number(l.amount),0);
  const spent=expensesInRange.reduce((s,e)=>s+Number(e.amount),0);
  const month=curMonth();
  return{
    اسم_العمارة:D.building.name,
    المدينة:D.building.city||'',
    الفترة_المطلوبة:`من ${fromDate||'البداية'} إلى ${toDate||'اليوم'}`,
    إجمالي_الوحدات:D.apartments.length,
    عدد_الشقق:D.apartments.filter(a=>a.type!=='shop').length,
    عدد_المحلات:D.apartments.filter(a=>a.type==='shop').length,
    المحصل_خلال_الفترة:collected,
    المصروفات_خلال_الفترة:spent,
    رصيد_الخزينة_الحالي:totalTreasury(),
    الشقق_المتأخرة_حاليًا:D.apartments.filter(a=>apBalance(a.id)>0).map(a=>({الوحدة:unitLabel(a),المالك:a.ownerName,المستحق:apBalance(a.id)})),
    المصروفات_حسب_البند_خلال_الفترة:D.expenseCategories.reduce((o,c)=>{o[c]=expensesInRange.filter(e=>e.category===c).reduce((s,e)=>s+Number(e.amount),0);return o},{}),
    تفاصيل_مصروفات_الفترة:expensesInRange.map(e=>({البند:e.category,المبلغ:e.amount,التاريخ:e.date,الوصف:e.description})),
    تفاصيل_تحصيل_الفترة:ledgerInRange.map(l=>({النوع:l.type,المبلغ:l.amount,التاريخ:l.date,ملاحظة:l.note})),
    الشهر_الحالي:monthLabel(month),
    شقق_سددت_الشهر_الحالي:D.apartments.filter(a=>apPaidForMonth(a.id,month)===true).length,
    شقق_لم_تسدد_الشهر_الحالي:D.apartments.filter(a=>apPaidForMonth(a.id,month)===false).length
  };
}

}
function buildSysAIReportData(){
  const buildings=REG.buildings.map(b=>{
    const lic=ensureLicense(b);
    const d=loadBuildingData(b.id)||{apartments:[]};
    return{الاسم:b.name,المدينة:d.building?d.building.city:'',الخطة:planName(lic.plan),الحالة:lic.status,تاريخ_الانتهاء:lic.endDate||'بلا انتهاء',عدد_الوحدات:(d.apartments||[]).length,تاريخ_الانضمام:b.createdAt};
  });
  return{
    إجمالي_العملاء:REG.buildings.length,
    عملاء_نشطين:REG.buildings.filter(b=>ensureLicense(b).status==='active').length,
    عملاء_موقوفين_أو_منتهيين:REG.buildings.filter(b=>ensureLicense(b).status!=='active').length,
    عملاء_تجريبي:REG.buildings.filter(b=>{const p=findPlan(ensureLicense(b).plan);return p&&p.isTrial}).length,
    طلبات_تجديد_معلّقة:pendingRenewalsCount(),
    عمارات_في_سلة_المحذوفات:(REG.deletedBuildings||[]).length,
    عدد_الخطط_المتاحة:ensurePlans().length,
    تفاصيل_كل_عميل:buildings
  };
}
async function generateSysAIReport(mode){
  const ai=ensureAISettings('sysowner');
  const key=ai[ai.provider+'Key'];
  if(!key){goSys('sysaisettings');return;}
  const data=buildSysAIReportData();
  const base=`أنت مستشار أعمال بتساعد صاحب برنامج SaaS لإدارة اتحادات الملاك، بيبيع اشتراكات لرؤساء اتحادات العمارات. دي بيانات نشاطه الحالية بصيغة JSON:\n${JSON.stringify(data,null,1)}\n\n`;
  const prompt=base+(mode==='summary'
    ?'اكتب تقرير ملخص قصير وواضح بالعربية (نص صفحة كحد أقصى) عن حالة العملاء والاشتراكات.'
    :'اكتب تقرير تفصيلي شامل بالعربية: حلل توزيع العملاء على الخطط، وضّح المخاطر (عملاء قريبين من الانتهاء، طلبات تجديد معلّقة)، وقدّم توصيات عملية لزيادة عدد العملاء وتحسين معدل تحويل التجربة المجانية لاشتراك مدفوع.');
  openModal(`<h3>⏳ جارِ إنشاء التقرير...</h3><p class="small mtop">بيتم التواصل مع ${providerLabel(ai.provider)}، برجاء الانتظار...</p>`);
  try{
    const result=await callAIProvider(ai.provider,key,prompt);
    showAIReportResult(result,mode,'كل العملاء');
  }catch(e){
    openModal(`<h3>⚠️ تعذر إنشاء التقرير</h3><p class="small mtop">${esc(e.message||'حدث خطأ غير متوقع')}</p><p class="small">جرّب زرار "اختبار الاتصال" في إعدادات الذكاء الاصطناعي لمعرفة سبب الخطأ.</p><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">إغلاق</button></div>`);
  }
}

function importBackup(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.apartments||!data.users)throw new Error('bad');
      confirmDelete('سيتم استبدال كل بيانات هذه العمارة الحالية بالنسخة المستوردة نهائيًا.',()=>{
        D=data;migrateBuildingData();toast('تم استيراد البيانات بنجاح');renderRoot();
      });
    }catch(err){showMessage('الملف غير صالح كنسخة احتياطية لهذا النظام')}
  };
  reader.readAsText(file);
}

/* ---------- تشغيل التطبيق ---------- */
function setupPWA(){
  try{
    const iconSrc=(typeof REG!=='undefined'&&REG&&REG.brandSettings&&REG.brandSettings.logoDataUrl)?REG.brandSettings.logoDataUrl:DEFAULT_LOGO_DATAURI;
    // Apple touch icon (static data URI works directly)
    let appleIcon=document.querySelector('link[rel="apple-touch-icon"]');
    if(!appleIcon){appleIcon=document.createElement('link');appleIcon.rel='apple-touch-icon';document.head.appendChild(appleIcon);}
    appleIcon.href=iconSrc;
    let favicon=document.querySelector('link[rel="icon"]');
    if(favicon)favicon.href=iconSrc;
    // Web manifest built at runtime and exposed via Blob URL
    const manifest={
      name:'عمارتنا - إدارة اتحاد الملاك',
      short_name:'عمارتنا',
      description:'نظام إدارة اتحاد الملاك بسهولة واحترافية',
      start_url:location.pathname+location.search,
      display:'standalone',
      orientation:'portrait',
      background_color:'#F8FAF9',
      theme_color:'#159A8C',
      dir:'rtl',
      lang:'ar',
      icons:[{src:iconSrc,sizes:'any',type:'image/svg+xml',purpose:'any maskable'}]
    };
    const manifestBlob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    const manifestUrl=URL.createObjectURL(manifestBlob);
    let manifestLink=document.querySelector('link[rel="manifest"]');
    if(!manifestLink){manifestLink=document.createElement('link');manifestLink.rel='manifest';document.head.appendChild(manifestLink);}
    manifestLink.href=manifestUrl;
    // Basic service worker for offline shell caching (works when hosted; harmless no-op when opened as a local file)
    if('serviceWorker' in navigator && location.protocol!=='file:'){
      const swCode=`
        const CACHE_NAME='omaretna-shell-v1';
        self.addEventListener('install',e=>{
          e.waitUntil(caches.open(CACHE_NAME).then(c=>c.add(self.registration.scope)));
          self.skipWaiting();
        });
        self.addEventListener('activate',e=>{self.clients.claim();});
        self.addEventListener('fetch',e=>{
          if(e.request.method!=='GET')return;
          e.respondWith(
            fetch(e.request).then(res=>{
              const resClone=res.clone();
              caches.open(CACHE_NAME).then(c=>c.put(e.request,resClone));
              return res;
            }).catch(()=>caches.match(e.request).then(r=>r||caches.match(self.registration.scope)))
          );
        });
      `;
      const swBlob=new Blob([swCode],{type:'application/javascript'});
      const swUrl=URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(()=>{});
    }
  }catch(e){}
}
